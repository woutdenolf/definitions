nxds: '0.1'
class: NXspm_piezoelectric_material
category: base
extends: NXcrystal
doc: |-
  Description and properties of the piezoelectric actuator materials.
  The piezoelectric actuator is usually composed of polycrystalline solids and
  attached at the head of the tip or cantilever. The material deforms when the external electric field
  (e.g., electric force) is applied.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  name:
    node: dataset
    type: NX_CHAR
    doc: |-
      The name of the material of the piezo scanner such as Lead Zirconate Titanates
      (PZTs).
    via: [T1, T4, T7]
    provisional: [Q1]
  identifier_piezo_material:
    node: dataset
    doc: The identifier of the piezo material.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  chemical_formula:
    node: dataset
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  type:
    node: dataset
    type: NX_CHAR
    doc: |-
      The type of the material of the piezo scanner (e.g. piezoelectric ceramics,
      polymer-film piezoelectrics).
    via: [T1, T4, T7]
    provisional: [Q1]
  density:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: The density of the piezo material.
    via: [T1, T4, T7]
    provisional: [Q1]
  relative_permittivity:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: The relative permittivity (dielectric constant) of the piezo material.
    via: [T1, T4, T7]
    provisional: [Q1]
  D_piezoelectric_constant:
    node: dataset
    name: {template: '{D}_piezoelectric_constant'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      The D_piezoelectric_constant (with substitutable part D) piezoelectric charge coefficients of the material. The coefficients describe the electric
      polarization generated by the applied stress on the material. Different coefficients correspond to different
      relative directions of the polarization and the stress (e.g., d33, d31).
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  G_voltage_constant:
    node: dataset
    name: {template: '{G}_voltage_constant'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      The constants (with substitutable part G) define the electric field produced by the external mechanical strain. Different coefficients
      correspond to different relative directions of the electric field and the strain (e.g., g33, g31).
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  K_electromechanical_constant:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      The electromechanical constant measures the efficiency of the conversion of mechanical energy
      into electrical energy.
    via: [T1, T4, T7]
    provisional: [Q1]
  P_pyroelectric_constant:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      The pyroelectric constant defines the change of the polarization vector of the piezoelectric material
      per unit change in temperature.
    via: [T1, T4, T7]
    provisional: [Q1]
  acoustic_impedance:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: The acoustic impedance of the piezo material.
    via: [T1, T4, T7]
    provisional: [Q1]
  young_modulus:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: The Young's modulus of the piezo material.
    via: [T1, T4, T7]
    provisional: [Q1]
  surface_resistivity:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: The surface resistivity of the piezo material.
    via: [T1, T4, T7]
    provisional: [Q1]
  temperature_range:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_TEMPERATURE}
    doc: |-
      The temperature range of the piezo material. This field is expecting a range
      of temperatures in an array [min temperature, max temperature].
    via: [T1, T4, T7]
    provisional: [Q1]
  glass_transition_temperature:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_TEMPERATURE}
    doc: |-
      The range of temperature where a piezoelectric hard material transforms into the
      viscous state.
    via: [T1, T4, T7]
    provisional: [Q1]
