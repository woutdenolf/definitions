nxds: '0.1'
class: NXspm
category: application
extends: NXsensor_scan
describes: NXroot
doc: |-
  Scanning Probe Microscopy (SPM) is a branch of microscopy that utilizes a physical probe to scan the surface of
  sample and image it at the atomic level.

  The application class NXspm is designed as a skeleton and contains common technical concepts
  for specific SPM sub-techniques such as STM, STS, AFM etc. In addition, it can be utilized to
  describe the SPM experiments without further specialization for each sub-technique.
defaults: {min: 1, binding: true, type: NX_CHAR}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      definition:
        node: dataset
        enum: [NXspm]
        doc: Name of the definition that is used for the application.
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      experiment_technique:
        node: dataset
        enum: [STM, STS, AFM]
        doc: The technique of the experiment like STM, STS, AFM.
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      scan_mode:
        node: dataset
        occurs: {min: 0}
        enum:
          values:
          - {value: constant height}
          - {value: constant current}
          - {value: contact mode}
          - {value: tapping mode}
          - {value: peak force tapping mode}
          - {value: non-contact mode}
          open: true
        doc: |-
          The mode of the scan. The possible options depend on the type of experiment.
          For example, in STM, the scan mode could be constant height or constant current,
          in AFM, the scan mode could be contact mode, tapping mode or non-contact mode.

          For general purpose usage, all scan modes from its sub-techniques are listed.
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      scan_type:
        node: dataset
        occurs: {min: 0}
        recommended: true
        doc: |-
          The type of the scan. It mainly describes how scan probe moves in the scan region, e.g.
          forward, backward, or both (if scan is repeated). Any lab defined scan type
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      identifier_experiment:
        node: dataset
        occurs: {min: 0}
        recommended: true
        doc: The identifier for the experiment which should be unique at least in lab.
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      PROCESS:
        node: group
        name: {any: true}
        class: NXprocess
        occurs: {min: 0}
        doc: |-
          Define data processing (e.g., data analysis, image processing) program and
          associated workflow, software and store results.
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        children:
          hardware:
            node: group
            class: NXfabrication
            doc: |-
              The hardware description of core instrument setup of experiment.
              Usually, the entire instrument is supplied by a single manufacturer.
              To describe the hardware from any sub-components, use the ``hardware`` group of that
              sub-component (child group of the NXinstrument group) group.
            children:
              name:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: Name of the hardware.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              vendor:
                node: dataset
                doc: Company name of the manufacturer.
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              model:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: Version or model of the hardware setup provided by the manufacturer.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          software:
            node: group
            class: NXfabrication
            doc: |-
              The software description of core instrument setup of experiment.
              Usually, the entire instrument is supplied by a single name/manufacturer/model/etc.
              To describe the software from any sub-components, use the ``software`` group of that component.
            children:
              name:
                node: dataset
                occurs: {min: 0}
                doc: Name of the software.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              vendor:
                node: dataset
                doc: Company name of the manufacturer.
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              model:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: Version or model of the component named by the manufacturer.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          real_time_controller:
            node: group
            class: NXrcs
            occurs: {min: 0}
            recommended: true
            via: [T1, T6, T7]
            provisional: [Q1]
          lockin_amplifier:
            node: group
            class: NXlockin
            occurs: {min: 0}
            doc: The lock-in amplifier information.
            children:
              flip_sign:
                node: dataset
                occurs: {min: 0}
                type: NX_NUMBER
                doc: |-
                  The sign (1 or -1) that renders the values of the lock-in current positive.
                  The calibration procedure with retracted tip is normally performed to compensate for the signal phase delay
                  in SPM. The procedure yields two possible solutions corresponding to the chosen phase, this number should be equal
                  to 1 or -1 depending on which solution is chosen (this concept mainly used in STS experiments).
                via: [T1, T6, T7]
                provisional: [Q1]
              active_channel:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: |-
                  The name of the active channel of the lock-in amplifier which is used for the
                  measurement.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          SCAN_ENVIRONMENT:
            node: group
            name: {any: true}
            class: NXenvironment
            doc: |-
              Information of the scan environment holding concept for
              temperature, setpoint (current or height), scan area and scan data.

              Note: At least one field from head_temperature, cryo_bottom_temperature and cryo_shield_temperature must be provided.
            children:
              head_temperature:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_TEMPERATURE}
                doc: |-
                  Temperature (stabilized or target value) of STM head. For array data of head_temperature, use
                  head_temperature_sensor group.
                via: [T1, T6, T7]
                provisional: [Q1]
              identifier_environment:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: |-
                  Unique identifier for the scan environment defined by the user or lab. When multiple scans are performed
                  in a single environment conditions or settings, the entire scan environment can be differentiated
                  by this identifier. For example, scan on a sample of TiSe2 with layered of evaporated pyrene and
                  annealed at 300K temperature for 5 min process.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              cryo_bottom_temperature:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_TEMPERATURE}
                doc: |-
                  Temperature (stabilized or targeted single value) of the cold tail of the cryostat. For array data of
                  cryo_bottom_temperature, use cryo_bottom_temperature_sensor group.
                via: [T1, T6, T7]
                provisional: [Q1]
              cryo_shield_temperature:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_TEMPERATURE}
                doc: |-
                  Temperature (stabilized or targeted single value) of liquid nitrogen shield.
                  For array data of cryo_shield_temperature, use cryo_shield_temperature_sensor group.
                via: [T1, T6, T7]
                provisional: [Q1]
              current_sensorTAG:
                node: group
                name: {template: 'current_sensor{TAG}'}
                class: NXsensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to
                  /entry/instrument/current_sensorTAG
                via: [T1, T3, T6, T7]
                provisional: [Q1, Q3]
              voltage_sensorTAG:
                node: group
                name: {template: 'voltage_sensor{TAG}'}
                class: NXsensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to
                  /entry/instrument/voltage_sensorTAG
                via: [T1, T3, T6, T7]
                provisional: [Q1, Q3]
              piezo_sensor:
                node: group
                class: NXspm_piezo_sensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to
                  /entry/instrument/piezo_sensor.
                via: [T1, T6, T7]
                provisional: [Q1]
              XYZpiezo_sensor:
                node: group
                name: {template: '{XYZ}piezo_sensor'}
                class: NXspm_piezo_sensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to
                  /entry/instrument/XYZpiezo_sensor.
                via: [T1, T3, T6, T7]
                provisional: [Q1, Q3]
              height_piezo_sensor:
                node: group
                class: NXspm_piezo_sensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to the concept
                  entry/instrument/height_piezo_sensor.
                via: [T1, T6, T7]
                provisional: [Q1]
              SPM_SCAN_CONTROL:
                node: group
                name: {any: true}
                class: NXspm_scan_control
                doc: |-
                  The scan control information like scan region or phase space, type of scan (e.g.
                  mesh, spiral, etc.), and scan speed, etc. This group mainly stores the scan settings
                  data. For processed data or final experimental data would go to NXdata group.
                children:
                  scanTAG:
                    node: dataset
                    name: {template: 'scan{TAG}'}
                    occurs: {min: 0}
                    recommended: true
                    doc: |-
                      If there are multiple scans performed under the same environment, use this field
                      to differentiate among them.
                    via: [T0, T1, T3, T6, T7]
                    provisional: [Q1, Q3]
                  scan_region:
                    node: group
                    class: NXspm_scan_region
                    doc: |-
                      The scan region (phase space or sub-phase space) is the region where the scan is
                      performed.
                    children:
                      scan_range_x:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The range of the scan in x direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      scan_range_y:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The range of the scan in y direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      scan_offset_value_x:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The offset of the scan in x direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      scan_offset_value_y:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The offset of the scan in y direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      scan_angle_x:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_ANGLE}
                        doc: The angle of the scan region in x direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      scan_angle_y:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_ANGLE}
                        doc: The angle of the scan region in y direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      scan_start_x:
                        node: dataset
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The start of the scan in x direction.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      scan_start_y:
                        node: dataset
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The start of the scan in y direction.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      scan_end_x:
                        node: dataset
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The end of the scan in x direction.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      scan_end_y:
                        node: dataset
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The end of the scan in y direction.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  meshSCAN:
                    node: group
                    name: {template: 'mesh{SCAN}'}
                    class: NXspm_scan_pattern
                    doc: |-
                      The mesh scan is a common technique used in SPM to scan the surface of the sample
                      in a grid pattern.
                    children:
                      scan_points_x:
                        node: dataset
                        type: NX_NUMBER
                        doc: The number of points scanned in x direction.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      scan_points_y:
                        node: dataset
                        type: NX_NUMBER
                        doc: The number of points scanned in y direction.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      step_size_x:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The step size in x direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      step_size_y:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_NUMBER
                        units: {category: NX_LENGTH}
                        doc: The step size in y direction.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                    via: [T1, T3, T5, T7]
                    provisional: [Q1, Q2, Q3]
                via: [T1, T2, T5, T7]
                provisional: [Q1, Q2, Q11]
            via: [T1, T3, T5, T7]
            provisional: [Q1, Q2, Q3]
          current_sensorTAG:
            node: group
            name: {template: 'current_sensor{TAG}'}
            class: NXsensor
            occurs: {min: 0}
            doc: |-
              Information for current sensor. Any current sensor such as a current-voltage transimpedance amplifier involved in the experiment or
              in any special measurement or in any specialized experiment component can be
              registered under this group.
            children:
              NAMEcurrent:
                node: dataset
                name: {template: '{NAME}current'}
                occurs: {min: 0}
                type: NX_CHAR
                doc: The name of the current sensor used for specific measurement or in component.
                via: [T1, T3, T6, T7]
                provisional: [Q1, Q3]
              current:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_CURRENT}
                doc: |-
                  Name of the current according to the purpose of the measurement.
                  E.g., the field can be named as tip_current defining the current measured at the tip.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              offset_value:
                node: dataset
                occurs: {min: 0}
                type: NX_NUMBER
                units: {category: NX_CURRENT}
                doc: The offset in the tunneling current between tip and sample.
                via: [T1, T6, T7]
                provisional: [Q1]
              calibration:
                node: group
                class: NXcalibration
                occurs: {min: 0}
                doc: Calibration data of the current sensor.
                children:
                  calibration_parameters:
                    node: group
                    class: NXparameters
                    occurs: {min: 0}
                    children:
                      coefficient:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_NUMBER
                        units: {category: NX_ANY}
                        doc: The coefficient of the calibration.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              AMPLIFIER:
                node: group
                name: {any: true}
                class: NXamplifier
                occurs: {min: 0}
                doc: An amplifier information that amplifies the input signal.
                children:
                  current_gain:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_NUMBER
                    units: {category: NX_UNITLESS}
                    doc: The gain of the current sensor.
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T2, T6, T7]
                provisional: [Q1, Q11]
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          voltage_sensorTAG:
            node: group
            name: {template: 'voltage_sensor{TAG}'}
            class: NXsensor
            occurs: {min: 0}
            doc: |-
              The sensor information for the voltage device. Any voltage sensor involved in the
              experiment or in any special measurement or in any specialized experiment component
              can be registered under this group.

              For this purpose, replace the TAG with the specific name or ID of the voltage sensor.

              Do not register this group for sample bias voltage (DC), for that we have :ref:`sample_bias_voltage </NXspm/entry/instrument/sample_bias_voltage-group>` group.
            children:
              NAMEvoltage:
                node: dataset
                name: {template: '{NAME}voltage'}
                occurs: {min: 0}
                type: NX_CHAR
                doc: |-
                  The name of the voltage according to the purpose of the measurement.
                  E.g., the field can be named as x_source_drain_bias_voltage defining
                  the applied bias along the x-axis as source-drain channel, while current
                  (tip current) will be measured along the z-axis.
                via: [T1, T3, T6, T7]
                provisional: [Q1, Q3]
              voltage:
                node: dataset
                occurs: {min: 0}
                type: NX_NUMBER
                units: {category: NX_VOLTAGE}
                doc: Voltage measured by sensor.
                via: [T1, T6, T7]
                provisional: [Q1]
              offset_value:
                node: dataset
                occurs: {min: 0}
                type: NX_NUMBER
                units: {category: NX_VOLTAGE}
                doc: |-
                  The offset voltage. The real voltage is the sum of the voltage and the offset
                  voltage.
                via: [T1, T6, T7]
                provisional: [Q1]
              calibration:
                node: group
                class: NXcalibration
                occurs: {min: 0}
                doc: Calibration data of the voltage sensor.
                children:
                  calibration_parameters:
                    node: group
                    class: NXparameters
                    occurs: {min: 0}
                    children:
                      coefficient:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_NUMBER
                        units: {category: NX_ANY}
                        doc: The coefficient of the calibration.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              AMPLIFIER:
                node: group
                name: {any: true}
                class: NXamplifier
                occurs: {min: 0}
                doc: An amplifier information that amplifies the input signal.
                children:
                  voltage_gain:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_NUMBER
                    units: {category: NX_UNITLESS}
                    doc: The gain of the voltage sensor.
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T2, T6, T7]
                provisional: [Q1, Q11]
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          piezo_sensor:
            node: group
            class: NXspm_piezo_sensor
            occurs: {min: 0}
            doc: This piezo sensor group refers to the XYZ (in all directions) piezo sensor.
            children:
              x:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_LENGTH}
                doc: The x position of the piezo.
                via: [T1, T6, T7]
                provisional: [Q1]
              y:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_LENGTH}
                doc: The y position of the piezo.
                via: [T1, T6, T7]
                provisional: [Q1]
              z:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_LENGTH}
                doc: The z position of the piezo.
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          height_piezo_sensor:
            node: group
            class: NXspm_piezo_sensor
            occurs: {min: 0}
            recommended: true
            doc: The sensor information for the height (Z-axis) piezo device.
            via: [T1, T6, T7]
            provisional: [Q1]
          XYZpiezo_sensor:
            node: group
            name: {template: '{XYZ}piezo_sensor'}
            class: NXspm_piezo_sensor
            occurs: {min: 0}
            doc: |-
              For separate piezo sensors along X-, Y-, and Z-axis register this group, e.g., x_piezo_sensor
              or height_piezo_sensor.
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          head_temperature_sensor:
            node: group
            class: NXspm_temperature_sensor
            occurs: {min: 0}
            recommended: true
            doc: |-
              The temperature of the SPM measured near the sample or tip. This group is intended to be used for
              an array data (e.g., time series).
            via: [T1, T6, T7]
            provisional: [Q1]
          cryo_bottom_temperature_sensor:
            node: group
            class: NXspm_temperature_sensor
            occurs: {min: 0}
            doc: |-
              The temperature of the cold tail of the cryostat. This group is intended to be
              used for an array data (e.g., time series).
            via: [T1, T6, T7]
            provisional: [Q1]
          cryo_shield_temperature_sensor:
            node: group
            class: NXspm_temperature_sensor
            occurs: {min: 0}
            doc: |-
              The temperature of the liquid nitrogen shield. This group is intended to be used
              for an array data (e.g., time series).
            via: [T1, T6, T7]
            provisional: [Q1]
          sample_temperature_sensor:
            node: group
            class: NXspm_temperature_sensor
            occurs: {min: 0}
            doc: |-
              The temperature of the sample. This group is intended to be used for
              an array data (e.g., time series).
            via: [T1, T6, T7]
            provisional: [Q1]
          bias_spectroscopy_environment:
            node: group
            class: NXenvironment
            occurs: {min: 0}
            doc: |-
              To explain bias and current behavior (sweep measurement especially in STS experiment)
              due to voltage applied to the sample.

              In some experiments, e.g., STM, bias spectroscopy could also be part of the measurement setup.
            children:
              SPM_BIAS_SPECTROSCOPY:
                node: group
                name: {any: true}
                class: NXspm_bias_spectroscopy
                doc: |-
                  Setup and scan data for continuous measurement of bias voltage on the subject of experiment
                  vs tunneling current from probe.
                children:
                  SPM_POSITIONER:
                    node: group
                    name: {any: true}
                    class: NXspm_positioner
                    occurs: {min: 0}
                    recommended: true
                    doc: |-
                      Information about positioner used in STS scan settings, like PID controller and offset.

                      Reuse, if needed, this group for positioners for multiple scans at different points on sample.
                    children:
                      z_controller:
                        node: group
                        class: NXpid_controller
                        occurs: {min: 0}
                        recommended: true
                        via: [T1, T6, T7]
                        provisional: [Q1]
                    via: [T1, T2, T6, T7]
                    provisional: [Q1, Q11]
                  BIAS_SWEEP:
                    node: group
                    name: {any: true}
                    class: NXspm_scan_control
                    doc: |-
                      The bias voltage sweep is a common technique used to study properties (in this case current) in
                      the sample or environment due to change in applied bias voltage.
                    children:
                      scan_region:
                        node: group
                        class: NXspm_scan_region
                        doc: |-
                          The scan region (phase space or sub-phase space) is the region where the scan is
                          performed.
                        children:
                          scan_start_bias:
                            node: dataset
                            type: NX_NUMBER
                            units: {category: NX_VOLTAGE}
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          scan_end_bias:
                            node: dataset
                            type: NX_NUMBER
                            units: {category: NX_VOLTAGE}
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          scan_offset_bias:
                            node: dataset
                            type: NX_NUMBER
                            units: {category: NX_VOLTAGE}
                            doc: The offset of the bias scan voltage.
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          scan_range_bias:
                            node: dataset
                            occurs: {min: 0}
                            recommended: true
                            type: NX_NUMBER
                            units: {category: NX_VOLTAGE}
                            via: [T1, T6, T7]
                            provisional: [Q1]
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      linear_sweep:
                        node: group
                        class: NXspm_scan_pattern
                        doc: |-
                          The linear sweep is a common technique used on the substance or sample or environment
                          to study the change in the behavior of the sample or substance or environment due to change
                          in applied  bias voltage.
                        children:
                          scan_points_bias:
                            node: dataset
                            type: NX_NUMBER
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          step_size_bias:
                            node: dataset
                            type: NX_NUMBER
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T3, T5, T7]
                    provisional: [Q1, Q2, Q3]
                via: [T1, T2, T5, T7]
                provisional: [Q1, Q2, Q11]
            via: [T1, T6, T7]
            provisional: [Q1]
          sample_bias_voltage:
            node: group
            class: NXsensor
            occurs: {min: 0}
            doc: |-
              The DC bias voltage that is applied to the sample (for example in constant-
              current mode in STM).
            children:
              bias_voltage:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_VOLTAGE}
                doc: The bias voltage (DC) applied to the sample.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              bias_offset_value:
                node: dataset
                occurs: {min: 0}
                type: NX_NUMBER
                units: {category: NX_VOLTAGE}
                doc: Offset value of the bias voltage.
                via: [T1, T6, T7]
                provisional: [Q1]
              calibration:
                node: group
                class: NXcalibration
                occurs: {min: 0}
                doc: Calibration of the bias voltage measurement (V/V).
                children:
                  calibration_parameters:
                    node: group
                    class: NXparameters
                    occurs: {min: 0}
                    children:
                      coefficient:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_NUMBER
                        units: {category: NX_ANY}
                        doc: The coefficient of the calibration.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      SAMPLE:
        node: group
        name: {any: true}
        class: NXsample
        occurs: {min: 0}
        doc: The sample information.
        children:
          history:
            node: group
            class: NXhistory
            occurs: {min: 0}
            recommended: true
            doc: A set of physical processes that occurred to the sample prior/during experiment.
            via: [T1, T6, T7]
            provisional: [Q1]
          sample_environment:
            node: group
            class: NXenvironment
            occurs: {min: 0}
            doc: Information of environment around the sample.
            children:
              temperature:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_TEMPERATURE}
                doc: |-
                  The single-valued temperature of the sample, also referred to as the tip temperature
                  (not head temperature), since the tip and sample are in contact or in close proximity.
                  For array like temperature data use sample_temperature_sensor group.
                via: [T1, T6, T7]
                provisional: [Q1]
              sample_bias_voltage:
                node: group
                class: NXsensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to

                  /entry/instrument/sample_bias_voltage sensor under instrument.
                via: [T1, T6, T7]
                provisional: [Q1]
              sample_temperature_sensor:
                node: group
                class: NXspm_temperature_sensor
                occurs: {min: 0}
                doc: |-
                  This should be a link to

                  /entry/instrument/sample_temperature_sensor under instrument.
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      DATA:
        node: group
        name: {any: true}
        class: NXdata
        doc: The data group.
        children:
          DATA:
            node: dataset
            name: {any: true}
            type: NX_NUMBER
            units: {category: NX_ANY}
            doc: |-
              The data (e.g. current, voltage, temperature) field that can be plotted against
              the axes.
            via: [T1, T3, T5, T7]
            provisional: [Q1, Q2, Q3]
          AXISNAME:
            node: dataset
            name: {any: true}
            type: NX_CHAR_OR_NUMBER
            units: {category: NX_ANY}
            doc: The name of the axis that corresponds to the data field.
            via: [T1, T3, T5, T7]
            provisional: [Q1, Q2, Q3]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      reproducibility_indicators:
        node: group
        class: NXcollection
        occurs: {min: 0}
        doc: |-
          The group of indicators (links to the existing fields in different groups) that measure
          the reproducibility of the experiment.
        children:
          LINK_TO_GROUP:
            node: group
            name: {any: true}
            class: NXcollection
            occurs: {min: 0}
            doc: |-
              A place holder to create link to any group relevant considered as
              reproducibility indicators (defined by laboratory).
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          LINK_TO_FIELD:
            node: dataset
            name: {any: true}
            occurs: {min: 0}
            type: NX_CHAR
            doc: |-
              A place holder to create link to any field relevant considered as
              reproducibility indicators (defined by laboratory).
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
        via: [T1, T6, T7]
        provisional: [Q1]
      resolution_indicators:
        node: group
        class: NXcollection
        occurs: {min: 0}
        doc: |-
          The group of indicators (links to the existing fields in different groups) that
          are used to measure the resolution of the experiment results.
        children:
          LINK_TO_GROUP:
            node: group
            name: {any: true}
            class: NXcollection
            occurs: {min: 0}
            doc: |-
              A place holder to create link to any group relevant considered as
              reproducibility indicators (defined by laboratory).
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          LINK_TO_FIELD:
            node: dataset
            name: {any: true}
            occurs: {min: 0}
            type: NX_CHAR
            doc: |-
              A place holder to create link to any field relevant considered as
              reproducibility indicators (defined by laboratory).
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
        via: [T1, T6, T7]
        provisional: [Q1]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
