nxds: '0.1'
class: NXapm_paraprobe_tessellator_results
category: application
extends: NXapm_paraprobe_tool_results
describes: NXroot
doc: |-
  Application definition for a results file of the paraprobe-tessellator tool.

  The tool paraprobe-tessellator computes a tessellation of the reconstructed positions.
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  n_ions:
    doc: The total number of ions in the reconstruction.
  n_f:
    doc: The total number of values required to represent all faces of each cell.
  n_f_xdmf:
    doc: |-
      The total number of values required to represent all faces of each cell
      (polyhedron) using XDMF.
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    occurs: {min: 1, max: 1}
    children:
      definition:
        node: dataset
        type: NX_CHAR
        enum: [NXapm_paraprobe_tessellator_results]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      tessellationID:
        node: group
        name: {template: 'tessellation{ID}'}
        class: NXapm_paraprobe_tool_process
        occurs: {min: 1, max: 1}
        doc: |-
          The tool can be used to compute a Voronoi tessellation the entire
          or of a sub-set of the reconstructed volume. Each point (ion) is wrapped
          in one (Voronoi) cell. The point cloud in the ROI is wrapped into an
          axis-aligned bounding box (AABB) that is tight. This means points at
          the edge of the point cloud can lay on the surface of the bounding box.
          The tool detects if cells make contact with the walls of this bounding box.
          The tessellation is computed without periodic boundary conditions.
        children:
          wall:
            node: group
            class: NXcg_hexahedron
            occurs: {min: 0}
            recommended: true
            doc: The (tight) axis-aligned bounding box about the point cloud.
            children:
              closest_corner:
                node: dataset
                type: NX_FLOAT
                shape: [3]
                units: {category: NX_LENGTH}
                doc: |-
                  Coordinate triplet of the corner that lays closest
                  to the origin of the *paraprobe* coordinate system.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              farthest_corner:
                node: dataset
                type: NX_FLOAT
                shape: [3]
                units: {category: NX_LENGTH}
                doc: |-
                  Coordinate triplet of the corner that lays farthest away
                  from the origin of the *paraprobe* coordinate system.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          voronoi_cells:
            node: group
            class: NXcg_polyhedron
            occurs: {min: 0}
            children:
              dimensionality:
                node: dataset
                type: NX_POSINT
                enum: ['3']
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              cardinality:
                node: dataset
                type: NX_POSINT
                doc: The number of points (and thus cells).
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              volume:
                node: dataset
                type: NX_FLOAT
                shape: [n_ions]
                units: {category: NX_VOLUME}
                doc: Volume of each Voronoi cell.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              process_id:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [n_ions]
                units: {category: NX_UNITLESS}
                doc: Which MPI process computed which Voronoi cell.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              thread_id:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [n_ions]
                units: {category: NX_UNITLESS}
                doc: Which OpenMP thread computed which Voronoi cell.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              number_of_faces:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [n_ions]
                units: {category: NX_UNITLESS}
                doc: |-
                  The number of faces for each cell. Faces of adjoining polyhedra are counted
                  for each polyhedron. This field can be used to interpret the concatenated vector
                  with the individual values for the area of each face.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              index_offset:
                node: dataset
                type: NX_INT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              polyhedra:
                node: group
                class: NXcg_face_list_data_structure
                occurs: {min: 0}
                doc: |-
                  A simple approach to describe the entire set of polyhedra when the main
                  intention is to store the shape of the polyhedra for visualization purposes.
                children:
                  number_of_vertices:
                    node: dataset
                    type: NX_UINT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  number_of_faces:
                    node: dataset
                    type: NX_UINT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  indices_offset_vertex:
                    node: dataset
                    type: NX_INT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  indices_offset_face:
                    node: dataset
                    type: NX_INT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  vertices:
                    node: dataset
                    type: NX_FLOAT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T6, T7]
                provisional: [Q1]
              xdmf_topology:
                node: dataset
                type: NX_UINT
                shape: [n_f_xdmf]
                units: {category: NX_UNITLESS}
                doc: |-
                  Sequence of tuples, concatenated in the order of  the Voronoi cells.
                  Each tuple contains encodes information to visualize using XDMF:
                  Firstly, an XDMF geometric primitive type key.
                  Secondly, the number of vertices of the polygon.
                  Third, the sequence of indices_vertex which define the facet.
                  Tuples encode faces faster than cells.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              xdmf_cell_id:
                node: dataset
                type: NX_UINT
                shape: [n_f]
                units: {category: NX_UNITLESS}
                doc: |-
                  Sequence of cell identifier, concatenated such that each face is
                  associated with its cell. Given that paraprobe-tessellator assigns
                  each cell the evaporation_id of the ion that the cell wraps this
                  information enables the segmentation of the tessellation and
                  thus correlate per-ion properties with the volume that each cell
                  represents.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_global:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              A bitmask that documents which of the cells are likely truncated because they
              share at least one face with the *aabb* of the point cloud. This field encodes the
              result of the boolean or operator applied to the value of all six wall_contact groups
              that document contact in specific outer unit normal directions of the *aabb*.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_left:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              In the spirit of wall_contact_global, the left face of *aabb*.
              Its outer unit normal points in the opposite direction of the
              x-axis of the *paraprobe* coordinate system.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_right:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              In the spirit of wall_contact_global, the right face of *aabb*.
              Its outer unit normal points in the direction of the x-axis
              of the *paraprobe* coordinate system.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_front:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              In the spirit of wall_contact_global, the front face of *aabb*.
              Its outer unit normal points in the opposite direction of the
              y-axis of the *paraprobe* coordinate system.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_rear:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              In the spirit of wall_contact_global, the rear face of *aabb*.
              Its outer unit normal points in the direction of the y-axis
              of the *paraprobe* coordinate system.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_bottom:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              In the spirit of wall_contact_global, the front face of *aabb*.
              Its outer unit normal points in the opposite direction of the
              z-axis of the *paraprobe* coordinate system.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          wall_contact_top:
            node: group
            class: NXcs_filter_boolean_mask
            occurs: {min: 0}
            recommended: true
            doc: |-
              In the spirit of wall_contact_global, the front face of *aabb*.
              Its outer unit normal points in the direction of the z-axis of the
              *paraprobe* coordinate system.
            children:
              number_of_objects:
                node: dataset
                type: NX_UINT
                shape: [n_ions]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
        via: [T1, T3, T6]
        provisional: [Q1, Q3]
    via: [T1, T2, T6]
    provisional: [Q1, Q11]
via: [T8]
