nxds: '0.1'
class: NXquadric
category: base
extends: NXobject
doc: Definition of a quadric surface.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  parameters:
    node: dataset
    type: NX_NUMBER
    shape: [10]
    units: {category: NX_PER_LENGTH}
    doc: |-
      Ten real values of the matrix that defines the quadric surface
      in projective space. Ordered Q11, Q12, Q13, Q22, Q23, Q33, P1,
      P2, P3, R. Takes a units attribute of dimension reciprocal
      length. R is scalar. P has dimension reciprocal length, and the
      given units. Q has dimension reciprocal length squared, and
      units the square of those given.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  surface_type:
    node: dataset
    occurs: {min: 0, max: 1}
    enum: [ELLIPSOID, ELLIPTIC_PARABOLOID, HYPERBOLIC_PARABOLOID, ELLIPTIC_HYPERBOLOID_OF_1_SHEET,
      ELLIPTIC_HYPERBOLOID_OF_2_SHEETS, ELLIPTIC_CONE, ELLIPTIC_CYLINDER, HYPERBOLIC_CYLINDER,
      PARABOLIC_CYLINDER, SPHEROID, SPHERE, PARABOLOID, HYPERBOLOID_1_SHEET, HYPERBOLOID_2_SHEET,
      CONE, CYLINDER, PLANE, IMAGINARY, UNKNOWN]
    doc: 'An optional description of the form of the quadric surface:'
    via: [T0, T1, T6]
    provisional: [Q1]
  depends_on:
    node: dataset
    occurs: {min: 0, max: 1}
    type: NX_CHAR
    doc: |-
      Path to an :ref:`NXtransformations` that defining the axis on
      which the orientation of the surface depends.
    via: [T1, T6]
    provisional: [Q1]
