nxds: '0.1'
class: NXspm_scan_pattern
category: base
extends: NXobject
doc: |-
  Basic base class to define the pattern of a scan in a given scan region.

  The base class is intended to handle the following scan types or patterns:

  Trajectory: A list of N-dimensional sequential vectors, representing a point in phase space, describes
    the trajectory line for a full scan.
  Mesh: For each dimension, a range and a direction are chosen. When a scan along a dimension is done, a
    single step in the next dimension is taken, and then the scan in the previous dimension is repeated.
    As such we can speak about the fastest and the slowest scan axes.

  Snake: Similar to a mesh scan but the current scanning direction reversed after each line completed.
  Spiral: A scan taken along a spiral trajectory.
  Tilt: At each step, a proportional movement is done in all dimensions (an special case of Trajectory scan).
  Linear: A scan where the scanning will be performed along a single independent axis.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  scan_speedN:
    node: dataset
    name: {template: 'scan_speed{N}'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      Define the scan speed in the forward direction along the axis (except the spiral and trajectory scans),
      if forward and backward speeds below are not specified.

      If the scan goes in the negative direction, the speed should be negative.

      Rename the field, according to the name of the dimension (e.g. scan_speed_x, scan_speed_voltage).

      Trajectory scan: N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  forward_speedN:
    node: dataset
    name: {template: 'forward_speed{N}'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      Define the scan speed in the forward directions (except the spiral and trajectory scans).
      Rename the field, according to the name of the dimension.

      Trajectory scan: N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  backward_speedN:
    node: dataset
    name: {template: 'backward_speed{N}'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      Define the scan speed in the backward directions (except the spiral and trajectory scans).
      Rename the field, according to the name of the dimension.

      Trajectory scan: N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  channelNAME:
    node: dataset
    name: {template: 'channel{NAME}'}
    doc: |-
      Name of the channel that leads the scan data. The ending annotation 'NAME' is to represent the name of the channel and/or dimension.

      Rename the field, according to the name of the channel and dimension (e.g. channel_piezo_scanner_x).
    via: [T0, T1, T3, T4, T7]
    provisional: [Q1, Q3]
  scan_pointsN:
    node: dataset
    name: {template: 'scan_points{N}'}
    type: NX_NUMBER
    doc: |-
      Define the total number of points in the given axis the scan to be performed (except the spiral and trajectory scans).
      Rename the field, according to the name of the dimension (e.g. scan_points_x, scan_points_voltage).

      Trajectory scan: N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  steppingN:
    node: dataset
    name: {template: 'stepping{N}'}
    type: NX_NUMBER
    doc: |-
      The number of steps the probe jumps over the scan steps or points in the scanning process. This comes into picture, when not
      every point from the scan_points is scanned along an axis (except the spiral and trajectory scans).

      Rename the field, according to the name of the dimension (e.g. stepping_x, stepping_voltage).

      Trajectory scan:  N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  step_sizeN:
    node: dataset
    name: {template: 'step_size{N}'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      The size of each step in the scan on each dimension (except the spiral and trajectory scans).

      Rename the field, according to the name of the dimension (e.g. step_size_x, step_size_voltage).

      Trajectory scan:  N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  continuousN:
    node: dataset
    name: {template: 'continuous{N}'}
    type: NX_BOOLEAN
    doc: |-
      If the scan probe moves continuously over the scan points or steps, use True. The default value is True.
      Usually, continuous scanning is possible in one dimension. On other dimensions, the scan probe moves
      in steps.

      Rename the field, according to the name of the dimension (e.g. continuous_voltage).

      Trajectory scan: N refers to the nth trajectory line (line between two trajectory points).
      Spiral scan: N refers to the nth circle from center.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  oscillating:
    node: dataset
    type: NX_BOOLEAN
    doc: |-
      If the scan probe oscillates over the scan point, use True.
      The default value is False.
    via: [T1, T4, T7]
    provisional: [Q1]
  oscillation_frequency:
    node: dataset
    type: NX_NUMBER
    doc: The number of oscillations on each scanning point per second.
    via: [T1, T4, T7]
    provisional: [Q1]
  number_of_trajectory_points:
    node: dataset
    type: NX_NUMBER
    doc: |-
      The number of trajectory points in the entire scan that defines the path or lines of the trajectory.
      Each trajectory line is defined by two subsequent trajectory points.
    via: [T1, T4, T7]
    provisional: [Q1]
  trajectory_points:
    node: dataset
    type: NX_NUMBER
    shape: [nTraj, nD]
    doc: |-
      The trajectory points (nTraj) are the N-dimensional vectors (nD), each vector refers to a point in
      N-dimensional phase space.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  spiral_radiusN:
    node: dataset
    name: {template: 'spiral_radius{N}'}
    type: NX_NUMBER
    units: {category: NX_ANY}
    doc: |-
      Define the radius of the spiral circle of scanning.

      Rename the field, according to the circle order, the nearest circle to the center is 0.
    via: [T1, T3, T4, T7]
    provisional: [Q1, Q3]
  DATA:
    node: group
    name: {any: true}
    class: NXdata
    doc: |-
      The scan data is the data collected during the scan.
      If the scan has several channels or derivatives from the channel data, please
      duplicate this NXdata group for each.
    children:
      DATA:
        node: dataset
        name: {any: true}
        type: NX_NUMBER
        units: {category: NX_ANY}
        doc: |-
          The data (e.g. current, voltage, temperature) field that can be plotted against
          the axes.
        via: [T1, T3, T4, T7]
        provisional: [Q1, Q3]
      AXISNAME:
        node: dataset
        name: {any: true}
        type: NX_CHAR_OR_NUMBER
        units: {category: NX_ANY}
        doc: The name of the axis that corresponds to the data field.
        via: [T1, T3, T4, T7]
        provisional: [Q1, Q3]
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
