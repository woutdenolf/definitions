nxds: '0.1'
class: NXapm_paraprobe_nanochem_results
category: application
extends: NXapm_paraprobe_tool_results
describes: NXroot
doc: Application definition for a results file of the paraprobe-nanochem tool.
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  n_ions:
    doc: The total number of ions in the reconstruction.
  n_atomic:
    doc: The total number of atoms in the atomic_decomposition match filter.
  n_isotopic:
    doc: The total number of isotopes in the isotopic_decomposition match filter.
  d:
    doc: The dimensionality of the delocalization grid.
  c:
    doc: The cardinality/total number of cells/grid points in the delocalization grid.
  n_f_tri: {doc: The total number of faces of triangles.}
  n_f_tri_xdmf:
    doc: The total number of XDMF values to represent all faces of triangles via XDMF.
  n_feature_dict:
    doc: The total number of entries in a feature dictionary.
  n_v_feat:
    doc: The total number of volumetric features.
  n_speci:
    doc: The total number of member distinguished when reporting composition.
  n_rois:
    doc: The total number of ROIs placed in a oned_profile task.
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    occurs: {min: 1, max: 1}
    children:
      definition:
        node: dataset
        type: NX_CHAR
        enum: [NXapm_paraprobe_nanochem_results]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      delocalizationID:
        node: group
        name: {template: 'delocalization{ID}'}
        class: NXdelocalization
        occurs: {min: 0, max: unbounded}
        children:
          window:
            node: group
            class: NXcs_filter_boolean_mask
            children:
              number_of_ions:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              bitdepth:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              mask:
                node: dataset
                type: NX_UINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          grid:
            node: group
            class: NXcg_grid
            doc: The discretized domain/grid on which the delocalization is applied.
            children:
              dimensionality:
                node: dataset
                type: NX_POSINT
                enum: ['1', '2', '3']
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              cardinality:
                node: dataset
                type: NX_POSINT
                doc: The total number of cells/voxels of the grid.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              origin:
                node: dataset
                type: NX_NUMBER
                shape: [d]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              symmetry:
                node: dataset
                type: NX_CHAR
                enum: [cubic]
                doc: The symmetry of the lattice defining the shape of the unit cell.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              cell_dimensions:
                node: dataset
                type: NX_NUMBER
                shape: [d]
                units: {category: NX_LENGTH}
                doc: |-
                  The unit cell dimensions according to the coordinate system defined under
                  coordinate_system.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              extent:
                node: dataset
                type: NX_POSINT
                shape: [d]
                doc: |-
                  Number of unit cells along each of the d-dimensional base vectors.
                  The total number of cells, or grid points has to be the cardinality.
                  If the grid has an irregular number of grid positions in each direction,
                  as it could be for instance the case of a grid where all grid points
                  outside some masking primitive are removed, this extent field should
                  not be used. Instead use the coordinate field.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              index_offset:
                node: dataset
                type: NX_INT
                units: {category: NX_UNITLESS}
                doc: |-
                  Integer which specifies the first index to be used for distinguishing identifiers for cells.
                  Identifiers are defined either implicitly or explicitly. For implicit indexing the identifiers are
                  defined on the interval :math:`[identifier\_offset, identifier\_offset + c - 1]`.
                  For explicit indexing the identifier array has to be defined.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              kernel_size:
                node: dataset
                type: NX_POSINT
                shape: [3]
                units: {category: NX_DIMENSIONLESS}
                doc: |-
                  Halfwidth of the kernel about the central voxel.
                  The shape of the kernel is that of a cuboid
                  of extent 2*kernel_extent[i] + 1 in each dimension i.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              kernel_type:
                node: dataset
                type: NX_CHAR
                enum: [gaussian]
                doc: Functional form of the kernel (Ansatz function).
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              kernel_sigma:
                node: dataset
                type: NX_FLOAT
                shape: [3]
                units: {category: NX_LENGTH}
                doc: |-
                  Standard deviation :math:`\sigma_i` of the kernel in each dimension
                  in the paraprobe coordinate_system with i = 0 is x, i = 1 is y, i = 2 is z.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              kernel_mu:
                node: dataset
                type: NX_FLOAT
                shape: [3]
                units: {category: NX_LENGTH}
                doc: |-
                  Expectation value :math:`\mu_i` of the kernel in each dimension
                  in the paraprobe coordinate_system with i = 0 is x, i = 1 is y, i = 2 is z.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              normalization:
                node: dataset
                type: NX_CHAR
                enum: [total, candidates, composition, concentration]
                doc: |-
                  How were results of the kernel-density estimation normalized:

                  * total, the total number (intensity) of ions or elements.
                  * candidates, the total number (intensity) of ions matching weighting_model
                  * composition, the value for candidates divided by the value for total,
                  * concentration, the value for candidates divided by the volume of the cell.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              bounding_box:
                node: group
                class: NXcg_hexahedron
                doc: A tight axis-aligned bounding box about the grid.
                children:
                  is_axis_aligned:
                    node: dataset
                    type: NX_BOOLEAN
                    doc: For atom probe should be set to true.
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  index_offset:
                    node: dataset
                    type: NX_INT
                    units: {category: NX_UNITLESS}
                    doc: |-
                      Integer which specifies the first index to be used for distinguishing
                      hexahedra. Identifiers are defined either implicitly or explicitly.
                      For implicit indexing the identifiers are defined on the interval
                      :math:`[identifier\_offset, identifier\_offset + c - 1]`.
                      For explicit indexing the identifier array has to be defined.
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  hexahedron:
                    node: group
                    class: NXcg_face_list_data_structure
                    children:
                      vertex_index_offset:
                        node: dataset
                        type: NX_INT
                        units: {category: NX_UNITLESS}
                        doc: |-
                          Integer which specifies the first index to be used for distinguishing
                          identifiers for vertices. Identifiers are defined either implicitly or explicitly.
                          For implicit indexing the identifiers are defined on the interval
                          :math:`[identifier\_offset, identifier\_offset + c - 1]`. For explicit indexing the identifier array
                          has to be defined.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      face_index_offset:
                        node: dataset
                        type: NX_INT
                        units: {category: NX_UNITLESS}
                        doc: |-
                          Integer which specifies the first index to be used for distinguishing
                          identifiers for faces. Identifiers are defined either implicitly or explicitly.
                          For implicit indexing the identifiers are defined on the interval
                          :math:`[identifier\_offset, identifier\_offset + c - 1]`. For explicit indexing the identifier array
                          has to be defined.
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      vertices:
                        node: dataset
                        type: NX_NUMBER
                        shape: [8, 3]
                        units: {category: NX_LENGTH}
                        doc: |-
                          Positions of the vertices.
                          Users are encouraged to reduce the vertices to unique set of positions
                          and vertices as this supports a more efficient storage of the geometry data.
                          It is also possible though to store the vertex positions naively in which
                          case vertices_are_unique is likely False.
                          Naively here means that one for example stores each vertex of a triangle
                          mesh even though many vertices are shared between triangles and thus
                          the positions of these vertices do not have to be duplicated.
                        via: [T1, T5, T7, T9]
                        provisional: [Q1, Q2]
                      faces:
                        node: dataset
                        type: NX_NUMBER
                        shape: [6, 4]
                        units: {category: NX_UNITLESS}
                        doc: |-
                          Array of identifiers from vertices which describe each face.

                          The first entry is the identifier of the start vertex of the first face,
                          followed by the second vertex of the first face, until the last vertex
                          of the first face. Thereafter, the start vertex of the second face, the
                          second vertex of the second face, and so on and so forth.

                          Therefore, summating over the number_of_vertices, allows to extract
                          the vertex identifiers for the i-th face on the following index interval
                          of the faces array: :math:`[\sum_{i = 0}^{i = n-1}, \sum_{i=0}^{i = n}]`.
                        via: [T1, T5, T7, T9]
                        provisional: [Q1, Q2]
                      xdmf_topology:
                        node: dataset
                        type: NX_UINT
                        shape: [36]
                        units: {category: NX_UNITLESS}
                        doc: |-
                          Six equally formatted sextets chained together. For each sextett the first entry is an
                          XDMF primitive topology key (here 5 for polygon), the second entry the XDMF
                          primitive count value (here 4 because each face is a quad).
                          The remaining four values are the vertex indices.
                        via: [T1, T5, T7, T9]
                        provisional: [Q1, Q2]
                      number_of_boundaries:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_POSINT
                        units: {category: NX_UNITLESS}
                        doc: |-
                          How many distinct boundaries are distinguished?
                          Most grids discretize a cubic or cuboidal region. In this case
                          six sides can be distinguished, each making an own boundary.
                        via: [T1, T6, T7]
                        provisional: [Q1]
                      boundaries:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_CHAR
                        shape: [6]
                        doc: |-
                          Name of the boundaries. E.g. left, right, front, back, bottom, top,
                          The field must have as many entries as there are number_of_boundaries.
                        via: [T1, T6, T7, T9]
                        provisional: [Q1]
                      boundary_conditions:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_INT
                        shape: [6]
                        units: {category: NX_UNITLESS}
                        doc: |-
                          The boundary conditions for each boundary:

                          0 - undefined
                          1 - open
                          2 - periodic
                          3 - mirror
                          4 - von Neumann
                          5 - Dirichlet
                        via: [T1, T6, T7, T9]
                        provisional: [Q1]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              scalar_field_magn_SUFFIX:
                node: group
                name: {template: 'scalar_field_magn_{SUFFIX}'}
                class: NXdata
                occurs: {min: 0, max: unbounded}
                doc: |-
                  The result of the delocalization :math:`\Phi = f(x, y, z)` based on which subsequent iso-surfaces
                  will be computed. In commercial software so far there is no possibility to export this information.

                  If the intensity for all matches of the weighting_model are summarized, name this NXdata instance
                  scalar_field_magn_total.

                  If the intensity is reported for each iontype, one can avoid many subsequent
                  computations as individual intensities can be reinterpreted using a different weighting_model in
                  down-stream usage of the here reported values (e.g. with Python scripting).
                  In this case name the individual NXdata instances scalar_field_magn_ionID using the ID of the ion as
                  per the configuration of the ranging definitions used.
                children:
                  xdmf_intensity:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_FLOAT
                    shape: [n_xyz]
                    units: {category: NX_ANY}
                    doc: Intensity of the field at given point
                    via: [T1, T6, T7, T9]
                    provisional: [Q1]
                  xdmf_xyz:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_FLOAT
                    shape: [n_xyz, 3]
                    units: {category: NX_LENGTH}
                    doc: |-
                      Center of mass positions of each voxel for rendering the scalar field
                      via XDMF in e.g. Paraview.
                    via: [T1, T6, T7, T9]
                    provisional: [Q1]
                  xdmf_topology:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_NUMBER
                    shape: [i]
                    units: {category: NX_UNITLESS}
                    doc: |-
                      XDMF topology for rendering in combination with xdmf_xyz the scalar field
                      via XDMF in e.g. Paraview.
                    via: [T1, T6, T7, T9]
                    provisional: [Q1]
                via: [T1, T3, T6]
                provisional: [Q1, Q3]
              scalar_field_grad_SUFFIX:
                node: group
                name: {template: 'scalar_field_grad_{SUFFIX}'}
                class: NXdata
                occurs: {min: 0, max: unbounded}
                doc: |-
                  The three-dimensional gradient :math:`\nabla \Phi`.
                  Follow the naming convention of scalar_field_magn_SUFFIX to report parallel structures.
                children:
                  xdmf_gradient:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_FLOAT
                    shape: [n_xyz, 3]
                    units: {category: NX_ANY}
                    doc: |-
                      The gradient vector formatted for direct visualization via XDMF in e.g.
                      Paraview.
                    via: [T1, T6, T7, T9]
                    provisional: [Q1]
                  xdmf_xyz:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_FLOAT
                    shape: [n_xyz, 3]
                    units: {category: NX_LENGTH}
                    doc: |-
                      Center of mass positions of each voxel for rendering the scalar field gradient
                      via XDMF in e.g. Paraview.
                    via: [T1, T6, T7, T9]
                    provisional: [Q1]
                  xdmf_topology:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_NUMBER
                    shape: [i]
                    units: {category: NX_UNITLESS}
                    doc: |-
                      XDMF topology for rendering in combination with xdmf_xyz the scalar field
                      via XDMF in e.g. Paraview.
                    via: [T1, T6, T7, T9]
                    provisional: [Q1]
                via: [T1, T3, T6]
                provisional: [Q1, Q3]
              iso_surfaceID:
                node: group
                name: {template: 'iso_surface{ID}'}
                class: NXisocontour
                occurs: {min: 0, max: unbounded}
                doc: |-
                  An iso-surface is the boundary between two regions across which the magnitude of a
                  scalar field falls below/exceeds a threshold magnitude :math:`\varphi`.

                  For applications in atom probe microscopy, the location and shape of such a boundary (set)
                  is typically approximated by discretization - triangulation to be specific.

                  This yields a complex of not necessarily connected geometric primitives.
                  Paraprobe-nanochem approximates this complex with a soup of triangles.
                children:
                  dimensionality:
                    node: dataset
                    type: NX_POSINT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  isovalue:
                    node: dataset
                    type: NX_NUMBER
                    units: {category: NX_ANY}
                    doc: The threshold or iso-contour value :math:`\varphi`.
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  marching_cubes:
                    node: dataset
                    occurs: {min: 0}
                    type: NX_CHAR
                    doc: |-
                      Reference to the specific implementation of marching cubes used.
                      The value placed here should be a DOI. If there are no specific
                      DOI or details write not_further_specified, or give at least a
                      free-text description. The program and version used is the
                      specific paraprobe-nanochem.
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  triangle_soup:
                    node: group
                    class: NXcg_triangle
                    occurs: {min: 0}
                    doc: The resulting triangle soup computed via marching cubes.
                    children:
                      dimensionality:
                        node: dataset
                        type: NX_POSINT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      cardinality:
                        node: dataset
                        type: NX_POSINT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      index_offset:
                        node: dataset
                        type: NX_INT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      triangles:
                        node: group
                        class: NXcg_face_list_data_structure
                        children:
                          number_of_vertices:
                            node: dataset
                            type: NX_POSINT
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          number_of_faces:
                            node: dataset
                            type: NX_POSINT
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          vertex_index_offset:
                            node: dataset
                            type: NX_INT
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          face_index_offset:
                            node: dataset
                            type: NX_INT
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          vertices:
                            node: dataset
                            type: NX_NUMBER
                            shape: [i, 3]
                            units: {category: NX_LENGTH}
                            doc: |-
                              Positions of the vertices.

                              Users are encouraged to reduce the vertices to a unique set as this may
                              result in a more efficient storage of the geometry data.
                              It is also possible though to store the vertex positions naively in which
                              case vertices_are_unique is likely False. Naively here means that each
                              vertex is stored even though many share the same positions.
                            via: [T1, T5, T7, T9]
                            provisional: [Q1, Q2]
                          faces:
                            node: dataset
                            type: NX_INT
                            shape: [j]
                            units: {category: NX_UNITLESS}
                            doc: |-
                              Array of identifiers from vertices which describe each face.

                              The first entry is the identifier of the start vertex of the first face,
                              followed by the second vertex of the first face, until the last vertex
                              of the first face. Thereafter, the start vertex of the second face, the
                              second vertex of the second face, and so on and so forth.

                              Therefore, summating over the number_of_vertices, allows to extract
                              the vertex identifiers for the i-th face on the following index interval
                              of the faces array: :math:`[\sum_{i = 0}^{i = n-1}, \sum_{i=0}^{i = n}]`.
                            via: [T1, T5, T7, T9]
                            provisional: [Q1, Q2]
                          xdmf_topology:
                            node: dataset
                            type: NX_UINT
                            shape: [n_f_tri_xdmf]
                            units: {category: NX_UNITLESS}
                            doc: |-
                              A list of as many tuples of XDMF topology key, XDMF number
                              of vertices and a triple of vertex indices specifying each
                              triangle. The total number of entries is n_f_tri * (1+1+3).
                            via: [T1, T5, T7, T9]
                            provisional: [Q1, Q2]
                          vertex_normal:
                            node: group
                            class: NXcg_unit_normal
                            occurs: {min: 0}
                            children:
                              normals:
                                node: dataset
                                type: NX_FLOAT
                                shape: [j, 3]
                                units: {category: NX_DIMENSIONLESS}
                                doc: Direction of each normal.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                              orientation:
                                node: dataset
                                occurs: {min: 0}
                                type: NX_UINT
                                shape: [j]
                                units: {category: NX_UNITLESS}
                                doc: |-
                                  Qualifier how which specifically oriented normal to its
                                  primitive each normal represents.

                                  * 0 - undefined
                                  * 1 - outer
                                  * 2 - inner
                                via: [T1, T6, T7, T9]
                                provisional: [Q1]
                            via: [T1, T6, T7]
                            provisional: [Q1]
                          face_normal:
                            node: group
                            class: NXcg_unit_normal
                            occurs: {min: 0}
                            children:
                              normals:
                                node: dataset
                                type: NX_FLOAT
                                shape: [k, 3]
                                units: {category: NX_DIMENSIONLESS}
                                doc: Direction of each normal.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                              orientation:
                                node: dataset
                                occurs: {min: 0}
                                type: NX_UINT
                                shape: [k]
                                units: {category: NX_UNITLESS}
                                doc: |-
                                  Qualifier how which specifically oriented normal to its
                                  primitive each normal represents.

                                  * 0 - undefined
                                  * 1 - outer
                                  * 2 - inner
                                via: [T1, T6, T7, T9]
                                provisional: [Q1]
                              gradient_guide_magnitude:
                                node: dataset
                                type: NX_FLOAT
                                shape: [k]
                                units: {category: NX_ANY}
                                doc: |-
                                  Triangle normals are oriented in the direction of the
                                  gradient vector of the local delocalized scalar field.
                                  :math:`\sum_{x, y, z} {\nabla{c}_i}^2`.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                              gradient_guide_projection:
                                node: dataset
                                type: NX_FLOAT
                                shape: [k]
                                units: {category: NX_ANY}
                                doc: |-
                                  Triangle normals are oriented in the direction of the
                                  gradient vector of the local delocalized scalar field.
                                  The projection variable here describes the cosine of the
                                  angle between the gradient direction and the normal
                                  direction vector.
                                  This is a descriptor of how parallel the projection is
                                  that is especially useful to document those triangles
                                  for whose the projection is almost perpendicular.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                            via: [T1, T6, T7]
                            provisional: [Q1]
                          area:
                            node: dataset
                            occurs: {min: 0}
                            type: NX_NUMBER
                            shape: [j]
                            units: {category: NX_AREA}
                            via: [T1, T6, T7, T9]
                            provisional: [Q1]
                          edge_length:
                            node: dataset
                            occurs: {min: 0}
                            type: NX_NUMBER
                            shape: [k, 3]
                            units: {category: NX_LENGTH}
                            doc: |-
                              Array of edge length values. For each triangle the edge length
                              is reported for the edges traversed according to the sequence
                              in which vertices are indexed in triangles.
                            via: [T1, T6, T7, T9]
                            provisional: [Q1]
                          interior_angle:
                            node: dataset
                            occurs: {min: 0}
                            type: NX_NUMBER
                            shape: [j, 4]
                            units: {category: NX_ANGLE}
                            doc: |-
                              Array of interior angle values. For each triangle the angle
                              is reported for the angle opposite to the edges which are
                              traversed according to the sequence in which vertices
                              are indexed in triangles.
                            via: [T1, T6, T7, T9]
                            provisional: [Q1]
                          center:
                            node: dataset
                            occurs: {min: 0}
                            type: NX_NUMBER
                            shape: [j, 3]
                            units: {category: NX_LENGTH}
                            doc: The center of mass of each triangle.
                            via: [T1, T6, T7, T9]
                            provisional: [Q1]
                          volumetric_features:
                            node: group
                            class: NXprocess
                            occurs: {min: 0, max: 1}
                            doc: |-
                              Iso-surfaces of arbitrary scalar three-dimensional fields can show a complicated topology.
                              Paraprobe-nanochem can run a DBScan-like clustering algorithm which performs a
                              connectivity analysis on the triangle soup representation of such iso-surface.
                              This may yield a set of connected features whose individual surfaces are discretized
                              by a triangulated mesh each.  Such volumetric features can be processed further using
                              paraprobe-nanochem using a workflow with at most two steps.

                              In the first step, the tool distinguishes three types of (v) i.e. volumetric features:

                              1. So-called objects, i.e. necessarily watertight features represented by polyhedra.
                                  These objects were already watertight within the triangulated iso-surface.
                              2. So-called proxies, i.e. features that were not necessarily watertight within the triangulated
                                  iso-surface but were subsequently replaced by a watertight mesh using polyhedral mesh
                                  processing operations (hole filling, refinement, fairing operations).
                              3. Remaining triangle surface meshes or parts of these of arbitrary shape and cardinality
                                  that are not transformable into proxies or for which no transformation into proxies was
                                  instructed.

                              These features can be interpreted as microstructural features. Some of them may be precipitates,
                              some of them may be poles, some of them may be segments of dislocation lines or other
                              crystal defects which are decorated (or not) with solutes.

                              In the second step, the tool can be used to analyze the proximity of these objects to a
                              model of the surface (edge) of the dataset.
                            children:
                              indices_triangle_cluster:
                                node: dataset
                                type: NX_UINT
                                shape: [n_v_feat]
                                units: {category: NX_UNITLESS}
                                doc: |-
                                  The identifier which the triangle_soup connectivity analysis
                                  returned, which constitutes the first step of the
                                  volumetric_feature identification process.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                              feature_type_dict_keyword:
                                node: dataset
                                occurs: {min: 0}
                                type: NX_UINT
                                shape: [n_feature_dict]
                                units: {category: NX_UNITLESS}
                                doc: The array of keywords of feature_type dictionary.
                                via: [T1, T6, T7, T9]
                                provisional: [Q1]
                              feature_type_dict_value:
                                node: dataset
                                occurs: {min: 0}
                                shape: [n_feature_dict]
                                doc: |-
                                  The array of values for each keyword of the
                                  feature_type dictionary.
                                via: [T0, T1, T6, T7, T9]
                                provisional: [Q1]
                              feature_type:
                                node: dataset
                                type: NX_UINT
                                shape: [n_v_feat]
                                units: {category: NX_UNITLESS}
                                doc: |-
                                  The array of controlled keywords, need to be from
                                  feature_type_dict_keyword, which specify which type
                                  each feature triangle cluster belongs to.
                                  Keep in mind that not each feature is an object or proxy.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                              indices_feature:
                                node: dataset
                                type: NX_INT
                                shape: [n_v_feat]
                                units: {category: NX_UNITLESS}
                                doc: The explicit identifier of features.
                                via: [T1, T5, T7, T9]
                                provisional: [Q1, Q2]
                              FEATURE:
                                node: group
                                class: NXprocess
                                occurs: {min: 0, max: 6}
                                doc: |-
                                  In all situations instances of the parent NXprocess group are returned with a very similar
                                  information structuring and thus we here replace the template name FEATURE
                                  with one of the following types feature-specific group names:

                                  * objects, objects, irrespective their distance to the surface
                                  * objects_close_to_edge, sub-set of v_feature_object close surface
                                  * objects_far_from_edge, sub-set of v_feature_object not close to the surface
                                  * proxies, proxies, irrespective their distance to the surface
                                  * proxies_close_to_edge, sub-set of v_feature_proxies, close to surface
                                  * proxies_far_from_edge, sub-set of v_feature_proxies, not close to surface
                                children:
                                  indices_feature:
                                    node: dataset
                                    type: NX_INT
                                    shape: [i]
                                    units: {category: NX_UNITLESS}
                                    doc: |-
                                      Explicit identifier of the feature a sub-set of the indices_feature in the
                                      parent group.
                                    via: [T1, T5, T7, T9]
                                    provisional: [Q1, Q2]
                                  volume:
                                    node: dataset
                                    type: NX_FLOAT
                                    shape: [i]
                                    units: {category: NX_VOLUME}
                                    doc: Volume of the feature. NaN for non-watertight objects.
                                    via: [T1, T5, T7, T9]
                                    provisional: [Q1, Q2]
                                  obb:
                                    node: group
                                    class: NXcg_hexahedron
                                    occurs: {min: 0}
                                    doc: An oriented bounding box (OBB) to each object.
                                    children:
                                      size:
                                        node: dataset
                                        occurs: {min: 0}
                                        type: NX_FLOAT
                                        shape: [i, 3]
                                        units: {category: NX_LENGTH}
                                        doc: Edge length of the oriented bounding box from
                                          largest to smallest value.
                                        via: [T1, T6, T7, T9]
                                        provisional: [Q1]
                                      aspect:
                                        node: dataset
                                        occurs: {min: 0}
                                        type: NX_FLOAT
                                        shape: [i, 2]
                                        units: {category: NX_DIMENSIONLESS}
                                        doc: |-
                                          Oriented bounding box aspect ratio.
                                          YX versus ZY or second-largest over largest and smallest over second largest.
                                        via: [T1, T6, T7, T9]
                                        provisional: [Q1]
                                      center:
                                        node: dataset
                                        occurs: {min: 0}
                                        type: NX_NUMBER
                                        shape: [i, 3]
                                        units: {category: NX_LENGTH}
                                        doc: |-
                                          Position of the geometric center, which often is but
                                          not necessarily has to be the center_of_mass of the
                                          hexahedrally-shaped sample/sample part.
                                        via: [T1, T6, T7, T9]
                                        provisional: [Q1]
                                      hexahedra:
                                        node: group
                                        class: NXcg_face_list_data_structure
                                        occurs: {min: 0}
                                        doc: |-
                                          A simple approach to describe the entire set of hexahedra when the main intention
                                          is to store the shape of the hexahedra for visualization.
                                        children:
                                          vertices:
                                            node: dataset
                                            type: NX_NUMBER
                                            shape: [k, 3]
                                            units: {category: NX_LENGTH}
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                          xdmf_topology:
                                            node: dataset
                                            type: NX_INT
                                            shape: [k]
                                            units: {category: NX_UNITLESS}
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                          indices_feature_xdmf:
                                            node: dataset
                                            type: NX_INT
                                            shape: [k]
                                            units: {category: NX_UNITLESS}
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                        via: [T1, T6, T7]
                                        provisional: [Q1]
                                    via: [T1, T6, T7]
                                    provisional: [Q1]
                                  objectID:
                                    node: group
                                    name: {template: 'object{ID}'}
                                    class: NXcg_polyhedron
                                    occurs: {min: 0, max: unbounded}
                                    children:
                                      polyhedron:
                                        node: group
                                        class: NXcg_face_list_data_structure
                                        children:
                                          vertices:
                                            node: dataset
                                            type: NX_FLOAT
                                            shape: [n_v, 3]
                                            units: {category: NX_LENGTH}
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                          faces:
                                            node: dataset
                                            type: NX_UINT
                                            shape: [n_f, 3]
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                          face_normals:
                                            node: dataset
                                            type: NX_FLOAT
                                            shape: [n_f, 3]
                                            units: {category: NX_LENGTH}
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                          xdmf_topology:
                                            node: dataset
                                            occurs: {min: 0}
                                            recommended: true
                                            type: NX_INT
                                            shape: [k]
                                            units: {category: NX_UNITLESS}
                                            via: [T1, T6, T7, T9]
                                            provisional: [Q1]
                                          xdmf_indices_feature:
                                            node: dataset
                                            occurs: {min: 0}
                                            recommended: true
                                            type: NX_INT
                                            shape: [k]
                                            units: {category: NX_UNITLESS}
                                            via: [T1, T6, T7, T9]
                                            provisional: [Q1]
                                          ion_id:
                                            node: dataset
                                            occurs: {min: 0}
                                            type: NX_UINT
                                            shape: [m]
                                            units: {category: NX_UNITLESS}
                                            doc: |-
                                              Array of evaporation_id / identifier_ion which details which ions
                                              lie inside or on the surface of the feature.
                                            via: [T1, T6, T7, T9]
                                            provisional: [Q1]
                                        via: [T1, T5, T7]
                                        provisional: [Q1, Q2]
                                    via: [T1, T3, T6]
                                    provisional: [Q1, Q3]
                                  composition:
                                    node: group
                                    class: NXchemical_composition
                                    occurs: {min: 0}
                                    children:
                                      total:
                                        node: dataset
                                        type: NX_NUMBER
                                        shape: [i]
                                        units: {category: NX_UNITLESS}
                                        doc: |-
                                          Total (count) of ions inside or on the surface of the feature relevant for normalization.
                                          NaN for non watertight objects.
                                        via: [T1, T5, T7, T9]
                                        provisional: [Q1, Q2]
                                      ATOM:
                                        node: group
                                        name: {any: true}
                                        class: NXatom
                                        occurs: {min: 0, max: unbounded}
                                        children:
                                          charge_state:
                                            node: dataset
                                            type: NX_INT
                                            via: [T1, T5, T7]
                                            provisional: [Q1, Q2]
                                          nuclide_hash:
                                            node: dataset
                                            type: NX_UINT
                                            via: [T1, T5, T7]
                                            provisional: [Q1, Q2]
                                          nuclide_list:
                                            node: dataset
                                            type: NX_UINT
                                            via: [T1, T5, T7]
                                            provisional: [Q1, Q2]
                                          count:
                                            node: dataset
                                            type: NX_NUMBER
                                            shape: [i]
                                            units: {category: NX_UNITLESS}
                                            doc: |-
                                              Count or weight which, when divided by total, yields the composition of this element,
                                              nuclide, or (molecular) ion within the volume of the feature/object.
                                            via: [T1, T5, T7, T9]
                                            provisional: [Q1, Q2]
                                        via: [T1, T2, T6]
                                        provisional: [Q1, Q11]
                                    via: [T1, T6, T7]
                                    provisional: [Q1]
                                via: [T1, T3b, T6]
                                provisional: [Q1]
                            via: [T1, T6]
                            provisional: [Q1]
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T3, T6]
                provisional: [Q1, Q3]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T3, T6]
        provisional: [Q1, Q3]
      interface_meshingID:
        node: group
        name: {template: 'interface_meshing{ID}'}
        class: NXapm_paraprobe_tool_process
        occurs: {min: 0, max: 1}
        children:
          ion_multiplicity:
            node: dataset
            occurs: {min: 0}
            type: NX_UINT
            shape: [n_ions]
            units: {category: NX_UNITLESS}
            doc: |-
              The multiplicity whereby the ion position is accounted for
              irrespective whether the ion is considered as a decorator
              of the interface or not.
              As an example, with atom probe it is typically not possible
              to resolve the positions of the atoms which arrive at the detector
              as molecular ions. Therefore, an exemplar molecular ion of two carbon
              atoms can be considered to have a multiplicity of two to account that
              this molecular ion contributes two carbon atoms at the reconstructed
              location considering that the spatial resolution of atom probe
              experiments is limited.
            via: [T1, T6, T7, T9]
            provisional: [Q1]
          decorator_multiplicity:
            node: dataset
            occurs: {min: 0}
            type: NX_UINT
            shape: [n_ions]
            units: {category: NX_UNITLESS}
            doc: |-
              The multiplicity whereby the ion position is accounted for when
              the ion is considered one which is a decorator of the interface.
            via: [T1, T6, T7, T9]
            provisional: [Q1]
          initial_interface:
            node: group
            class: NXprocess
            occurs: {min: 0}
            doc: The equation of the plane that is fitted initially.
            children:
              point_normal_form:
                node: dataset
                type: NX_FLOAT
                shape: [4]
                units: {category: NX_LENGTH}
                doc: The four parameter :math:`ax + by + cz + d = 0` which define the plane.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          mesh_stateID:
            node: group
            name: {template: 'mesh_state{ID}'}
            class: NXcg_triangle
            occurs: {min: 0, max: unbounded}
            doc: |-
              The triangle surface mesh representing the interface model.
              Exported at state before or after the next DCOM step.
            children:
              state:
                node: dataset
                type: NX_CHAR
                enum: [before, after]
                doc: Was this state exported before or after the next DCOM step.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              dimensionality:
                node: dataset
                type: NX_POSINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              cardinality:
                node: dataset
                type: NX_POSINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              index_offset:
                node: dataset
                type: NX_INT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              triangles:
                node: group
                class: NXcg_face_list_data_structure
                children:
                  dimensionality:
                    node: dataset
                    type: NX_POSINT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  number_of_vertices:
                    node: dataset
                    type: NX_UINT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  number_of_faces:
                    node: dataset
                    type: NX_UINT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  index_offset_vertex:
                    node: dataset
                    type: NX_INT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  index_offset_edge:
                    node: dataset
                    type: NX_INT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  index_offset_face:
                    node: dataset
                    type: NX_INT
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  indices_face:
                    node: dataset
                    type: NX_INT
                    shape: [j]
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  vertices:
                    node: dataset
                    type: NX_NUMBER
                    shape: [i, 3]
                    units: {category: NX_LENGTH}
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  vertex_normal:
                    node: dataset
                    type: NX_FLOAT
                    shape: [i, 3]
                    units: {category: NX_LENGTH}
                    doc: Direction of each vertex normal.
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  vertex_normal_orientation:
                    node: dataset
                    type: NX_UINT
                    shape: [i]
                    units: {category: NX_UNITLESS}
                    doc: |-
                      Qualifier which details how specifically oriented the
                      face normal is with respect to its primitive (triangle):

                      * 0 - undefined
                      * 1 - outer
                      * 2 - inner
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  faces:
                    node: dataset
                    type: NX_UINT
                    shape: [j, 3]
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  face_normal:
                    node: dataset
                    type: NX_FLOAT
                    shape: [j, 3]
                    units: {category: NX_LENGTH}
                    doc: Direction of each face normal.
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  face_normal_orientation:
                    node: dataset
                    type: NX_UINT
                    shape: [j]
                    units: {category: NX_UNITLESS}
                    doc: |-
                      Qualifier which details how specifically oriented the
                      face normal is with respect to its primitive (triangle):

                      * 0 - undefined
                      * 1 - outer
                      * 2 - inner
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  xdmf_topology:
                    node: dataset
                    type: NX_UINT
                    shape: [k]
                    units: {category: NX_UNITLESS}
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              area:
                node: dataset
                type: NX_NUMBER
                shape: [c]
                units: {category: NX_AREA}
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              edge_length:
                node: dataset
                type: NX_NUMBER
                shape: [c, 3]
                units: {category: NX_LENGTH}
                doc: |-
                  Array of edge length values. For each triangle the edge length is
                  reported for the edges traversed according to the sequence
                  in which vertices are indexed in triangles.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              interior_angle:
                node: dataset
                type: NX_NUMBER
                shape: [c, 4]
                units: {category: NX_ANGLE}
                doc: |-
                  Array of interior angle values. For each triangle the angle is
                  reported for the angle opposite to the edges which are traversed
                  according to the sequence in which vertices are indexed in triangles.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T3, T6]
            provisional: [Q1, Q3]
        via: [T1, T3, T6]
        provisional: [Q1, Q3]
      oned_profileID:
        node: group
        name: {template: 'oned_profile{ID}'}
        class: NXapm_paraprobe_tool_process
        occurs: {min: 0, max: 1}
        children:
          xdmf_cylinder:
            node: group
            class: NXcg_polyhedron
            doc: |-
              The ROIs are defined as cylinders for the computations. To visualize these we discretize
              them into regular n-gons. Using for instance 360-gons, i.e. a regular n-gon with 360 edges,
              resolves the lateral surface of each cylinder such that their renditions are smooth in
              visualization software like Paraview.
            children:
              dimensionality:
                node: dataset
                type: NX_POSINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              cardinality:
                node: dataset
                type: NX_POSINT
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              center:
                node: dataset
                type: NX_NUMBER
                shape: [i, 3]
                units: {category: NX_LENGTH}
                doc: |-
                  Position of the geometric center, which often is but not
                  necessarily has to be the center_of_mass of the polyhedra.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              orientation:
                node: dataset
                type: NX_FLOAT
                shape: [i, 3]
                units: {category: NX_LENGTH}
                doc: |-
                  The orientation of the ROI defined via a vector which points along
                  the cylinder axis and whose length is the height of the cylinder.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              roi_id:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [j]
                units: {category: NX_UNITLESS}
                doc: XDMF support to enable coloring each ROI by its identifier.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              edge_contact:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [j]
                units: {category: NX_UNITLESS}
                doc: XDMF support to enable coloring each ROI whether it has edge contact
                  or not.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              number_of_atoms:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [j]
                units: {category: NX_UNITLESS}
                doc: XDMF support to enable coloring each ROI by its number of atoms.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              number_of_ions:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [j]
                units: {category: NX_UNITLESS}
                doc: XDMF support to enable coloring each ROI by its number of ions.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              rois_far_from_edge:
                node: group
                class: NXprocess
                doc: |-
                  Distance and iontype-specific processed data for each ROI.
                  Arrays signed_distance and nuclide_hash are sorted by increasing
                  distance.
                  Array nuclide_hash reports one hash for each atom of each isotope.
                  Effectively, this can yield to groups of values on signed_distance
                  with the same distance value as molecular ions are reported decomposed
                  into their atoms.
                  Therefore, the XDMF support fields number_of_atoms and number_of_ions
                  are only expected to display pairwise the same values respectively,
                  if all ions are built from a single atom only.
                children:
                  roiID:
                    node: group
                    name: {template: 'roi{ID}'}
                    class: NXcg_roi
                    occurs: {min: 0, max: unbounded}
                    children:
                      signed_distance:
                        node: dataset
                        type: NX_FLOAT
                        shape: [k]
                        units: {category: NX_LENGTH}
                        doc: |-
                          Sorted in increasing order projected along the positive direction
                          of the ROI as defined by orientation in the parent group.
                        via: [T1, T5, T7, T9]
                        provisional: [Q1, Q2]
                      nuclide_hash:
                        node: dataset
                        type: NX_UINT
                        shape: [k]
                        units: {category: NX_UNITLESS}
                        doc: Hashvalue as defined in :ref:`NXatom`.
                        via: [T1, T5, T7, T9]
                        provisional: [Q1, Q2]
                    via: [T1, T3, T6]
                    provisional: [Q1, Q3]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T3, T6]
        provisional: [Q1, Q3]
    via: [T1, T2, T6]
    provisional: [Q1, Q11]
via: [T8]
