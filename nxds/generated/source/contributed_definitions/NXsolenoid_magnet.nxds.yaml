nxds: '0.1'
class: NXsolenoid_magnet
category: base
extends: NXcomponent
doc: definition for a solenoid magnet.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  description:
    node: dataset
    type: NX_CHAR
    doc: extended description of the magnet.
    via: [T1, T4, T7]
    provisional: [Q1]
  beamline_distance:
    node: dataset
    occurs: {min: 0, max: 1}
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: define position of beamline element relative to production target
    via: [T1, T6]
    provisional: [Q1]
  set_current:
    node: dataset
    occurs: {min: 0, max: 1}
    type: NX_FLOAT
    units: {category: NX_CURRENT}
    doc: current set on supply.
    via: [T1, T6]
    provisional: [Q1]
  read_current:
    node: group
    class: NXlog
    occurs: {min: 0, max: 1}
    doc: current read from supply.
    children:
      value:
        node: dataset
        units: {category: NX_CURRENT}
        via: [T0, T1, T4, T7]
        provisional: [Q1]
    via: [T1, T6]
    provisional: [Q1]
  read_voltage:
    node: group
    class: NXlog
    occurs: {min: 0, max: 1}
    doc: voltage read from supply.
    children:
      value:
        node: dataset
        units: {category: NX_VOLTAGE}
        via: [T0, T1, T4, T7]
        provisional: [Q1]
    via: [T1, T6]
    provisional: [Q1]
