nxds: '0.1'
class: NXapm_paraprobe_selector_config
category: application
extends: NXapm_paraprobe_tool_config
describes: NXroot
doc: Application definition for a configuration file of the paraprobe-selector tool.
defaults: {min: 1, binding: true, type: NX_CHAR}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    occurs: {min: 1, max: 1}
    children:
      definition:
        node: dataset
        type: NX_CHAR
        enum: [NXapm_paraprobe_selector_config]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      selectID:
        node: group
        name: {template: 'select{ID}'}
        class: NXapm_paraprobe_tool_parameters
        occurs: {min: 1, max: 1}
        via: [T1, T3, T6]
        provisional: [Q1, Q3]
    via: [T1, T2, T6]
    provisional: [Q1, Q11]
via: [T8]
