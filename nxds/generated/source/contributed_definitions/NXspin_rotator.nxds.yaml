nxds: '0.1'
class: NXspin_rotator
category: base
extends: NXcomponent
doc: Base class for a spin rotator.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  description:
    node: dataset
    type: NX_CHAR
    doc: Extended description of the spin rotator.
    via: [T1, T4, T7]
    provisional: [Q1]
  beamline_distance:
    node: dataset
    occurs: {min: 0, max: 1}
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Define position of beamline element relative to production target
    via: [T1, T6]
    provisional: [Q1]
  set_Bfield_current:
    node: dataset
    occurs: {min: 0, max: 1}
    type: NX_FLOAT
    units: {category: NX_CURRENT}
    doc: current set on magnet supply.
    via: [T1, T6]
    provisional: [Q1]
  read_Bfield_current:
    node: group
    class: NXlog
    occurs: {min: 0, max: 1}
    doc: current read from magnet supply.
    children:
      value:
        node: dataset
        units: {category: NX_CURRENT}
        via: [T0, T1, T4, T7]
        provisional: [Q1]
    via: [T1, T6]
    provisional: [Q1]
  read_Bfield_voltage:
    node: group
    class: NXlog
    occurs: {min: 0, max: 1}
    doc: voltage read from magnet supply.
    children:
      value:
        node: dataset
        units: {category: NX_VOLTAGE}
        via: [T0, T1, T4, T7]
        provisional: [Q1]
    via: [T1, T6]
    provisional: [Q1]
  set_Efield_voltage:
    node: dataset
    occurs: {min: 0, max: 1}
    type: NX_FLOAT
    units: {category: NX_VOLTAGE}
    doc: current set on HT supply.
    via: [T1, T6]
    provisional: [Q1]
  read_Efield_current:
    node: group
    class: NXlog
    occurs: {min: 0, max: 1}
    doc: current read from HT supply.
    children:
      value:
        node: dataset
        units: {category: NX_CURRENT}
        via: [T0, T1, T4, T7]
        provisional: [Q1]
    via: [T1, T6]
    provisional: [Q1]
  read_Efield_voltage:
    node: group
    class: NXlog
    occurs: {min: 0, max: 1}
    doc: voltage read from HT supply.
    children:
      value:
        node: dataset
        units: {category: NX_VOLTAGE}
        via: [T0, T1, T4, T7]
        provisional: [Q1]
    via: [T1, T6]
    provisional: [Q1]
