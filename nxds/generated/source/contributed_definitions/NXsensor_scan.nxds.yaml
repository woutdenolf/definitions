nxds: '0.1'
class: NXsensor_scan
category: application
describes: NXroot
doc: |-
  Application definition for a generic scan using sensors.

  In this application definition, times should be specified always together
  with an UTC offset.
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  N_scanpoints:
    doc: The number of scan points measured in this scan.
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    attributes:
      default:
        occurs: {min: 0}
        recommended: true
        doc: |-
          .. index:: plotting

          Declares which child group contains a path leading
          to a :ref:`NXdata` group.

          It is recommended (as of NIAC2014) to use this attribute
          to help define the path to the default dataset to be visualized upon entry.
          See https://www.nexusformat.org/2014_How_to_find_default_data.html
          for a summary of the discussion.
        via: [T0, T1, T6]
        provisional: [Q1]
    children:
      definition:
        node: dataset
        type: NX_CHAR
        enum: [NXsensor_scan]
        attributes:
          version:
            via: [T0, T1, T5]
            provisional: [Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      identifier_experiment:
        node: dataset
        occurs: {min: 0}
        recommended: true
        doc: |-
          The unique identifier for the entry. The identifier is mainly lab-defined and
          can be a combination of the sample name, date and time, experiment condition
          (such as temperature) or instrument-generated unique identifier.
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      identifier_collection:
        node: dataset
        occurs: {min: 0}
        doc: |-
          The unique identifier for the collection. The identifier is used to group a
          number of the experiments run upon the same setup and/or same sample.
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      experiment_description:
        node: dataset
        occurs: {min: 0}
        recommended: true
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      start_time:
        node: dataset
        occurs: {min: 0}
        recommended: true
        type: NX_DATE_TIME
        doc: The start time of the experiment.
        via: [T1, T6, T7]
        provisional: [Q1]
      end_time:
        node: dataset
        occurs: {min: 0}
        recommended: true
        type: NX_DATE_TIME
        doc: The end time of the experiment.
        via: [T1, T6, T7]
        provisional: [Q1]
      PROCESS:
        node: group
        name: {any: true}
        class: NXprocess
        doc: |-
          Define the program that was used to generate the results file(s)
          with measured data and metadata.
        children:
          program:
            node: dataset
            type: NX_CHAR
            doc: |-
              Commercial or otherwise defined given name of the program
              (or a link to the instrument software).
            attributes:
              version:
                doc: |-
                  Either version with build number, commit hash, or description of an
                  (online) repository where the source code of the program and build
                  instructions can be found so that the program can be configured in
                  such a way that result files can be created ideally in a
                  deterministic manner.
                via: [T0, T1, T5]
                provisional: [Q2]
              program_url:
                doc: Website of the software.
                via: [T0, T1, T5]
                provisional: [Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      USER:
        node: group
        name: {any: true}
        class: NXuser
        doc: |-
          Contact information of at least the user of the instrument or the
          investigator who performed this experiment. Adding multiple users if
          relevant is recommended.
        children:
          name:
            node: dataset
            type: NX_CHAR
            doc: Name of the user.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          affiliation:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            doc: |-
              Name of the affiliation of the user at the point in time when
              the experiment was performed.
            via: [T1, T6, T7]
            provisional: [Q1]
          address:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            doc: |-
              Full address (street, street number, ZIP, city, country)
              of the user's affiliation.
            via: [T1, T6, T7]
            provisional: [Q1]
          email:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            doc: Email address of the user.
            via: [T1, T6, T7]
            provisional: [Q1]
          orcid:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            doc: Author ID defined by https://orcid.org/.
            via: [T1, T6, T7]
            provisional: [Q1]
          telephone_number:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            doc: Official telephone number of the user.
            via: [T1, T6, T7]
            provisional: [Q1]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      NOTE:
        node: group
        name: {any: true}
        class: NXnote
        occurs: {min: 0}
        doc: |-
          Any additional information or notes (e.g. purpose of the experiment) that might
          be useful to understand the experiment.
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        occurs: {min: 0}
        recommended: true
        children:
          ENVIRONMENT:
            node: group
            name: {any: true}
            class: NXenvironment
            occurs: {min: 0}
            recommended: true
            doc: |-
              Describes an environment setup for the experiment.

              All the setting values of the independently scanned controllers are listed under corresponding
              NXsensor groups. Similarly, separate NXsensor groups are used to store the readings from each
              measurement sensor.

              For example, in a temperature-dependent IV measurement, the temperature and voltage must be
              present as independently scanned controllers and the current sensor must also be present with
              its readings.
            children:
              SENSOR:
                node: group
                name: {any: true}
                class: NXsensor
                occurs: {min: 0}
                recommended: true
                children:
                  DATA:
                    node: group
                    name: {any: true}
                    class: NXdata
                    occurs: {min: 0}
                    recommended: true
                    doc: |-
                      Plot of measured signal as a function of the timestamp of when they have been
                      acquired is also possible.
                    via: [T1, T2, T6, T7]
                    provisional: [Q1, Q11]
                  value:
                    node: dataset
                    type: NX_FLOAT
                    shape: [N_scanpoints]
                    units: {category: NX_ANY}
                    doc: |-
                      For each point in the scan space, either the nominal setpoint of an independently scanned controller
                      or a representative average value of a measurement sensor is registered.

                      The length of each sensor's data value array stored in this group should be equal to the number of scan points
                      probed in this scan. For every scan point [N], the corresponding sensor value can be picked from index [N].
                      This allows the scan to be made in any order as the user describes above in the experiment. We get matching
                      values simply using the index of the scan point.
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  value_timestamp:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_DATE_TIME
                    doc: |-
                      Timestamp for when the values provided in the value field were registered.

                      Individual readings can be stored with their timestamps under value_log. This is to timestamp
                      the nominal setpoint or average reading values listed above in the value field.
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  run_control:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    attributes:
                      description:
                        doc: |-
                          Free-text describing the data acquisition control: an internal
                          sweep using the built-in functionality of the controller device,
                          or a set/wait/read/repeat mechanism.
                        via: [T0, T1, T5]
                        provisional: [Q2]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  calibration_time:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_DATE_TIME
                    doc: |-
                      ISO8601 datum when calibration was last performed
                      before this measurement. UTC offset should be specified.
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T2, T6, T7]
                provisional: [Q1, Q11]
              PID_CONTROLLER:
                node: group
                name: {any: true}
                class: NXpid_controller
                occurs: {min: 0}
                recommended: true
                via: [T1, T2, T6, T7]
                provisional: [Q1, Q11]
              independent_controllers:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: A list of names of NXsensor groups used as independently scanned controllers.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              measurement_sensors:
                node: dataset
                occurs: {min: 0}
                recommended: true
                doc: A list of names of NXsensor groups used as measurement sensors.
                via: [T0, T1, T6, T7]
                provisional: [Q1]
            via: [T1, T2, T6, T7]
            provisional: [Q1, Q11]
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      SAMPLE:
        node: group
        name: {any: true}
        class: NXsample
        occurs: {min: 0}
        recommended: true
        children:
          name:
            node: dataset
            type: NX_CHAR
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          HISTORY:
            node: group
            name: {any: true}
            class: NXhistory
            occurs: {min: 0}
            via: [T1, T2, T6, T7]
            provisional: [Q1, Q11]
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      DATA:
        node: group
        name: {any: true}
        class: NXdata
        doc: |-
          A scan specific representation of the measured signals as a function of the independently controlled environment settings.
          Plot of every measured signal as a function of the timestamp of when they have been acquired is also possible.
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
