        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
      show_micron_bar:
        node: dataset
        type: NX_BOOLEAN
        doc: True, if MTex renders a scale bar with figures.
        via: [T1, T4, T7]
        provisional: [Q1]
      show_coordinates:
        node: dataset
        type: NX_BOOLEAN
        doc: True, if MTex renders a grid with figures.
        via: [T1, T4, T7]
        provisional: [Q1]
      pf_anno_fun_hdl:
        node: dataset
        doc: Code for the function handle used for annotating pole figure plots.
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      color_map:
