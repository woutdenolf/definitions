nxds: '0.1'
class: NXmicrostructure_mtex_config
category: base
extends: NXparameters
doc: |-
  Base class to store the configuration when using the MTex/Matlab software.

  MTex is a Matlab package for texture analysis used in the Materials and Earth Sciences.
  See `R. Hielscher et al. <https://mtex-toolbox.github.io/publications>`_ and
  the `MTex source code <https://github.com/mtex-toolbox>`_ for details.
defaults: {min: 0, binding: false, type: NX_CHAR}
symbols:
  n_def_color_map:
    doc: Number of entries in the default color map
  n_color_map: {doc: Number of entries in color map}
children:
  conventions:
    node: group
    class: NXcollection
    doc: |-
      MTex reference frame and orientation conventions.
      Consult the `MTex docs <https://mtex-toolbox.github.io/EBSDReferenceFrame.html>`_ for details.
    children:
      x_axis_direction:
        node: dataset
        type: NX_CHAR
        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
      z_axis_direction:
        node: dataset
        type: NX_CHAR
        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
      a_axis_direction:
        node: dataset
        type: NX_CHAR
        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
      b_axis_direction:
        node: dataset
        type: NX_CHAR
        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
      euler_angle:
        node: dataset
        type: NX_CHAR
        enum: [unknown, undefined, bunge]
        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
  plotting:
    node: group
    class: NXcollection
    doc: Settings relevant for generating plots.
    children:
      font_size:
        node: dataset
        type: NX_NUMBER
        units: {category: NX_ANY}
        doc: TODO with MTex developers
        via: [T1, T4, T7]
        provisional: [Q1]
      inner_plot_spacing:
