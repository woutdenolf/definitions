nxds: '0.1'
class: NXdisk_chopper
category: base
extends: NXcomponent
doc: |-
  A device blocking the beam in a temporal periodic pattern.

  A disk which blocks the beam but has one or more slits to periodically
  let neutrons through as the disk rotates. Often used in pairs, one
  NXdisk_chopper should be defined for each disk.

  The rotation of the disk is commonly monitored by recording a timestamp for
  each full rotation of disk, by having a sensor in the stationary disk housing
  sensing when it is aligned with a feature (such as a magnet) on the disk.
  We refer to this below as the "top-dead-center signal".

  Angles and positive rotation speeds are measured in an anticlockwise
  direction when facing away from the source.
defaults: {min: 0, binding: false, type: NX_CHAR}
symbols:
  n: {doc: Number of slits in the disk}
children:
  type:
    node: dataset
    enum: [Chopper type single, contra_rotating_pair, synchro_pair]
    doc: 'Type of the disk-chopper: only one from the enumerated list (match text exactly)'
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  rotation_speed:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_FREQUENCY}
    doc: |-
      Chopper rotation speed. Positive for anticlockwise rotation when
      facing away from the source, negative otherwise.
    via: [T1, T4, T7]
    provisional: [Q1]
  slits:
    node: dataset
    type: NX_INT
    doc: Number of slits
    via: [T1, T4, T7]
    provisional: [Q1]
  slit_angle:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANGLE}
    doc: Angular opening
    via: [T1, T4, T7]
    provisional: [Q1]
  pair_separation:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Disk spacing in direction of beam
    via: [T1, T4, T7]
    provisional: [Q1]
  slit_edges:
    node: dataset
    type: NX_FLOAT
    shape:
    - {expr: 2*n}
    units: {category: NX_ANGLE}
    doc: |-
      Angle of each edge of every slit from the position of the
      top-dead-center timestamp sensor, anticlockwise when facing
      away from the source.
      The first edge must be the opening edge of a slit, thus the last edge
      may have an angle greater than 360 degrees.
    via: [T1, T4, T7, T9, T9b]
    provisional: [Q1]
  top_dead_center:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_TIME}
    doc: |-
      Timestamps of the top-dead-center signal. The times are relative
      to the "start" attribute and in the units specified in the "units"
      attribute. Please note that absolute
      timestamps under unix are relative to ``1970-01-01T00:00:00.0Z``.
    attributes:
      start:
        type: NX_DATE_TIME
        via: [T1, T4]
    via: [T1, T4, T7]
    provisional: [Q1]
  beam_position:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANGLE}
    doc: |-
      Angular separation of the center of the beam and the
      top-dead-center timestamp sensor, anticlockwise when facing
      away from the source.
    via: [T1, T4, T7]
    provisional: [Q1]
  radius:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Radius of the disk
    via: [T1, T4, T7]
    provisional: [Q1]
  slit_height:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Total slit height
    via: [T1, T4, T7]
    provisional: [Q1]
  phase:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANGLE}
    doc: Chopper phase angle
    via: [T1, T4, T7]
    provisional: [Q1]
  delay:
    node: dataset
    type: NX_NUMBER
    units: {category: NX_TIME}
    doc: Time difference between timing system t0 and chopper driving clock signal
    via: [T1, T4, T7]
    provisional: [Q1]
  ratio:
    node: dataset
    type: NX_INT
    doc: |-
      Pulse reduction factor of this chopper in relation to other
      choppers/fastest pulse in the instrument
    via: [T1, T4, T7]
    provisional: [Q1]
  distance:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: |-
      Effective distance to the origin.
      Note, it is recommended to use NXtransformations instead.
    via: [T1, T4, T7]
    provisional: [Q1]
  wavelength_range:
    node: dataset
    type: NX_FLOAT
    shape: [2]
    units: {category: NX_WAVELENGTH}
    doc: Low and high values of wavelength range transmitted
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  GEOMETRY:
    node: group
    name: {any: true}
    class: NXgeometry
    deprecated: Use the field `depends_on` and :ref:`NXtransformations` to position the chopper
      and NXoff_geometry to describe its shape instead
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  OFF_GEOMETRY:
    node: group
    name: {any: true}
    class: NXoff_geometry
    occurs: {min: 0}
    doc: This group describes the shape of the beam line component
    via: [T1, T2, T6, T7]
    provisional: [Q1, Q11]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      The reference plane of the disk chopper includes the surface of the spinning disk which faces
      the source. The reference point in the x and y axis is the point on this surface which is the
      centre of the axle which the disk is spinning around. The reference plane is orthogonal to
      the z axis and its position is the reference point on that axis.

      Note: This reference point in almost all practical cases is not where the beam passes though.

      .. image:: disk_chopper/disk_chopper.png
          :width: 40%
    via: [T1, T4, T7]
    provisional: [Q1]
