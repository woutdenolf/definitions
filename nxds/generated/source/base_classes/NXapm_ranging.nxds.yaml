nxds: '0.1'
class: NXapm_ranging
category: base
extends: NXprocess
doc: |-
  Base class for the configuration and results of ranging definitions.

  Ranging is a data post-processing step used in the research field of
  atom probe during which elemental, isotopic, and/or molecular identities
  are assigned to mass-to-charge-state ratios within certain intervals.
  The documentation of these steps is based on ideas that
  have been described in the literature:

  * `M. K. Miller <https://doi.org/10.1002/sia.1719>`_
  * `D. Haley et al. <https://doi.org/10.1017/S1431927620024290>`_
  * `M. Kühbach et al. <https://doi.org/10.1017/S1431927621012241>`_
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  PROGRAM:
    node: group
    name: {any: true}
    class: NXprogram
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  NOTE:
    node: group
    name: {any: true}
    class: NXnote
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  mass_to_charge_distribution:
    node: group
    class: NXprocess
    doc: Specifies the mass-to-charge-state ratio histogram.
    children:
      PROGRAM:
        node: group
        name: {any: true}
        class: NXprogram
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
      min_mass_to_charge:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_ANY}
        doc: |-
          Smallest :math:`{\frac{m}{q}}_{min}` mass-to-charge-state ratio value.

          The lower (left-hand side) inclusive bound of the interval :math:`[{\frac{m}{q}}_{min}`, {\frac{m}{q}}_{max}]`.
        via: [T1, T4, T7]
        provisional: [Q1]
      max_mass_to_charge:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_ANY}
        doc: |-
          Largest :math:`{\frac{m}{q}}_{max}` mass-to-charge-state ratio value.

          The upper (right-hand side) inclusive bound of the interval :math:`[{\frac{m}{q}}_{min}`, {\frac{m}{q}}_{max}]`.
        via: [T1, T4, T7]
        provisional: [Q1]
      n_mass_to_charge:
        node: dataset
        type: NX_POSINT
        units: {category: NX_UNITLESS}
        doc: |-
          The number of bins on the interval :math:`[{\frac{m}{q}}_{min}`,
          {\frac{m}{q}}_{max}]`.
        via: [T1, T4, T7]
        provisional: [Q1]
      mass_spectrum:
        node: group
        class: NXdata
        doc: |-
          A default histogram aka mass spectrum of
          the mass-to-charge-state ratio values.
        via: [T1, T4, T7]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
  background_quantification:
    node: group
    class: NXprocess
    doc: |-
      Details of the background model that was used to
      correct the total counts per bin into counts.
    children:
      PROGRAM:
        node: group
        name: {any: true}
        class: NXprogram
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
      description:
        node: dataset
        type: NX_CHAR
        doc: |-
          Free-text field to describe how atom probers define a background model.

          Thereby, community feedback can be collected to inform an improved
          version of this base class in the future.
        via: [T1, T4, T7]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
  peak_search_and_deconvolution:
    node: group
    class: NXprocess
    doc: How were peaks in the mass-to-charge-state ratio histogram identified.
    children:
      PROGRAM:
        node: group
        name: {any: true}
        class: NXprogram
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
      PEAK:
        node: group
        name: {any: true}
        class: NXpeak
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
    via: [T1, T4, T7]
    provisional: [Q1]
  peak_identification:
    node: group
    class: NXprocess
    doc: |-
      Details about how peaks, with taking into account
      error models, were interpreted as ion types or not.
    children:
      PROGRAM:
        node: group
        name: {any: true}
        class: NXprogram
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
      number_of_ion_types:
        node: dataset
        type: NX_UINT
        units: {category: NX_UNITLESS}
        doc: |-
          How many ion types are distinguished. If no ranging was performed, each
          ion is of the special unknown type. The iontype ID of this unknown type
          is 0 representing a reserved value.

          Consequently, start counting iontypes from 1.
        via: [T1, T4, T7]
        provisional: [Q1]
      maximum_number_of_atoms_per_molecular_ion:
        node: dataset
        type: NX_UINT
        units: {category: NX_UNITLESS}
        doc: |-
          Assumed maximum value that suffices to store all relevant molecular ions,
          even the most complicated ones that one can typically observe and distinguish
          typically. Currently, a value of 32 is used (see M. Kühbach et al. <https://doi.org/10.1017/S1431927621012241>`_).
        via: [T1, T4, T7]
        provisional: [Q1]
      ATOM:
        node: group
        name: {any: true}
        class: NXatom
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
    via: [T1, T4, T7]
    provisional: [Q1]
