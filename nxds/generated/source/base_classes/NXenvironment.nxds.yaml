nxds: '0.1'
class: NXenvironment
category: base
extends: NXobject
doc: Parameters for controlling external conditions
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  name:
    node: dataset
    doc: Apparatus identification code/model number; e.g. OC100 011
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  short_name:
    node: dataset
    doc: Alternative short name, perhaps for dashboard display like a present Seblock name
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  type:
    node: dataset
    doc: Type of apparatus. This could be the SE codes in scheduling database; e.g. OC/100
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  description:
    node: dataset
    doc: Description of the apparatus; e.g. 100mm bore orange cryostat with Roots pump
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  program:
    node: dataset
    doc: Program controlling the apparatus; e.g. LabView VI name
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  position:
    node: group
    class: NXgeometry
    doc: |-
      The position and orientation of the apparatus.
      Note, it is recommended to use NXtransformations instead.
    via: [T1, T4, T7]
    provisional: [Q1]
  value:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANY}
    doc: |-
      This is to be used if there is no actuator/sensor that controls/measures
      the environment parameters, but the user would still like to give a value for
      it. An example would be a room temperature experiment where the temperature is
      not actively measured, but rather estimated.

      Note that this method for recording the environment parameters is not advised,
      but using NXsensor and NXactuator is strongly recommended instead.
    via: [T1, T4, T7]
    provisional: [Q1]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      NeXus positions components by applying a set of translations and rotations
      to apply to the component starting from 0, 0, 0. The order of these operations
      is critical and forms what NeXus calls a dependency chain. The depends_on
      field defines the path to the top most operation of the dependency chain or the
      string "." if located in the origin. Usually these operations are stored in a
      NXtransformations group. But NeXus allows them to be stored anywhere.
    via: [T1, T4, T7]
    provisional: [Q1]
  TRANSFORMATIONS:
    node: group
    name: {any: true}
    class: NXtransformations
    occurs: {min: 0}
    doc: |-
      This is the group recommended for holding the chain of translation
      and rotation operations necessary to position the component within
      the instrument. The dependency chain may however traverse similar groups in
      other component groups.
    via: [T1, T2, T6, T7]
    provisional: [Q1, Q11]
  NOTE:
    node: group
    name: {any: true}
    class: NXnote
    doc: Additional information, LabView logs, digital photographs, etc
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  ACTUATOR:
    node: group
    name: {any: true}
    class: NXactuator
    doc: |-
      Any actuator used to control the environment. This can be linked to an actuator
      defined in an NXinstrument instance.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  SENSOR:
    node: group
    name: {any: true}
    class: NXsensor
    doc: |-
      Any sensor used to monitor the environment. This can be linked to a sensor
      defined in an NXinstrument instance.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
