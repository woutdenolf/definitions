nxds: '0.1'
class: NXattenuator
category: base
extends: NXcomponent
doc: |-
  A device that reduces the intensity of a beam by attenuation.

  If uncertain whether to use :ref:`NXfilter` (band-pass filter)
  or :ref:`NXattenuator` (reduces beam intensity), then choose
  :ref:`NXattenuator`.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  distance:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Distance from sample. Note, it is recommended to use NXtransformations instead.
    via: [T1, T4, T7]
    provisional: [Q1]
  type:
    node: dataset
    doc: Type or composition of attenuator, e.g. polythene
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  thickness:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Thickness of attenuator along beam direction
    via: [T1, T4, T7]
    provisional: [Q1]
  scattering_cross_section:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_CROSS_SECTION}
    doc: Scattering cross section (coherent+incoherent)
    via: [T1, T4, T7]
    provisional: [Q1]
  absorption_cross_section:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_CROSS_SECTION}
    doc: Absorption cross section
    via: [T1, T4, T7]
    provisional: [Q1]
  attenuator_transmission:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_DIMENSIONLESS}
    doc: |-
      The nominal amount of the beam that gets through
      (transmitted intensity)/(incident intensity)
    via: [T1, T4, T7]
    provisional: [Q1]
  status:
    node: dataset
    enum: [in, out, moving]
    doc: In or out or moving of the beam
    attributes:
      time:
        type: NX_DATE_TIME
        doc: time stamp for this observation
        via: [T1, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      The reference point of the attenuator is its center in the x and y axis. The reference point on the z axis is the
      surface of the attenuator pointing towards the source.

      In complex (asymmetric) geometries an NXoff_geometry group can be used to provide an unambiguous reference.

      .. image:: attenuator/attenuator.png
          :width: 40%
    via: [T1, T4, T7]
    provisional: [Q1]
  shape:
    node: group
    class: NXoff_geometry
    doc: Shape of this component. Particularly useful to define the origin for position and
      orientation in non-standard cases.
    via: [T1, T4, T7]
    provisional: [Q1]
