nxds: '0.1'
class: NXgrating
category: base
extends: NXcomponent
doc: A diffraction grating, as could be used in a soft X-ray monochromator
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  angles:
    node: dataset
    type: NX_FLOAT
    shape: [2]
    units: {category: NX_ANGLE}
    doc: Blaze or trapezoidal angles, with the angle of the upstream facing edge listed first.
      Blazed gratings can be identified by the low value of the first-listed angle.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  period:
    node: dataset
    type: NX_FLOAT
    shape: [null]
    units: {category: NX_LENGTH}
    doc: List of polynomial coefficients describing the spatial separation of lines/grooves
      as a function of position along the grating, in increasing powers of position. Gratings
      which do not have variable line spacing will only have a single coefficient (constant).
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  duty_cycle:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_UNITLESS}
    via: [T1, T4, T7]
    provisional: [Q1]
  depth:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    via: [T1, T4, T7]
    provisional: [Q1]
  diffraction_order:
    node: dataset
    type: NX_INT
    units: {category: NX_UNITLESS}
    via: [T1, T4, T7]
    provisional: [Q1]
  deflection_angle:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANGLE}
    doc: Angle between the incident beam and the utilised outgoing beam.
    via: [T1, T4, T7]
    provisional: [Q1]
  interior_atmosphere:
    node: dataset
    enum: [vacuum, helium, argon]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  substrate_material:
    node: dataset
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  substrate_density:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_MASS_DENSITY}
    via: [T1, T4, T7]
    provisional: [Q1]
  substrate_thickness:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    via: [T1, T4, T7]
    provisional: [Q1]
  coating_material:
    node: dataset
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  substrate_roughness:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    via: [T1, T4, T7]
    provisional: [Q1]
  coating_roughness:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    via: [T1, T4, T7]
    provisional: [Q1]
  layer_thickness:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: An array describing the thickness of each layer
    via: [T1, T4, T7]
    provisional: [Q1]
  shape:
    node: group
    class: NXshape
    deprecated: Use NXoff_geometry to describe the shape of grating
    doc: A NXshape group describing the shape of the mirror
    via: [T1, T4, T7]
    provisional: [Q1]
  figure_data:
    node: group
    class: NXdata
    doc: Numerical description of the surface figure of the mirror.
    via: [T1, T4, T7]
    provisional: [Q1]
  OFF_GEOMETRY:
    node: group
    name: {any: true}
    class: NXoff_geometry
    occurs: {min: 0}
    doc: This group describes the shape of the beam line component
    via: [T1, T2, T6, T7]
    provisional: [Q1, Q11]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      .. todo::
      Add a definition for the reference point of a bending grating.
    via: [T1, T4, T7]
    provisional: [Q1]
  TRANSFORMATIONS:
    node: group
    name: {any: true}
    class: NXtransformations
    doc: |-
      "Engineering" position of the grating
      Transformations used by this component to define its position and orientation.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
