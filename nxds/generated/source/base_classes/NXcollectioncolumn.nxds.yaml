nxds: '0.1'
class: NXcollectioncolumn
category: base
extends: NXcomponent
doc: Electron collection column of an electron analyzer.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  scheme:
    node: dataset
    type: NX_CHAR
    doc: |-
      Scheme of the electron collection lens, i.e. angular dispersive,
      spatial dispersive, momentum dispersive, non-dispersive, etc.
    via: [T1, T4, T7]
    provisional: [Q1]
  extractor_voltage:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_VOLTAGE}
    doc: Voltage applied to the extractor lens
    via: [T1, T4, T7]
    provisional: [Q1]
  extractor_current:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_CURRENT}
    doc: |-
      Current necessary to keep the extractor lens at a set voltage. Variations
      indicate leakage, field emission or arc currents to the extractor lens.
    via: [T1, T4, T7]
    provisional: [Q1]
  working_distance:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Distance between sample and detector entrance
    via: [T1, T4, T7]
    provisional: [Q1]
  lens_mode:
    node: dataset
    type: NX_CHAR
    doc: Labelling of the lens setting in use.
    via: [T1, T4, T7]
    provisional: [Q1]
  projection:
    node: dataset
    type: NX_CHAR
    enum: [real, reciprocal]
    doc: The space projected in the angularly dispersive directions, real or reciprocal
    via: [T1, T4, T7]
    provisional: [Q1]
  angular_acceptance:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANGLE}
    doc: |-
      Acceptance angle of the collection column.

      This concept is related to term `7.4`_ of the ISO 18115-1:2023 standard.

      .. _7.4: https://www.iso.org/obp/ui/en/#iso:std:iso:18115:-1:ed-3:v1:en:term:7.4
    via: [T1, T4, T7]
    provisional: [Q1]
  spatial_acceptance:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: Acceptance length or area of the collection column.
    via: [T1, T4, T7]
    provisional: [Q1]
  magnification:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_DIMENSIONLESS}
    doc: The magnification of the electron lens assembly.
    via: [T1, T4, T7]
    provisional: [Q1]
  APERTURE:
    node: group
    name: {any: true}
    class: NXaperture
    doc: |-
      The size and position of an aperture inserted in the column, e.g. field aperture
      or contrast aperture
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  DEFLECTOR:
    node: group
    name: {any: true}
    class: NXdeflector
    doc: Deflectors in the collection column section
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  ELECTROMAGNETIC_LENS:
    node: group
    name: {any: true}
    class: NXelectromagnetic_lens
    doc: Individual lenses in the collection column section
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
