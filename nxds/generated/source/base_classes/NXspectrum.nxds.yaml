nxds: '0.1'
class: NXspectrum
category: base
extends: NXobject
doc: |-
  Base class container for reporting a set of spectra.

  The mostly commonly used scanning methods are supported. That is one-,
  two-, three-dimensional ROIs discretized using regular Euclidean tilings.

  Use stack for all other tilings.
defaults: {min: 0, binding: false, type: NX_CHAR}
symbols:
  n_spc:
    doc: Number of spectra in the stack, for stacks the slowest dimension.
  n_k:
    doc: Number of image points along the slower dimension (k equivalent to z).
  n_j:
    doc: Number of image points along the slow dimension (j equivalent to y).
  n_i:
    doc: Number of image points along the fast dimension (i equivalent to x).
  n_energy:
    doc: Number of energy bins (always the fastest dimension).
children:
  PROCESS:
    node: group
    name: {any: true}
    class: NXprocess
    doc: Details how spectra were processed from the detector readings.
    children:
      input:
        node: group
        class: NXnote
        doc: |-
          Resolvable data artifact (e.g. filename) from which all values in the :ref:`NXdata`
          instances in this :ref:`NXspectrum` were loaded during parsing.

          Possibility to document from which specific other serialized resource as the source
          pieces of information were processed when using NeXus as a semantic file format
          to serialize that information differently.

          The group in combination with an added field *context* therein adds context.
        children:
          context:
            node: dataset
            type: NX_CHAR
            doc: |-
              Reference to a location inside the artifact that points to the specific group of values
              that were processed if the artifacts contains several groups of values and thus
              further resolving of ambiguities is required.
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T4, T7]
        provisional: [Q1]
      mode:
        node: dataset
        type: NX_CHAR
        doc: |-
          Imaging (data collection) mode of the instrument during acquisition
          of the data in this :ref:`NXspectrum` instance.
        via: [T1, T4, T7]
        provisional: [Q1]
      detector_identifier:
        node: dataset
        type: NX_CHAR
        doc: |-
          Link or name of an :ref:`NXdetector` instance with which the data were
          collected.
        via: [T1, T4, T7]
        provisional: [Q1]
      PROGRAM:
        node: group
        name: {any: true}
        class: NXprogram
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  spectrum_0d:
    node: group
    class: NXdata
    doc: One spectrum for a point of a 0d ROI. Also known as spot measurement.
    children:
      intensity:
        node: dataset
        type: NX_NUMBER
        shape: [n_energy]
        units: {category: NX_UNITLESS}
        doc: Counts
        attributes:
          long_name:
            type: NX_CHAR
            doc: Counts
            via: [T1, T4]
        via: [T1, T4, T7, T9]
        provisional: [Q1]
      axis_energy:
        node: dataset
        type: NX_NUMBER
        shape: [n_energy]
        units: {category: NX_ENERGY}
        doc: Energy axis
        attributes:
          long_name:
            type: NX_CHAR
            doc: Energy
            via: [T1, T4]
        via: [T1, T4, T7, T9]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
