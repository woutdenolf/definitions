nxds: '0.1'
class: NXreflections
category: base
extends: NXobject
doc: 'Reflection data from diffraction experiments '
defaults: {min: 0, binding: false, type: NX_CHAR}
symbols:
  n: {doc: number of reflections}
  m: {doc: number of experiments}
attributes:
  description:
    doc: 'Describes the dataset '
    via: [T0, T1, T4]
children:
  experiments:
    node: dataset
    occurs: {min: 1}
    shape: [m]
    doc: 'The experiments from which the reflection data derives '
    via: [T0, T1, T6, T7, T9]
    provisional: [Q1]
  h:
    node: dataset
    occurs: {min: 1}
    type: NX_NUMBER
    shape: [n]
    doc: 'The h component of the miller index '
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  k:
    node: dataset
    occurs: {min: 1}
    type: NX_NUMBER
    shape: [n]
    doc: 'The k component of the miller index '
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  l:
    node: dataset
    occurs: {min: 1}
    type: NX_NUMBER
    shape: [n]
    doc: 'The l component of the miller index '
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  id:
    node: dataset
    occurs: {min: 1}
    type: NX_INT
    shape: [n]
    doc: |-
      The id of the experiment which resulted in the reflection. If the value
      is greater than 0, the experiments must link to a multi-experiment NXmx
      group
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  reflection_id:
    node: dataset
    occurs: {min: 1}
    type: NX_INT
    shape: [n]
    doc: |-
      The id of the reflection. Multiple partials from the same reflection
      should all have the same id
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  entering:
    node: dataset
    occurs: {min: 1}
    type: NX_BOOLEAN
    shape: [n]
    doc: 'Is the reflection entering or exiting the Ewald sphere '
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  det_module:
    node: dataset
    occurs: {min: 1}
    type: NX_INT
    shape: [n]
    doc: 'The detector module on which the reflection was recorded '
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  flags:
    node: dataset
    occurs: {min: 1}
    type: NX_INT
    shape: [n]
    doc: |-
      Status flags describing the reflection.

      This is a bit mask. The bits in the mask follow the convention
      used by DIALS, and have the following names:

      ===   ==========================================
      bit   name
      ===   ==========================================
      0     ``predicted``
      1     ``observed``
      2     ``indexed``
      3     ``used_in_refinement``
      4     ``strong``
      5     ``reference_spot``
      6     ``dont_integrate``
      7     ``integrated_sum``
      8     ``integrated_prf``
      9     ``integrated``
      10    ``overloaded``
      11    ``overlapped``
      12    ``overlapped_fg``
      13    ``in_powder_ring``
      14    ``foreground_includes_bad_pixels``
      15    ``background_includes_bad_pixels``
      16    ``includes_bad_pixels``
      17    ``bad_shoebox``
      18    ``bad_spot``
      19    ``used_in_modelling``
      20    ``centroid_outlier``
      21    ``failed_during_background_modelling``
      22    ``failed_during_summation``
      23    ``failed_during_profile_fitting``
      24    ``bad_reference``
      ===   ==========================================
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  d:
    node: dataset
    occurs: {min: 1}
    type: NX_FLOAT
    shape: [n]
    doc: 'The resolution of the reflection '
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  partiality:
    node: dataset
    occurs: {min: 1}
    type: NX_FLOAT
    shape: [n]
    doc: |-
      The partiality of the reflection.
      Dividing by this number will inflate the measured
      intensity to the full reflection equivalent.
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  predicted_frame:
    node: dataset
    occurs: {min: 1}
    type: NX_FLOAT
    shape: [n]
    units: {category: NX_UNITLESS}
    doc: The frame on which the bragg peak of the reflection is predicted
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  predicted_x:
    node: dataset
    occurs: {min: 1}
    type: NX_FLOAT
    shape: [n]
    units: {category: NX_LENGTH}
    doc: |-
      The x position at which the bragg peak of the reflection
      is predicted
    attributes:
      description:
        doc: 'Describes the dataset '
        via: [T0, T1, T4]
    via: [T1, T6, T7, T9]
    provisional: [Q1]
  predicted_y:
