nxds: '0.1'
class: NXcite
category: base
extends: NXobject
doc: |-
  A literature reference

  Definition to include references for example for detectors,
  manuals, instruments, acquisition or analysis software used.

  The idea would be to include this in the relevant NeXus object:
  :ref:`NXdetector` for detectors, :ref:`NXinstrument` for instruments, etc.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  description:
    node: dataset
    type: NX_CHAR
    doc: |-
      This should describe the reason for including this reference.
      For example: The dataset in this group was normalised using the method
      which is described in detail in this reference.
    via: [T1, T4, T7]
    provisional: [Q1]
  url:
    node: dataset
    type: NX_CHAR
    doc: URL referencing the document or data.
    via: [T1, T4, T7]
    provisional: [Q1]
  doi:
    node: dataset
    type: NX_CHAR
    doc: DOI referencing the document or data.
    via: [T1, T4, T7]
    provisional: [Q1]
  endnote:
    node: dataset
    type: NX_CHAR
    doc: Bibliographic reference data in EndNote format.
    via: [T1, T4, T7]
    provisional: [Q1]
  bibtex:
    node: dataset
    type: NX_CHAR
    doc: Bibliographic reference data in BibTeX format.
    via: [T1, T4, T7]
    provisional: [Q1]
