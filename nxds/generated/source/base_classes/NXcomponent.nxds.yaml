nxds: '0.1'
class: NXcomponent
category: base
extends: NXobject
doc: Base class for components of an instrument - real ones or simulated ones.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  applied:
    node: dataset
    type: NX_BOOLEAN
    doc: Was the component used?
    via: [T1, T4, T7]
    provisional: [Q1]
  name:
    node: dataset
    type: NX_CHAR
    doc: Name of the component.
    via: [T1, T4, T7]
    provisional: [Q1]
  description:
    node: dataset
    type: NX_CHAR
    doc: Description of the component.
    via: [T1, T4, T7]
    provisional: [Q1]
  inputs:
    node: dataset
    type: NX_CHAR
    doc: |-
      Instance or list of instances of ``NXcomponent`` (or base classes
      extending ``NXcomponent``) or ``NXbeam`` that act as input(s) to this
      component.

      Each input should point to the path of the group acting as input.

      An example usage would be to chain components and/or beams together to describe
      the beam path in an experiment.
    via: [T1, T4, T7]
    provisional: [Q1]
  outputs:
    node: dataset
    type: NX_CHAR
    doc: |-
      Instance or list of instances of ``NXcomponent`` (or base classes
      extending ``NXcomponent``) or ``NXbeam`` that act as output(s) of this
      component.

      For more information, see :ref:`inputs </NXcomponent/inputs-field>`.
    via: [T1, T4, T7]
    provisional: [Q1]
  FABRICATION:
    node: group
    name: {any: true}
    class: NXfabrication
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  PROGRAM:
    node: group
    name: {any: true}
    class: NXprogram
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  ENVIRONMENT:
    node: group
    name: {any: true}
    class: NXenvironment
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      Specifies the position of the component by pointing to the last
      transformation in the transformation chain that is defined
      via the NXtransformations group.

      NeXus positions components by applying a set of translations and rotations
      to apply to the component starting from 0, 0, 0. The order of these operations
      is critical and forms what NeXus calls a dependency chain. The depends_on
      field defines the path to the top most operation of the dependency chain or the
      string "." if located in the origin. Usually these operations are stored in a
      NXtransformations group. But NeXus allows them to be stored anywhere.
    via: [T1, T4, T7]
    provisional: [Q1]
  TRANSFORMATIONS:
    node: group
    name: {any: true}
    class: NXtransformations
    doc: |-
      Collection of axis-based translations and rotations to describe the
      location and geometry of the component in the instrument. The dependency
      chain may however traverse similar groups in other component groups.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
