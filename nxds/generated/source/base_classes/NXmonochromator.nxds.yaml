nxds: '0.1'
class: NXmonochromator
category: base
extends: NXcomponent
doc: |-
  A  wavelength defining device.

  This is a base class for everything which
  selects a wavelength or energy, be it a
  monochromator crystal, a velocity selector,
  an undulator or whatever.

  The expected units are:

  * wavelength: angstrom
  * energy:     eV
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  wavelength:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_WAVELENGTH}
    doc: wavelength selected
    via: [T1, T4, T7]
    provisional: [Q1]
  wavelength_error:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_WAVELENGTH}
    deprecated: see https://github.com/nexusformat/definitions/issues/820
    doc: wavelength standard deviation
    via: [T1, T4, T7]
    provisional: [Q1]
  wavelength_errors:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_WAVELENGTH}
    doc: wavelength standard deviation
    via: [T1, T4, T7]
    provisional: [Q1]
  energy:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ENERGY}
    doc: energy selected
    via: [T1, T4, T7]
    provisional: [Q1]
  energy_error:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ENERGY}
    deprecated: see https://github.com/nexusformat/definitions/issues/820
    doc: energy standard deviation
    via: [T1, T4, T7]
    provisional: [Q1]
  energy_errors:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ENERGY}
    doc: energy standard deviation
    via: [T1, T4, T7]
    provisional: [Q1]
  energy_dispersion:
    node: dataset
    type: NX_FLOAT
    units: {fixed: eV/mm}
    doc: Energy dispersion at the exit slit.
    via: [T1, T4, T7]
    provisional: [Q1]
  wavelength_dispersion:
    node: dataset
    type: NX_FLOAT
    units: {fixed: nm/mm}
    doc: Wavelength dispersion at the exit slit.
    via: [T1, T4, T7]
    provisional: [Q1]
  entrance_slit:
    node: group
    class: NXaperture
    doc: Size, position and shape of the entrance slit of the monochromator.
    via: [T1, T4, T7]
    provisional: [Q1]
  exit_slit:
    node: group
    class: NXaperture
    doc: Size, position and shape of the exit slit of the monochromator.
    via: [T1, T4, T7]
    provisional: [Q1]
  distribution:
    node: group
    class: NXdata
    via: [T1, T4, T7]
    provisional: [Q1]
  geometry:
    node: group
    class: NXgeometry
    deprecated: Use the field `depends_on` and :ref:`NXtransformations` to position the monochromator
      and NXoff_geometry to describe its shape instead
    via: [T1, T4, T7]
    provisional: [Q1]
  OFF_GEOMETRY:
    node: group
    name: {any: true}
    class: NXoff_geometry
    occurs: {min: 0}
    doc: This group describes the shape of the beam line component
    via: [T1, T2, T6, T7]
    provisional: [Q1, Q11]
  CRYSTAL:
    node: group
    name: {any: true}
    class: NXcrystal
    doc: Use as many crystals as necessary to describe
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  MIRROR:
    node: group
    name: {any: true}
    class: NXmirror
    doc: Use as many mirrors as necessary to describe
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  SLIT:
    node: group
    name: {any: true}
    class: NXslit
    doc: Use as many slits as necessary to describe
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  VELOCITY_SELECTOR:
    node: group
    name: {any: true}
    class: NXvelocity_selector
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  GRATING:
    node: group
    name: {any: true}
    class: NXgrating
    doc: For diffraction grating based monochromators
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      .. todo::
      Add a definition for the reference point of a monochromator.
    via: [T1, T4, T7]
    provisional: [Q1]
