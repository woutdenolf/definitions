nxds: '0.1'
class: NXsubentry
category: base
extends: NXobject
doc: |-
  Group of multiple application definitions for "multi-modal" (e.g. SAXS/WAXS) measurements.

  ``NXsubentry`` is a base class virtually identical to :ref:`NXentry`
  and is used as the (overlay) location for application definitions.
  Use a separate ``NXsubentry`` for each application definition.

  To use ``NXsubentry`` with a hypothetical application definition
  called ``NXmyappdef``:

  * Create a group with attribute ``NX_class="NXsubentry"``
  * Within that group, create a field called ``definition="NXmyappdef"``.
  * There are two optional attributes of definition: ``version`` and ``URL``

  The intended use is to define application definitions for a
  multi-modal (a.k.a. multi-technique) :ref:`NXentry`.
  Previously, an application definition
  replaced :ref:`NXentry` with its own definition.
  With the increasing popularity of instruments combining
  multiple techniques for data collection (such as SAXS/WAXS instruments),
  it was recognized the application definitions must be entered in the NeXus
  data file tree as children of :ref:`NXentry`.
defaults: {min: 0, binding: false, type: NX_CHAR}
attributes:
  default:
    doc: |-
      .. index:: find the default plottable data
      .. index:: plotting
      .. index:: default attribute value

      Declares which :ref:`NXdata` group contains the data
      to be shown by default.
      It is used to resolve ambiguity when
      one :ref:`NXdata` group exists.
      The value :ref:`names <validItemName>` the default :ref:`NXentry` group.  The
      value must be the name of a child of the current group. The child must be a
      NeXus group or a link to a NeXus group.

      For more information about how NeXus identifies the default
      plottable data, see the
      :ref:`Find Plottable Data, v3 <Find-Plottable-Data-v3>`
      section.
    via: [T0, T1, T4]
  IDF_Version:
    doc: ISIS Muon IDF_Version
    via: [T0, T1, T3b, T4]
children:
  title:
    node: dataset
    doc: Extended title for entry
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  experiment_identifier:
    node: dataset
    doc: |-
      Unique identifier for the experiment, defined by
      the facility, possibly linked to the proposals
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  experiment_description:
    node: dataset
    doc: Brief summary of the experiment, including key objectives.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  experiment_documentation:
    node: group
    class: NXnote
    doc: Description of the full experiment (document in pdf, latex, ...)
    via: [T1, T4, T7]
    provisional: [Q1]
  collection_identifier:
    node: dataset
    doc: User or Data Acquisition defined group of NeXus files or :ref:`NXentry`
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  collection_description:
    node: dataset
    doc: Brief summary of the collection, including grouping criteria.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  entry_identifier:
    node: dataset
    doc: unique identifier for the measurement, defined by the facility.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  definition:
    node: dataset
    doc: Official NeXus NXDL schema to which this subentry conforms
    attributes:
      version:
        doc: NXDL version number
        via: [T0, T1, T4]
      URL:
        doc: URL of NXDL file
        via: [T0, T1, T3b, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  definition_local:
    node: dataset
    doc: |-
      Local NXDL schema extended from the subentry
      specified in the ``definition`` field.
      This contains any locally-defined,
      additional fields in the subentry.
    attributes:
      version:
        doc: NXDL version number
        via: [T0, T1, T4]
      URL:
        doc: URL of NXDL file
        via: [T0, T1, T3b, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  start_time:
    node: dataset
    type: NX_DATE_TIME
    doc: Starting time of measurement
    via: [T1, T4, T7]
    provisional: [Q1]
  end_time:
    node: dataset
    type: NX_DATE_TIME
    doc: Ending time of measurement
    via: [T1, T4, T7]
    provisional: [Q1]
  duration:
    node: dataset
    type: NX_INT
    units: {category: NX_TIME}
    doc: Duration of measurement
    via: [T1, T4, T7]
    provisional: [Q1]
  collection_time:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_TIME}
    doc: |-
      Time transpired actually collecting data i.e. taking out time when collection was
      suspended due to e.g. temperature out of range
    via: [T1, T4, T7]
    provisional: [Q1]
  run_cycle:
    node: dataset
    doc: Such as "2007-3". Some user facilities organize their beam time into run cycles.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  program_name:
    node: dataset
    doc: Name of program used to generate this file
    attributes:
      version:
        doc: Program version number
        via: [T0, T1, T4]
      configuration:
        doc: configuration of the program
        via: [T0, T1, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  revision:
    node: dataset
    doc: |-
      Revision id of the file due to re-calibration, reprocessing, new analysis, new
      instrument definition format, ...
    attributes:
      comment:
        via: [T0, T1, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  pre_sample_flightpath:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: |-
      This is the flightpath before the sample position. This can be determined by a chopper,
      by the moderator or the source itself. In other words: it the distance to the component
      which gives the T0 signal to the detector electronics. If another component in the
      NXinstrument hierarchy provides this information, this should be a link.
    via: [T1, T4, T7]
    provisional: [Q1]
  notes:
    node: group
    class: NXnote
    doc: Notes describing entry
    via: [T1, T4, T7]
    provisional: [Q1]
  thumbnail:
    node: group
    class: NXnote
    doc: |-
      A small image that is representative of the entry. An example of this is a 640x480
      jpeg image automatically produced by a low resolution plot of the NXdata.
    attributes:
      mime_type:
        enum: [image/*]
        doc: The value should be an ``image/*``
        via: [T0, T1, T4]
    via: [T1, T4, T7]
    provisional: [Q1]
  USER:
    node: group
    name: {any: true}
    class: NXuser
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  SAMPLE:
    node: group
    name: {any: true}
    class: NXsample
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  INSTRUMENT:
    node: group
    name: {any: true}
    class: NXinstrument
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  COLLECTION:
    node: group
    name: {any: true}
    class: NXcollection
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  MONITOR:
    node: group
    name: {any: true}
    class: NXmonitor
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  DATA:
    node: group
    name: {any: true}
    class: NXdata
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  PARAMETERS:
    node: group
    name: {any: true}
    class: NXparameters
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  PROCESS:
    node: group
    name: {any: true}
    class: NXprocess
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
