nxds: '0.1'
class: NXmanipulator
category: base
extends: NXcomponent
doc: Base class to describe the use of manipulators and sample stages.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  name:
    node: dataset
    type: NX_CHAR
    doc: Name of the manipulator.
    via: [T1, T4, T7]
    provisional: [Q1]
  description:
    node: dataset
    type: NX_CHAR
    doc: A description of the manipulator.
    via: [T1, T4, T7]
    provisional: [Q1]
  type:
    node: dataset
    type: NX_CHAR
    doc: Type of manipulator, Hexapod, Rod, etc.
    via: [T1, T4, T7]
    provisional: [Q1]
  cryostat:
    node: group
    class: NXactuator
    doc: Cryostat for cooling the sample (and, potentially, the whole manipulator).
    children:
      actuation_target:
        node: dataset
        enum: [temperature]
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      PID_CONTROLLER:
        node: group
        name: {any: true}
        class: NXpid_controller
        children:
          setpoint:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_TEMPERATURE}
            doc: |-
              In case of a fixed or averaged cooling temperature, this is the scalar temperature setpoint.
              It can also be a 1D array of temperature setpoints (without time stamps).
            via: [T1, T4, T7]
            provisional: [Q1]
          setpoint_log:
            node: group
            class: NXlog
            children:
              value:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_TEMPERATURE}
                doc: |-
                  In the case of an experiment in which the temperature is changed and the setpoints are
                  recorded with time stamps, this is an array of temperature setpoints.
                via: [T1, T4, T7]
                provisional: [Q1]
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
    via: [T1, T4, T7]
    provisional: [Q1]
  temperature_sensor:
    node: group
    class: NXsensor
    doc: Temperature sensor measuring the sample temperature.
    children:
      measurement:
        node: dataset
        enum: [temperature]
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      value:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_TEMPERATURE}
        doc: |-
          In case of a single or averaged temperature measurement, this is the scalar temperature measured
          by the sample temperature sensor. It can also be a 1D array of measured temperatures
          (without time stamps).
        via: [T1, T4, T7]
        provisional: [Q1]
      value_log:
        node: group
        class: NXlog
        children:
          value:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_TEMPERATURE}
            doc: |-
              In the case of an experiment in which the temperature changes and is recorded with time stamps,
              this is an array of length m of temperatures.
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T4, T7]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
  sample_heater:
    node: group
    class: NXactuator
    doc: Device to heat the sample.
    children:
      actuation_target:
        node: dataset
        enum: [temperature]
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      output_heater_power:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_POWER}
        doc: |-
          In case of a fixed or averaged heating power, this is the scalar heater power.
          It can also be a 1D array of heater powers (without time stamps).
        via: [T1, T4, T7]
        provisional: [Q1]
      output_heater_power_log:
        node: group
        class: NXlog
        children:
          value:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_POWER}
            doc: |-
              In the case of an experiment in which the heater power is changed and recorded with time stamps,
              this is an array of length m of temperature setpoints.
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T4, T7]
        provisional: [Q1]
      PID_CONTROLLER:
        node: group
        name: {any: true}
        class: NXpid_controller
        children:
          setpoint:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_TEMPERATURE}
            doc: |-
              In case of a fixed or averaged temperature, this is the scalar temperature setpoint.
              It can also be a 1D array of temperature setpoints (without time stamps).
            via: [T1, T4, T7]
            provisional: [Q1]
          setpoint_log:
            node: group
            class: NXlog
            children:
              value:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_TEMPERATURE}
                doc: |-
                  In the case of an experiment in which the temperature is changed and the setpoints are
                  recorded with time stamps, this is an array of length m of temperature setpoints.
                via: [T1, T4, T7]
                provisional: [Q1]
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
    via: [T1, T4, T7]
    provisional: [Q1]
  drain_current_ammeter:
    node: group
    class: NXsensor
    doc: Ammeter measuring the drain current of the sample and sample holder.
    children:
      measurement:
        node: dataset
        enum: [current]
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      value:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_CURRENT}
        doc: |-
          In case of a single or averaged drain current measurement, this is the scalar drain current measured between
          the sample and sample holder. It can also be an 1D array of measured currents (without time stamps).
        via: [T1, T4, T7]
        provisional: [Q1]
      value_log:
        node: group
        class: NXlog
        children:
          value:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_CURRENT}
            doc: |-
              In the case of an experiment in which the current changes and is recorded with
              time stamps, this is an array of length m of currents.
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T4, T7]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
  sample_bias_potentiostat:
    node: group
    class: NXactuator
    doc: Actuator applying a voltage between sample holder and sample.
    children:
      actuation_target:
        node: dataset
        enum: [voltage]
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      PID_CONTROLLER:
        node: group
        name: {any: true}
        class: NXpid_controller
        children:
          setpoint:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_VOLTAGE}
            doc: |-
              In case of a fixed or averaged applied bias, this is the scalar voltage applied between
              sample and sample holder. It can also be an 1D array of voltage setpoints (without time stamps).
            via: [T1, T4, T7]
            provisional: [Q1]
          setpoint_log:
            node: group
            class: NXlog
            children:
              value:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_VOLTAGE}
                doc: |-
                  In the case of an experiment in which the bias is changed and the setpoints are
                  recorded with time stamps, this is an array of length m of voltage setpoints.
                via: [T1, T4, T7]
                provisional: [Q1]
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T2, T4, T7]
        provisional: [Q1, Q11]
    via: [T1, T4, T7]
    provisional: [Q1]
  sample_bias_voltmeter:
    node: group
    class: NXsensor
    doc: Sensor measuring the voltage applied to sample and sample holder.
    children:
      measurement:
        node: dataset
        enum: [voltage]
        via: [T0, T1, T4, T7]
        provisional: [Q1]
      value:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_VOLTAGE}
        doc: |-
          In case of a single or averaged bias measurement, this is the scalar voltage measured between
          sample and sample holder. It can also be an 1D array of measured voltages (without time stamps).
        via: [T1, T4, T7]
        provisional: [Q1]
      value_log:
        node: group
        class: NXlog
        children:
          value:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_VOLTAGE}
            doc: |-
              In the case of an experiment in which the bias changes and is recorded with
              time stamps, this is an array of length m of voltages.
            via: [T1, T4, T7]
            provisional: [Q1]
        via: [T1, T4, T7]
        provisional: [Q1]
    via: [T1, T4, T7]
    provisional: [Q1]
  ACTUATOR:
    node: group
    name: {any: true}
    class: NXactuator
    doc: |-
      Any additional actuator on the manipulator used to control an external
      condition.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  SENSOR:
    node: group
    name: {any: true}
    class: NXsensor
    doc: Any additional sensors on the manipulator used to monitor an external condition.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  POSITIONER:
    node: group
    name: {any: true}
    class: NXpositioner
    doc: Class to describe the motors that are used in the manipulator.
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
