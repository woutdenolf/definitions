nxds: '0.1'
class: NXentry
category: base
extends: NXobject
doc: |-
  (**required**) :ref:`NXentry` describes the measurement.

  The top-level NeXus group which contains all the data and associated
  information that comprise a single measurement.
  It is mandatory that there is at least one
  group of this type in the NeXus file.
defaults: {min: 0, binding: false, type: NX_CHAR}
attributes:
  default:
    doc: |-
      .. index:: find the default plottable data
      .. index:: plotting
      .. index:: default attribute value

      Declares which :ref:`NXdata` group contains the data
      to be shown by default.
      It is used to resolve ambiguity when
      one :ref:`NXdata` group exists.
      The value :ref:`names <validItemName>` a child group.  If that group
      itself has a ``default`` attribute, continue this chain until an
      :ref:`NXdata` group is reached.

      For more information about how NeXus identifies the default
      plottable data, see the
      :ref:`Find Plottable Data, v3 <Find-Plottable-Data-v3>`
      section.
    via: [T0, T1, T4]
  IDF_Version:
    doc: ISIS Muon IDF_Version
    via: [T0, T1, T3b, T4]
children:
  DATA:
    node: group
    name: {any: true}
    class: NXdata
    doc: |-
      The data group

      .. note:: Before the NIAC2016 meeting [#]_, at least one
         :ref:`NXdata` group was required in each :ref:`NXentry` group.
         At the NIAC2016 meeting, it was decided to make :ref:`NXdata`
         an optional group in :ref:`NXentry` groups for data files that
         do not use an application definition.
         It is recommended strongly that all NeXus data files provide
         a NXdata group.
         It is permissible to omit the NXdata group only when
         defining the default plot is not practical or possible
         from the available data.

         For example, neutron event data may not have anything that
         makes a useful plot without extensive processing.

         Certain application definitions override this decision and
         require an :ref:`NXdata` group
         in the :ref:`NXentry` group.  The ``minOccurs=0`` attribute
         in the application definition will indicate the
         :ref:`NXdata` group
         is optional, otherwise, it is required.

         .. [#] NIAC2016:
            https://www.nexusformat.org/NIAC2016.html,
            https://github.com/nexusformat/NIAC/issues/16
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  title:
    node: dataset
    doc: Extended title for entry
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  experiment_identifier:
    node: dataset
    doc: |-
      Unique identifier for the experiment,
      defined by the facility,
      possibly linked to the proposals
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  experiment_description:
    node: dataset
    doc: Brief summary of the experiment, including key objectives.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  experiment_documentation:
    node: group
    class: NXnote
    doc: Description of the full experiment (document in pdf, latex, ...)
    via: [T1, T4, T7]
    provisional: [Q1]
  collection_identifier:
    node: dataset
    doc: User or Data Acquisition defined group of NeXus files or NXentry
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  collection_description:
    node: dataset
    doc: Brief summary of the collection, including grouping criteria.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  entry_identifier:
    node: dataset
    doc: Unique identifier for the measurement, defined by the facility.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  entry_identifier_uuid:
    node: dataset
    doc: UUID identifier for the measurement.
    attributes:
      version:
        doc: Version of UUID used
        via: [T0, T1, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  features:
    node: dataset
    doc: |-
      Reserved for future use by NIAC.

      See https://github.com/nexusformat/definitions/issues/382
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  definition:
    node: dataset
    doc: |-
      (alternate use: see same field in :ref:`NXsubentry` for preferred)

      Official NeXus NXDL schema to which this entry conforms which must be
      the name of the NXDL file (case sensitive without the file extension)
      that the NXDL schema is defined in.

      For example the ``definition`` field for a file that conformed to the
      *NXarpes.nxdl.xml* definition must contain the string **NXarpes**.

      This field is provided so that :ref:`NXentry` can be the overlay position
      in a NeXus data file for an application definition and its
      set of groups, fields, and attributes.

      *It is advised* to use :ref:`NXsubentry`, instead, as the overlay position.
    attributes:
      version:
        doc: NXDL version number
        via: [T0, T1, T4]
      URL:
        doc: URL of NXDL file
        via: [T0, T1, T3b, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  definition_local:
    node: dataset
    deprecated: see same field in :ref:`NXsubentry` for preferred use
    doc: |-
      Local NXDL schema extended from the entry
      specified in the ``definition`` field.
      This contains any locally-defined,
      additional fields in the entry.
    attributes:
      version:
        doc: NXDL version number
        via: [T0, T1, T4]
      URL:
        doc: URL of NXDL file
        via: [T0, T1, T3b, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  start_time:
    node: dataset
    type: NX_DATE_TIME
    doc: Starting time of measurement
    via: [T1, T4, T7]
    provisional: [Q1]
  end_time:
    node: dataset
    type: NX_DATE_TIME
    doc: Ending time of measurement
    via: [T1, T4, T7]
    provisional: [Q1]
  duration:
    node: dataset
    type: NX_INT
    units: {category: NX_TIME}
    doc: Duration of measurement
    via: [T1, T4, T7]
    provisional: [Q1]
  collection_time:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_TIME}
    doc: |-
      Time transpired actually collecting data i.e. taking out time when collection was
      suspended due to e.g. temperature out of range
    via: [T1, T4, T7]
    provisional: [Q1]
  run_cycle:
    node: dataset
    doc: Such as "2007-3". Some user facilities organize their beam time into run cycles.
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  program_name:
    node: dataset
    doc: Name of program used to generate this file
    attributes:
      version:
        doc: Program version number
        via: [T0, T1, T4]
      configuration:
        doc: configuration of the program
        via: [T0, T1, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  revision:
    node: dataset
    doc: |-
      Revision id of the file due to re-calibration, reprocessing, new analysis, new
      instrument definition format, ...
    attributes:
      comment:
        via: [T0, T1, T4]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  pre_sample_flightpath:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_LENGTH}
    doc: |-
      This is the flightpath before the sample position. This can be determined by a chopper,
      by the moderator or the source itself. In other words: it the distance to the component
      which gives the T0 signal to the detector electronics. If another component in the
      NXinstrument hierarchy provides this information, this should be a link.
    via: [T1, T4, T7]
    provisional: [Q1]
  notes:
    node: group
    class: NXnote
    doc: Notes describing entry
    via: [T1, T4, T7]
    provisional: [Q1]
  thumbnail:
    node: group
    class: NXnote
    doc: |-
      A small image that is representative of the entry. An example of this is a 640x480
      jpeg image automatically produced by a low resolution plot of the NXdata.
    attributes:
      type:
        enum: [image/*]
        deprecated: Use the `type` field instead
        doc: The mime type should be an ``image/*``
        via: [T0, T1, T4]
    via: [T1, T4, T7]
    provisional: [Q1]
  USER:
    node: group
    name: {any: true}
    class: NXuser
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  SAMPLE:
    node: group
    name: {any: true}
    class: NXsample
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  INSTRUMENT:
    node: group
    name: {any: true}
    class: NXinstrument
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  COLLECTION:
    node: group
    name: {any: true}
    class: NXcollection
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  MONITOR:
    node: group
    name: {any: true}
    class: NXmonitor
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  PARAMETERS:
    node: group
    name: {any: true}
    class: NXparameters
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  PROCESS:
    node: group
    name: {any: true}
    class: NXprocess
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
  SUBENTRY:
    node: group
    name: {any: true}
    class: NXsubentry
    via: [T1, T2, T4, T7]
    provisional: [Q1, Q11]
