nxds: '0.1'
class: NXsensor
category: base
extends: NXcomponent
doc: |-
  A sensor used to monitor an external condition

  The condition itself is described in :ref:`NXenvironment`.
defaults: {min: 0, binding: false, type: NX_CHAR}
children:
  model:
    node: dataset
    doc: Sensor identification code/model number
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  name:
    node: dataset
    doc: Name for the sensor
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  short_name:
    node: dataset
    doc: Short name of sensor used e.g. on monitor display program
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  description:
    node: dataset
    doc: Description of this sensor (function of the sensor, e.g. what it is sensing and/or
      the mechanism of the sensor e.g. how it senses).
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  attached_to:
    node: dataset
    doc: where sensor is attached to ("sample" | "can")
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  geometry:
    node: group
    class: NXgeometry
    deprecated: Use the field `depends_on` and :ref:`NXtransformations` to position the beamstop
      and NXoff_geometry to describe its shape instead
    doc: Defines the axes for logged vector quantities if they are not the global instrument
      axes.
    via: [T1, T4, T7]
    provisional: [Q1]
  measurement:
    node: dataset
    enum:
      values:
      - {value: temperature}
      - {value: pH}
      - {value: magnetic_field}
      - {value: electric_field}
      - {value: current}
      - {value: conductivity}
      - {value: resistance}
      - {value: voltage}
      - {value: pressure}
      - {value: flow}
      - {value: stress}
      - {value: strain}
      - {value: shear}
      - {value: surface_pressure}
      open: true
    doc: name for measured signal
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  type:
    node: dataset
    doc: |-
      The type of hardware used for the measurement.
      Examples (suggestions but not restrictions):

      :Temperature:
        J | K | T | E | R | S | Pt100 | Rh/Fe
      :pH:
        Hg/Hg2Cl2 | Ag/AgCl | ISFET
      :Ion selective electrode:
        specify species; e.g. Ca2+
      :Magnetic field:
        Hall
      :Surface pressure:
        wilhelmy plate
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  run_control:
    node: dataset
    type: NX_BOOLEAN
    doc: |-
      Is data collection controlled or synchronised to this quantity:
      1=no, 0=to "value", 1=to "value_deriv1", etc.
    via: [T1, T4, T7]
    provisional: [Q1]
  high_trip_value:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANY}
    doc: Upper control bound of sensor reading if using run_control
    via: [T1, T4, T7]
    provisional: [Q1]
  low_trip_value:
    node: dataset
    type: NX_FLOAT
    units: {category: NX_ANY}
    doc: Lower control bound of sensor reading if using run_control
    via: [T1, T4, T7]
    provisional: [Q1]
  value:
    node: dataset
    type: NX_FLOAT
    shape: [n]
    units: {category: NX_ANY}
    doc: |-
      nominal setpoint or average value
      - need [n] as may be a vector
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  value_deriv1:
    node: dataset
    type: NX_FLOAT
    shape: [null]
    units: {category: NX_ANY}
    doc: |-
      Nominal/average first derivative of value
      e.g. strain rate
      - same dimensions as "value" (may be a vector)
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  value_deriv2:
    node: dataset
    type: NX_FLOAT
    shape: [null]
    units: {category: NX_ANY}
    doc: |-
      Nominal/average second derivative of value
      - same dimensions as "value" (may be a vector)
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  value_log:
    node: group
    class: NXlog
    doc: Time history of sensor readings
    via: [T1, T4, T7]
    provisional: [Q1]
  value_deriv1_log:
    node: group
    class: NXlog
    doc: Time history of first derivative of sensor readings
    via: [T1, T4, T7]
    provisional: [Q1]
  value_deriv2_log:
    node: group
    class: NXlog
    doc: Time history of second derivative of sensor readings
    via: [T1, T4, T7]
    provisional: [Q1]
  external_field_brief:
    node: dataset
    enum: [along beam, across beam, transverse, solenoidal, flow shear gradient, flow vorticity]
    via: [T0, T1, T4, T7]
    provisional: [Q1]
  external_field_full:
    node: group
    class: NXorientation
    doc: For complex external fields not satisfied by External_field_brief
    via: [T1, T4, T7]
    provisional: [Q1]
  OFF_GEOMETRY:
    node: group
    name: {any: true}
    class: NXoff_geometry
    occurs: {min: 0}
    doc: This group describes the shape of the sensor when necessary.
    via: [T1, T2, T6, T7]
    provisional: [Q1, Q11]
  depends_on:
    node: dataset
    type: NX_CHAR
    doc: |-
      .. todo::
      Add a definition for the reference point of a sensor.
    via: [T1, T4, T7]
    provisional: [Q1]
  ENVIRONMENT:
    node: group
    name: {any: true}
    class: NXenvironment
    occurs: {max: 0}
    doc: NXsensor cannot have NXenvironments
    via: [T1, T2, T4]
    provisional: [Q11]
