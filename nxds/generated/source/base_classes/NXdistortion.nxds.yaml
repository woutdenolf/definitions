nxds: '0.1'
class: NXdistortion
category: base
extends: NXprocess
doc: Subclass of NXprocess to describe post-processing distortion correction.
defaults: {min: 0, binding: false, type: NX_CHAR}
symbols:
  nsym:
    doc: Number of symmetry points used for distortion correction
  ndx:
    doc: Number of points of the matrix distortion field (x direction)
  ndy:
    doc: Number of points of the matrix distortion field (y direction)
children:
  applied:
    node: dataset
    type: NX_BOOLEAN
    doc: Has the distortion correction been applied?
    via: [T1, T4, T7]
    provisional: [Q1]
  symmetry:
    node: dataset
    type: NX_INT
    units: {category: NX_UNITLESS}
    doc: |-
      For `symmetry-guided distortion correction`_,
      where a pattern of features is mapped to the regular geometric structure expected
      from the symmetry. Here we record the number of elementary symmetry operations.

        .. _symmetry-guided distortion correction: https://www.sciencedirect.com/science/article/abs/pii/S0304399118303474?via%3Dihub
    via: [T1, T4, T7]
    provisional: [Q1]
  original_centre:
    node: dataset
    type: NX_FLOAT
    shape: [2]
    units: {category: NX_UNITLESS}
    doc: |-
      For symmetry-guided distortion correction. Here we record the coordinates of the
      symmetry centre point.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  original_points:
    node: dataset
    type: NX_FLOAT
    shape: [nsym, 2]
    units: {category: NX_UNITLESS}
    doc: |-
      For symmetry-guided distortion correction. Here we record the coordinates of the
      relevant symmetry points.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  cdeform_field:
    node: dataset
    type: NX_FLOAT
    shape: [ndx, ndy]
    units: {category: NX_UNITLESS}
    doc: |-
      Column deformation field for general non-rigid distortion corrections. 2D matrix
      holding the column information of the mapping of each original coordinate.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  rdeform_field:
    node: dataset
    type: NX_FLOAT
    shape: [ndx, ndy]
    units: {category: NX_UNITLESS}
    doc: |-
      Row deformation field for general non-rigid distortion corrections. 2D matrix
      holding the row information of the mapping of each original coordinate.
    via: [T1, T4, T7, T9]
    provisional: [Q1]
  description:
    node: dataset
    type: NX_CHAR
    doc: Description of the procedures employed.
    via: [T1, T4, T7]
    provisional: [Q1]
