nxds: '0.1'
class: NXmpes_arpes
category: application
extends: NXmpes
describes: NXroot
doc: |-
  This is a general application definition for angle-resolved (multidimensional)
  photoelectron spectroscopy (ARPES).
defaults: {min: 1, binding: true, type: NX_CHAR}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      definition:
        node: dataset
        enum: [NXmpes_arpes]
        attributes:
          version:
            via: [T0, T1, T5]
            provisional: [Q2]
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      method:
        node: dataset
        occurs: {min: 0}
        recommended: true
        doc: |-
          Name of the experimental method.

          If applicable, this name should match the terms given by `Clause 11`_ of
          the `ISO 18115-1:2023`_ specification.

          Examples include:
              * angle-resolved photoelectron spectroscopy (ARPES)
              * time-resolved angle-resolved X-ray photoelectron spectroscopy (trARPES)
              * spin-resolved angle-resolved X-ray photoelectron spectroscopy (spin-ARPES)

          .. _ISO 18115-1:2023: https://www.iso.org/standard/74811.html
          .. _Clause 11: https://www.iso.org/obp/ui/en/#iso:std:iso:18115:-1:ed-3:v1:en:sec:11
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      arpes_geometry:
        node: group
        class: NXcoordinate_system
        children:
          depends_on:
            node: dataset
            type: NX_CHAR
            doc: |-
              Link to transformations defining an ARPES base coordinate system,
              which is defined such that the positive z-axis points towards the analyzer entry,
              and the x-axis lies within the beam/analyzer plane.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          TRANSFORMATIONS:
            node: group
            name: {any: true}
            class: NXtransformations
            doc: |-
              Set of transformations, describing the orientation of the ARPES coordinate system
              with respect to the beam coordinate system (.).
            via: [T1, T2, T5, T7]
            provisional: [Q1, Q2, Q11]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        children:
          angularN_resolution:
            node: group
            name: {template: 'angular{N}_resolution'}
            class: NXresolution
            occurs: {min: 0}
            recommended: true
            doc: |-
              Overall angular resolution along the Nth angular axis. Create one such entry per relevant angular axis,
              corresponding to the angular axes in NXdata.
              For hemispherical analyzers, angular0_resolution corresponds to the direction along the analyzer slit,
              and angular1_resolution to the one perpendicular to it.
            children:
              physical_quantity:
                node: dataset
                enum: [angle]
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              type:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              resolution:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ANGLE}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          ELECTRONANALYZER:
            node: group
            name: {any: true}
            class: NXelectronanalyzer
            children:
              angularN_resolution:
                node: group
                name: {template: 'angular{N}_resolution'}
                class: NXresolution
                occurs: {min: 0}
                recommended: true
                doc: |-
                  Analyzer angular resolution along the Nth angular axis.
                  Create one such entry per relevant angular axis, corresponding to the angular axes in NXdata.
                  For hemispherical analyzers, angular0_resolution corresponds to the direction along the analyzer slit,
                  and angular1_resolution to the one perpendicular to it.
                children:
                  physical_quantity:
                    node: dataset
                    enum: [angle]
                    via: [T0, T1, T5, T7]
                    provisional: [Q1, Q2]
                  type:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  resolution:
                    node: dataset
                    type: NX_FLOAT
                    units: {category: NX_ANGLE}
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T3, T6, T7]
                provisional: [Q1, Q3]
              depends_on:
                node: dataset
                type: NX_CHAR
                doc: |-
                  Reference to the last transformation describing the orientation of the analyzer relative to the beam,
                  e.g. transformations/analyzer_elevation.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              transformations:
                node: group
                class: NXtransformations
                doc: |-
                  Set of transformations, describing the relative orientation of the analyzer
                  with respect to the beam coordinate system (.).
                children:
                  analyzer_rotation:
                    node: dataset
                    type: NX_NUMBER
                    units: {category: NX_ANGLE}
                    doc: |-
                      Rotation about the analyzer lens axis.
                      Its zero reference is defined such that the angular0 axis is
                      increasing towards the positive y axis (analyzer slit vertical).
                    attributes:
                      transformation_type:
                        enum: [rotation]
                        via: [T0, T1, T5]
                        provisional: [Q2]
                      vector:
                        type: NX_NUMBER
                        enum: ['[0, 0, 1]']
                        via: [T1, T5]
                        provisional: [Q2]
                      depends_on:
                        doc: |-
                          Path to a transformation that places the analyzer origin system into the
                          arpes_geometry coordinate system.
                        via: [T0, T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  analyzer_elevation:
                    node: dataset
                    type: NX_NUMBER
                    units: {category: NX_ANGLE}
                    doc: |-
                      Elevation of the effective analyzer acceptance area, e.g. realized by
                      deflectors, or as one angle in a TOF detector. If a resolved angle, place the
                      calibrated axis coordinates here.
                    attributes:
                      transformation_type:
                        enum: [rotation]
                        via: [T0, T1, T5]
                        provisional: [Q2]
                      vector:
                        type: NX_NUMBER
                        enum: ['[0, 1, 0]']
                        via: [T1, T5]
                        provisional: [Q2]
                      depends_on:
                        enum: [analyzer_dispersion]
                        via: [T0, T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  analyzer_dispersion:
                    node: dataset
                    type: NX_NUMBER
                    units: {category: NX_ANGLE}
                    doc: |-
                      In-plane analyzer coordinate along a dispersive direction,
                      e.g. along an analyzer slit. If a resolved angle, place the calibrated coordinates here.
                    attributes:
                      transformation_type:
                        enum: [rotation]
                        via: [T0, T1, T5]
                        provisional: [Q2]
                      vector:
                        type: NX_NUMBER
                        enum: ['[1, 0, 0]']
                        via: [T1, T5]
                        provisional: [Q2]
                      depends_on:
                        enum: [analyzer_rotation]
                        via: [T0, T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              COLLECTIONCOLUMN:
                node: group
                name: {any: true}
                class: NXcollectioncolumn
                children:
                  scheme:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    enum: [angular dispersive, non-dispersive]
                    doc: Scheme of the electron collection column.
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  angular_acceptance:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_FLOAT
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T2, T5, T7]
                provisional: [Q1, Q2, Q11]
              ENERGYDISPERSION:
                node: group
                name: {any: true}
                class: NXenergydispersion
                children:
                  diameter:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_NUMBER
                    units: {category: NX_LENGTH}
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  entrance_slit:
                    node: group
                    class: NXaperture
                    occurs: {min: 0}
                    recommended: true
                    children:
                      shape:
                        node: dataset
                        enum: [straight slit, curved slit]
                        via: [T0, T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T2, T5, T7]
                provisional: [Q1, Q2, Q11]
            via: [T1, T2, T5, T7]
            provisional: [Q1, Q2, Q11]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      SAMPLE:
        node: group
        name: {any: true}
        class: NXsample
        children:
          situation:
            node: dataset
            enum: [vacuum]
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          depends_on:
            node: dataset
            type: NX_CHAR
            doc: |-
              Reference to the end of the transformation chain,
              orienting the sample surface within the arpes_geometry coordinate system
              (sample_azimuth or anything depending on it).
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          transformations:
            node: group
            class: NXtransformations
            doc: |-
              Set of transformations, describing the relative orientation of the sample
              with respect to the arpes_geometry coordinate system.
            children:
              sample_azimuth:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_ANGLE}
                doc: Rotation about the z axis (azimuthal rotation within the sample plane).
                attributes:
                  transformation_type:
                    enum: [rotation]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                  vector:
                    type: NX_NUMBER
                    enum: ['[0, 0, 1]']
                    via: [T1, T5]
                    provisional: [Q2]
                  depends_on:
                    enum: [offset_azimuth]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              offset_azimuth:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_ANGLE}
                doc: Offset of azimuthal rotation.
                attributes:
                  transformation_type:
                    enum: [rotation]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                  vector:
                    type: NX_NUMBER
                    enum: ['[0, 0, 1]']
                    via: [T1, T5]
                    provisional: [Q2]
                  depends_on:
                    enum: [sample_tilt]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              sample_tilt:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_ANGLE}
                doc: Rotation about the x axis (typically a manipulator tilt).
                attributes:
                  transformation_type:
                    enum: [rotation]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                  vector:
                    type: NX_NUMBER
                    enum: ['[1, 0, 0]']
                    via: [T1, T5]
                    provisional: [Q2]
                  depends_on:
                    enum: [offset_tilt]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              offset_tilt:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_ANGLE}
                doc: Offset of tilt rotation.
                attributes:
                  transformation_type:
                    enum: [rotation]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                  vector:
                    type: NX_NUMBER
                    enum: ['[1, 0, 0]']
                    via: [T1, T5]
                    provisional: [Q2]
                  depends_on:
                    enum: [sample_polar]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              sample_polar:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_ANGLE}
                doc: Rotation about the y axis (typically the long manipulator axis).
                attributes:
                  transformation_type:
                    enum: [rotation]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                  vector:
                    type: NX_NUMBER
                    enum: ['[0, 1, 0]']
                    via: [T1, T5]
                    provisional: [Q2]
                  depends_on:
                    enum: [offset_polar]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              offset_polar:
                node: dataset
                type: NX_NUMBER
                units: {category: NX_ANGLE}
                doc: Offset of polar rotation.
                attributes:
                  transformation_type:
                    enum: [rotation]
                    via: [T0, T1, T5]
                    provisional: [Q2]
                  vector:
                    type: NX_NUMBER
                    enum: ['[0, 1, 0]']
                    via: [T1, T5]
                    provisional: [Q2]
                  depends_on:
                    doc: |-
                      Path to a transformation that places the sample surface
                      into the origin of the arpes_geometry coordinate system.
                    via: [T0, T1, T5]
                    provisional: [Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      DATA:
        node: group
        name: {any: true}
        class: NXdata
        attributes:
          signal:
            enum: [data]
            doc: There is a field named data that contains the signal.
            via: [T0, T1, T5]
            provisional: [Q2]
          axes:
            enum: ['[''angular0'', ''angular1'', ''energy'']']
            doc: |-
              There are three dimensions, one energy and two angular coordinates. Any coordinates that do not move,
              are represented by one point.
            via: [T0, T1, T5]
            provisional: [Q2]
          energy_indices:
            type: NX_INT
            via: [T1, T5]
            provisional: [Q2]
          angular0_indices:
            type: NX_INT
            via: [T1, T5]
            provisional: [Q2]
          angular1_indices:
            type: NX_INT
            via: [T1, T5]
            provisional: [Q2]
        children:
          energy:
            node: dataset
            type: NX_NUMBER
            units: {category: NX_ENERGY}
            doc: Values on the energy axis.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          angular0:
            node: dataset
            type: NX_NUMBER
            units: {category: NX_ANGLE}
            doc: Trace of the first angular axis.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          angular1:
            node: dataset
            type: NX_NUMBER
            units: {category: NX_ANGLE}
            doc: |-
              Trace of the second axis. Could be linked from the respective ``@reference``
              field.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          data:
            node: dataset
            type: NX_NUMBER
            units: {category: NX_ANY}
            doc: |-
              Represents a measurement of photoemission counts over a three-dimensional space where
              the varied axes are energy, and one or more angular coordinates. Axes traces
              should be linked to the actual encoder position in NXinstrument or calibrated axes in NXprocess.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
