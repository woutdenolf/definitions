nxds: '0.1'
class: NXmpes
category: application
describes: NXroot
doc: |-
  This is the most general application definition for
  photoemission experiments.

  Groups and fields are named according to the
  `ISO 18115-1:2023`_ specification as well as the `IUPAC Recommendations 2020`_.

  .. _ISO 18115-1:2023: https://www.iso.org/standard/74811.html
  .. _IUPAC Recommendations 2020: https://doi.org/10.1515/pac-2019-0404
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  n_transmission_function:
    doc: Number of data points in the transmission function.
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      definition:
        node: dataset
        enum: [NXmpes]
        attributes:
          version:
            via: [T0, T1, T5]
            provisional: [Q2]
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        doc: |-
          Datetime of the start of the measurement.
          Should be an ISO8601 date/time stamp. It is recommended to add an explicit time zone,
          otherwise the local time zone is assumed per ISO8601.
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      end_time:
        node: dataset
        occurs: {min: 0}
        recommended: true
        type: NX_DATE_TIME
        doc: |-
          Datetime of the end of the measurement.
          Should be a ISO8601 date/time stamp. It is recommended to add an explicit time zone,
          otherwise the local time zone is assumed per ISO8601.
        via: [T1, T6, T7]
        provisional: [Q1]
      method:
        node: dataset
        occurs: {min: 0}
        recommended: true
        doc: |-
          Name of the experimental method.

          If applicable, this name should match the terms given by `Clause 11`_ of
          the `ISO 18115-1:2023`_ specification.

          Examples include:
              * X-ray photoelectron spectroscopy (XPS)
              * angle-resolved X-ray photoelectron spectroscopy (ARXPS)
              * ultraviolet photoelectron spectroscopy (UPS)
              * angle-resolved photoelectron spectroscopy (ARPES)
              * hard X-ray photoemission spectroscopy (HAXPES)
              * near ambient pressure X-ray photoelectron spectroscopy (NAPXPS)
              * photoelectron emission microscopy (PEEM)
              * electron spectroscopy for chemical analysis (ESCA)
              * time-resolved angle-resolved X-ray photoelectron spectroscopy (trARPES)
              * spin-resolved angle-resolved X-ray photoelectron spectroscopy (spin-ARPES)
              * momentum microscopy

          .. _ISO 18115-1:2023: https://www.iso.org/standard/74811.html
          .. _Clause 11: https://www.iso.org/obp/ui/en/#iso:std:iso:18115:-1:ed-3:v1:en:sec:11
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      transitions:
        node: dataset
        occurs: {min: 0}
        doc: |-
          Array of strings representing the electronic core levels and Auger transitions probed in this
          MPES experiment.

          In order for experiments to be comparable, the notation must follow a strict convention.

          **For core levels:**

          - The element symbol (chemical symbol) is written first.
          - It is followed by a whitespace and then the electronic level (e.g., "1s", "2p", "3d", etc.)
          - Fine-structure splitting levels must include the total angular momentum quantum number **J**,
            written as a fraction after the orbital label (e.g., "3d5/2", "4f7/2").
          - When relevant, fine-structure levels should be specified. If multiple fine-structure levels are
            probed, they should either be given explicitly or the generic level (e.g., "3d", "4f") can be used.

          Examples of correct core level notation:

          - "C 1s"
          - "O 1s"
          - "Fe 2p"
          - "Fe 2p3/2"
          - "Fe 2p1/2"
          - "Au 4f"
          - "Au 4f5/2"
          - "Au 4f7/2"

          **For Auger transitions:**

          - The element symbol (chemical symbol) is written first.
          - It is followed by a whitespace and the Auger transitions, which can include:

            - Explicit transitions (e.g., "KLL", "LMM") without fine-structure splitting
            - Explicit transitions (e.g., "KL1L2", "LM1M2") with fine-structure splitting
            - Simplified valence notation (e.g., "KVV", "KLV").
            - Combinations of the above (e.g. "KL1V").

          Examples of correct Auger transition notation:

          - "C KLL"
          - "O KLL"
          - "O KVV"
          - "O KL1L2"

          **Additional Allowed Entries:**

          Besides specific core levels and Auger transitions, the following broader spectral
          regions can also be listed:

          - "Fermi Edge"
          - "Valence Band"
          - "Survey"

          **Incorrect Notation Examples (Do Not Use):**

          - "C1s" (missing space)
          - "O-1s" (incorrect separator)
          - "Fe2p" (missing space)
          - "Au4f7/2" (missing space)
          - "O-KVV" (incorrect separator)
          - "Fe 2p_3/2" (incorrect underscore)
          - "Fe 2p 3/2" (extra space between "p" and "3/2")
        via: [T0, T1, T6, T7]
        provisional: [Q1]
      COORDINATE_SYSTEM:
        node: group
        name: {any: true}
        class: NXcoordinate_system
        occurs: {min: 0}
        doc: |-
          Description of one coordinate systems that are specific to the setup
          and the measurement geometry.

          Multiple coordinate systems can be used if necessary.
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      USER:
        node: group
        name: {any: true}
        class: NXuser
        occurs: {min: 0}
        recommended: true
        doc: |-
          Contact information of at least the user of the instrument or the investigator
          who performed this experiment. Adding multiple users if relevant is recommended.
        children:
          name:
            node: dataset
            doc: Name of the user.
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          affiliation:
            node: dataset
            doc: |-
              Name of the affiliation of the user at the time when the experiment was
              performed.
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T6, T7]
        provisional: [Q1, Q11]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        doc: |-
          Description of the photoemission spectrometer and its individual parts.

          This concept is related to term `12.58`_ of the ISO 18115-1:2023 standard.

          .. _12.58: https://www.iso.org/obp/ui/en/#iso:std:iso:18115:-1:ed-3:v1:en:term:12.58
        children:
          energy_resolution:
            node: group
            class: NXresolution
            occurs: {min: 0}
            doc: Overall energy resolution of the photoemission instrument.
            children:
              physical_quantity:
                node: dataset
                enum: [energy]
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              type:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              resolution:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ENERGY}
                doc: |-
                  Minimum distinguishable energy separation in the energy spectra.

                  This concept is related to term `10.24`_ of the ISO 18115-1:2023 standard.

                  .. _10.24: https://www.iso.org/obp/ui/en/#iso:std:iso:18115:-1:ed-3:v1:en:term:10.24
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              relative_resolution:
                node: dataset
                occurs: {min: 0}
                type: NX_FLOAT
                doc: |-
                  Ratio of the energy resolution of the photoemission spectrometer at a specified energy
                  value to that energy value.

                  This concept is related to term `10.7 ff.`_ of the ISO 18115-1:2023 standard.

                  .. _10.7 ff.: https://www.iso.org/obp/ui/en/#iso:std:iso:18115:-1:ed-3:v1:en:term:10.7
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          RESOLUTION:
            node: group
            name: {any: true}
            class: NXresolution
            occurs: {min: 0}
            doc: |-
              Any further resolution information about the instrument. For example, the angular
              resolution of the instrument if the spectrometer is angle-resolving.
            via: [T1, T2, T6, T7]
            provisional: [Q1, Q11]
          device_information:
            node: group
            class: NXfabrication
            occurs: {min: 0}
            recommended: true
            children:
              vendor:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              model:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              identifier:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          source_probe:
            node: group
            class: NXsource
            occurs: {min: 0}
            recommended: true
            doc: |-
              The source used to generate the :ref:`beam_probe </NXmpes/ENTRY/INSTRUMENT/beam_probe-group>`.

              Properties refer strictly to parameters of the source, not of the output beam. For example,
              the energy of the source is not the optical power of the beam, but the energy of the electron beam
              in a synchrotron or similar.
            children:
              type:
                node: dataset
                enum:
                  values:
                  - {value: Synchrotron X-ray Source}
                  - {value: Rotating Anode X-ray}
                  - {value: Fixed Tube X-ray}
                  - {value: UV Laser}
                  - {value: Free-Electron Laser}
                  - {value: Optical Laser}
                  - {value: UV Plasma Source}
                  - {value: Metal Jet X-ray}
                  - {value: HHG laser}
                  - {value: UV lamp}
                  - {value: Monochromatized electron source}
                  open: true
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              name:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              probe:
                node: dataset
                occurs: {min: 0}
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              device_information:
                node: group
                class: NXfabrication
                occurs: {min: 0}
                recommended: true
                children:
                  vendor:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  model:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  identifier:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              associated_beam:
                node: dataset
                type: NX_CHAR
                doc: |-
                  A reference to a beam emitted by this source.
                  Should be named with the same suffix, e.g.,
                  for ``source_probe`` it should refer to ``beam_probe``.

                  Example:
                    * /entry/instrument/source_probe/associated_beam = /entry/instrument/beam_probe
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          source_pump:
            node: group
            class: NXsource
            occurs: {min: 0}
            doc: |-
              The source used to generate the :ref:`beam_pump </NXmpes/ENTRY/INSTRUMENT/beam_pump-group>`
              in pump-probe experiments.

              Properties refer strictly to parameters of the source, not of the output beam.
            children:
              type:
                node: dataset
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              name:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              probe:
                node: dataset
                occurs: {min: 0}
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              device_information:
                node: group
                class: NXfabrication
                occurs: {min: 0}
                recommended: true
                children:
                  vendor:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  model:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  identifier:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              associated_beam:
                node: dataset
                type: NX_CHAR
                doc: |-
                  A reference to a beam emitted by this source.
                  Should be named with the same suffix, e.g.,
                  for ``source_pump`` it should refer to ``beam_pump``.

                  Example:
                    * /entry/instrument/source_pump/associated_beam = /entry/instrument/beam_pump
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          source_TYPE:
            node: group
            name: {template: 'source_{TYPE}'}
            class: NXsource
            occurs: {min: 0}
            doc: |-
              Any other source used to generate a beam.

              This group is to be used for any additional beams that are not described by
              :ref:`source_probe </NXmpes/ENTRY/INSTRUMENT/source_probe-group>` or
              :ref:`source_pump </NXmpes/ENTRY/INSTRUMENT/source_pump-group>`.

              Examples could be a low energy electron source for charge neutralization
              (see also :ref:`flood_gun </NXmpes/ENTRY/INSTRUMENT/flood_gun-group>`)
              or an additional laser source.

              Properties refer strictly to parameters of the source, not of the output beam.

              Note that the uppercase notation in ``source_TYPE`` means that multiple sources can
              be provided. The uppercase part can be substituted with any string that consists
              of alphanumeric characters, including both uppercase and lowercase letters from A to Z
              and numerical digits from 0 to 9. For example, in pump-probe experiments, it is possible
              to have both a ``source_laser`` and a ``source_electron``.
            children:
              type:
                node: dataset
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              name:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              probe:
                node: dataset
                occurs: {min: 0}
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              device_information:
                node: group
                class: NXfabrication
                occurs: {min: 0}
                recommended: true
                children:
                  vendor:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  model:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  identifier:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              associated_beam:
                node: dataset
                type: NX_CHAR
                doc: |-
                  A reference to a beam emitted by this source.
                  Should be named with the same suffix, e.g.,
                  for ``source_laser`` it should refer to ``beam_laser``.

                  Example:
                    * /entry/instrument/source_laser/associated_beam = /entry/instrument/beam_laser
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          beam_probe:
            node: group
            class: NXbeam
            doc: |-
              Properties of the probe beam at a given location.

              This is the beam that is used to facilitate the photoemission during MPES
              experiments.
            children:
              distance:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: |-
                  Distance between the point where the current NXbeam instance is evaluating
                  the beam properties and the point where the beam interacts with the sample.
                  For photoemission, the latter is the point where the the centre of the beam
                  touches the sample surface.
                via: [T1, T6, T7]
                provisional: [Q1]
              incident_energy:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ENERGY}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              incident_energy_spread:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_ENERGY}
                via: [T1, T6, T7]
                provisional: [Q1]
              incident_polarization:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_ANY}
                via: [T1, T6, T7]
                provisional: [Q1]
              extent:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
                via: [T1, T6, T7]
                provisional: [Q1]
              associated_source:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_CHAR
                doc: |-
                  The source that emitted this beam.
                  Should be named with the same suffix, e.g.,
                  for ``beam_probe`` it should refer to ``source_probe``.
                  This should be specified if an associated source exists.

                  Example:
                    * /entry/instrument/beam_probe/associated_source = /entry/instrument/source_probe
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          beam_pump:
            node: group
            class: NXbeam
            occurs: {min: 0}
            doc: |-
              Properties of the pump beam at a given location.

              In pump-probe experiments, this is the beam that excites the system,
              initiating a change in its state. It sets the timing for the experiment
              by defining time zero in a pump-probe setup.
            children:
              distance:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: |-
                  Distance between the point where the current NXbeam instance is evaluating
                  the beam properties and the point where the beam interacts with the sample.
                  For photoemission, the latter is the point where the the centre of the beam
                  touches the sample surface.
                via: [T1, T6, T7]
                provisional: [Q1]
              incident_energy:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ENERGY}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              incident_energy_spread:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_ENERGY}
                via: [T1, T6, T7]
                provisional: [Q1]
              incident_polarization:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_ANY}
                via: [T1, T6, T7]
                provisional: [Q1]
              extent:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
                via: [T1, T6, T7]
                provisional: [Q1]
              associated_source:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_CHAR
                doc: |-
                  The source that emitted this beam.
                  Should be named with the same suffix, e.g.,
                  for ``beam_pump`` it should refer to ``source_pump``.
                  This should be specified if an associated source exists.

                  Example:
                    * /entry/instrument/beam_pump/associated_source = /entry/instrument/source_pump
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          beam_TYPE:
            node: group
            name: {template: 'beam_{TYPE}'}
            class: NXbeam
            occurs: {min: 0}
            doc: |-
              Properties of any other beam at a given location.

              This group is to be used for any additional beams that are not described by
              :ref:`beam_probe </NXmpes/ENTRY/INSTRUMENT/beam_probe-group>` or
              :ref:`beam_pump </NXmpes/ENTRY/INSTRUMENT/beam_pump-group>`.

              Should be named with the same suffix as ``source_TYPE``, e.g.,
              for ``source_laser`` it should refer to ``beam_laser``.
            children:
              distance:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: |-
                  Distance between the point where the current NXbeam instance is evaluating
                  the beam properties and the point where the beam interacts with the sample.
                  For photoemission, the latter is the point where the the centre of the beam
                  touches the sample surface.
                via: [T1, T6, T7]
                provisional: [Q1]
              incident_energy:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ENERGY}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              incident_energy_spread:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_ENERGY}
                via: [T1, T6, T7]
                provisional: [Q1]
              incident_polarization:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                units: {category: NX_ANY}
                via: [T1, T6, T7]
                provisional: [Q1]
              extent:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
                via: [T1, T6, T7]
                provisional: [Q1]
              associated_source:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_CHAR
                doc: |-
                  The source that emitted this beam.
                  Should be named with the same suffix, e.g.,
                  for ``beam_laser`` it should refer to ``source_laser``.
                  This should be specified if an associated source exists.

                  Example:
                    * /entry/instrument/beam_laser/associated_source = /entry/instrument/source_laser
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T3, T6, T7]
            provisional: [Q1, Q3]
          ELECTRONANALYZER:
            node: group
            name: {any: true}
            class: NXelectronanalyzer
            children:
              device_information:
                node: group
                class: NXfabrication
                occurs: {min: 0}
                recommended: true
                children:
                  vendor:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  model:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                  identifier:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    via: [T0, T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              description:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              work_function:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_FLOAT
