nxds: '0.1'
class: NXxas
category: application
describes: NXroot
doc: |-
  This is an application definition for raw data from an X-ray absorption spectroscopy experiment.

  This is essentially a scan on energy versus incoming/
  absorbed beam.
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  nP: {doc: Number of points}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      definition:
        node: dataset
        enum: [NXxas]
        doc: 'Official NeXus NXDL schema to which this file conforms '
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        children:
          SOURCE:
            node: group
            name: {any: true}
            class: NXsource
            children:
              type:
                node: dataset
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              name:
                node: dataset
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              probe:
                node: dataset
                enum: [x-ray]
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T2, T5, T7]
            provisional: [Q1, Q2, Q11]
          monochromator:
            node: group
            class: NXmonochromator
            children:
              energy:
                node: dataset
                type: NX_FLOAT
                shape: [nP]
                attributes:
                  axis:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['1']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          incoming_beam:
            node: group
            class: NXdetector
            children:
              data:
                node: dataset
                type: NX_NUMBER
                shape: [nP]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          absorbed_beam:
            node: group
            class: NXdetector
            children:
              data:
                node: dataset
                type: NX_NUMBER
                shape: [nP]
                doc: This data corresponds to the sample signal.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      SAMPLE:
        node: group
        name: {any: true}
        class: NXsample
        children:
          name:
            node: dataset
            doc: Descriptive name of sample
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      MONITOR:
        node: group
        name: {any: true}
        class: NXmonitor
        children:
          mode:
            node: dataset
            enum: [monitor, timer]
            doc: |-
              Count to a preset value based on either clock time (timer)
              or received monitor counts (monitor).
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          preset:
            node: dataset
            type: NX_FLOAT
            doc: preset value for time or monitor
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          data:
            node: dataset
            type: NX_NUMBER
            shape: [nP]
            doc: This field could be a link to ``/NXentry/NXinstrument/incoming_beam:NXdetector/data``
            via: [T1, T5, T7, T9]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      DATA:
        node: group
        name: {any: true}
        class: NXdata
        children:
          energy:
            node: link
            target: ENTRY/INSTRUMENT/monochromator/energy
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
          absorbed_beam:
            node: link
            target: ENTRY/INSTRUMENT/absorbed_beam/data
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
          mode:
            node: dataset
            enum: [Total Electron Yield, Partial Electron Yield, Auger Electron Yield, Fluorescence
                Yield, Transmission]
            doc: Detection method used for observing the sample absorption (pick one from
              the enumerated list and spell exactly)
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
