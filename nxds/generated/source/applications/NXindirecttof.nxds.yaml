nxds: '0.1'
class: NXindirecttof
category: application
extends: NXtofraw
describes: NXroot
doc: This is a application definition for raw data from an indirect geometry TOF spectrometer
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  nDet: {doc: Number of detectors}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      definition:
        node: dataset
        enum: [NXindirecttof]
        doc: 'Official NeXus NXDL schema to which this file conforms '
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        children:
          analyser:
            node: group
            class: NXmonochromator
            children:
              energy:
                node: dataset
                type: NX_FLOAT
                shape: [nDet]
                units: {category: NX_ENERGY}
                doc: 'analyzed energy '
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              polar_angle:
                node: dataset
                type: NX_FLOAT
                shape: [nDet]
                units: {category: NX_ANGLE}
                doc: polar angle towards sample
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              distance:
                node: dataset
                type: NX_FLOAT
                shape: [nDet]
                units: {category: NX_LENGTH}
                doc: distance from sample
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
