nxds: '0.1'
class: NXtofnpd
category: application
describes: NXroot
doc: This is a application definition for raw data from a TOF neutron powder diffractometer
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  nDet: {doc: Number of detectors}
  nTimeChan: {doc: nTimeChan description}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      definition:
        node: dataset
        enum: [NXtofnpd]
        doc: 'Official NeXus NXDL schema to which this file conforms '
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      pre_sample_flightpath:
        node: dataset
        type: NX_FLOAT
        units: {category: NX_LENGTH}
        doc: |-
          This is the flight path before the sample position. This can be determined by a chopper,
          by the moderator or the source itself. In other words: it the distance to the component
          which gives the T0 signal to the detector electronics. If another component in the
          NXinstrument hierarchy provides this information, this should be a link.
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      user:
        node: group
        class: NXuser
        children:
          name:
            node: dataset
            type: NX_CHAR
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        children:
          detector:
            node: group
            class: NXdetector
            children:
              data:
                node: dataset
                type: NX_INT
                shape: [nDet, nTimeChan]
                attributes:
                  signal:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['1']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              detector_number:
                node: dataset
                type: NX_INT
                shape: [nDet]
                attributes:
                  axis:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['2']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              distance:
                node: dataset
                type: NX_FLOAT
                shape: [nDet]
                units: {category: NX_LENGTH}
                doc: distance to sample for each detector
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              time_of_flight:
                node: dataset
                type: NX_FLOAT
                shape: [nTimeChan]
                units: {category: NX_TIME_OF_FLIGHT}
                attributes:
                  axis:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['1']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              polar_angle:
                node: dataset
                type: NX_FLOAT
                shape: [nDet]
                units: {category: NX_ANGLE}
                doc: polar angle for each detector element
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              azimuthal_angle:
                node: dataset
                type: NX_FLOAT
                shape: [nDet]
                units: {category: NX_ANGLE}
                doc: azimuthal angle for each detector element
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      SAMPLE:
        node: group
        name: {any: true}
        class: NXsample
        children:
          name:
            node: dataset
            doc: Descriptive name of sample
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      MONITOR:
        node: group
        name: {any: true}
        class: NXmonitor
        children:
          mode:
            node: dataset
            enum: [monitor, timer]
            doc: |-
              Count to a preset value based on either clock time (timer)
              or received monitor counts (monitor).
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          preset:
            node: dataset
            type: NX_FLOAT
            doc: preset value for time or monitor
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          distance:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_LENGTH}
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          data:
            node: dataset
            type: NX_INT
            shape: [nTimeChan]
            attributes:
              signal:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
            via: [T1, T5, T7, T9]
            provisional: [Q1, Q2]
          time_of_flight:
            node: dataset
            type: NX_FLOAT
            shape: [nTimeChan]
            units: {category: NX_TIME_OF_FLIGHT}
            attributes:
              axis:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
            via: [T1, T5, T7, T9]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      data:
        node: group
        class: NXdata
        children:
          data:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/data
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
          detector_number:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/detector_number
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
          time_of_flight:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/time_of_flight
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
