nxds: '0.1'
class: NXstxm
category: application
describes: NXroot
doc: |-
  Application definition for a STXM instrument.

  The interferometer
  position measurements, monochromator photon energy values and
  detector measurements are all treated as NXdetectors and stored
  within the NXinstrument group as lists of values stored in
  chronological order. The NXdata group then holds another version
  of the data in a regular 3D array (NumE by NumY by NumX, for a
  total of nP points in a sample image stack type scan). The former
  data values should be stored with a minimum loss of precision, while
  the latter values can be simplified and/or approximated in order to
  fit the constraints of a regular 3D array. 'Line scans' and 'point spectra'
  are just sample_image scan types with reduced dimensions in the same way
  as single images have reduced E dimensions compared to image 'stacks'.
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  nP: {doc: Total number of scan points}
  nE: {doc: Number of photon energies scanned}
  nX: {doc: Number of pixels in X direction}
  nY: {doc: Number of pixels in Y direction}
  detectorRank:
    doc: Rank of data array provided by the detector for a single measurement
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      end_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      definition:
        node: dataset
        occurs: {min: 1, max: 1}
        type: NX_CHAR
        enum: [NXstxm]
        doc: 'Official NeXus NXDL schema to which this file conforms '
        via: [T1, T6]
        provisional: [Q1]
      INSTRUMENT:
        node: group
        name: {any: true}
        class: NXinstrument
        occurs: {min: 1, max: 1}
        children:
          SOURCE:
            node: group
            name: {any: true}
            class: NXsource
            occurs: {min: 1, max: 1}
            children:
              type:
                node: dataset
                occurs: {min: 1, max: 1}
                via: [T0, T1, T6]
                provisional: [Q1]
              name:
                node: dataset
                occurs: {min: 1, max: 1}
                via: [T0, T1, T6]
                provisional: [Q1]
              probe:
                node: dataset
                occurs: {min: 1, max: 1}
                via: [T0, T1, T6]
                provisional: [Q1]
            via: [T1, T2, T6]
            provisional: [Q1, Q11]
          monochromator:
            node: group
            class: NXmonochromator
            occurs: {min: 1, max: 1}
            children:
              energy:
                node: dataset
                occurs: {min: 1, max: 1}
                type: NX_FLOAT
                shape: [nP]
                via: [T1, T6, T9]
                provisional: [Q1]
            via: [T1, T6]
            provisional: [Q1]
          DETECTOR:
            node: group
            name: {any: true}
            class: NXdetector
            occurs: {min: 1}
            children:
              data:
                node: dataset
                type: NX_NUMBER
                shape:
                  rank: {expr: 1+detectorRank}
                  dims: [nP]
                via: [T1, T5, T7, T9, T9b, T9d]
                provisional: [Q1, Q2]
            via: [T1, T2, T6, T7]
            provisional: [Q1, Q11]
          sample_x:
            node: group
            class: NXdetector
            occurs: {min: 0, max: 1}
            doc: Measurements of the sample position from the x-axis interferometer.
            children:
              data:
                node: dataset
                type: NX_FLOAT
                shape: [nP]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T6]
            provisional: [Q1]
          sample_y:
            node: group
            class: NXdetector
            occurs: {min: 0, max: 1}
            doc: Measurements of the sample position from the y-axis interferometer.
            children:
              data:
                node: dataset
                type: NX_FLOAT
                shape: [nP]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T6]
            provisional: [Q1]
          sample_z:
            node: group
            class: NXdetector
            occurs: {min: 0, max: 1}
            doc: Measurements of the sample position from the z-axis interferometer.
            children:
              data:
                node: dataset
                type: NX_FLOAT
                shape: [nP]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
            via: [T1, T6]
            provisional: [Q1]
        via: [T1, T2, T6]
        provisional: [Q1, Q11]
      SAMPLE:
        node: group
        name: {any: true}
        class: NXsample
        children:
          rotation_angle:
            node: dataset
            type: NX_FLOAT
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      DATA:
        node: group
        name: {any: true}
        class: NXdata
        children:
          stxm_scan_type:
            node: dataset
            occurs: {min: 1, max: 1}
            enum: [sample point spectrum, sample line spectrum, sample image, sample image
                stack, sample focus, osa image, osa focus, detector image, generic scan]
            doc: |-
              Label for typical scan types as a convenience for humans.
              Each label corresponds to a specific set of axes being scanned
              to produce a data array of shape:

              * sample point spectrum: (photon_energy,)
              * sample line spectrum: (photon_energy, sample_y/sample_x)
              * sample image: (sample_y, sample_x)
              * sample image stack: (photon_energy, sample_y, sample_x)
              * sample focus: (zoneplate_z, sample_y/sample_x)
              * osa image: (osa_y, osa_x)
              * osa focus: (zoneplate_z, osa_y/osa_x)
              * detector image: (detector_y, detector_x)

              The "generic scan" string is to be used when none of the
              other choices are appropriate.
            via: [T0, T1, T6]
            provisional: [Q1]
          data:
            node: dataset
            type: NX_NUMBER
            doc: |-
              Detectors that provide more than one value per scan point should be summarised
              to a single value per scan point for this array in order to simplify plotting.

              Note that 'Line scans' and focus type scans measure along one spatial dimension
              but are not restricted to being parallel to the X or Y axes. Such scans
              should therefore use a single dimension for the positions along the spatial
              line. The 'sample_x' and 'sample_y' fields should then contain lists of the
              x- and y-positions and should both have the 'axis' attribute pointing to the same dimension.
            attributes:
              signal:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          energy:
            node: dataset
            occurs: {min: 1, max: 1}
            type: NX_FLOAT
            shape: [nE]
            doc: |-
              List of photon energies of the X-ray beam. If scanned through multiple values,
              then an 'axis' attribute will be required to link the field to the appropriate data array dimension.
            via: [T1, T6, T9]
            provisional: [Q1]
          sample_y:
            node: dataset
            occurs: {min: 1, max: 1}
            type: NX_FLOAT
            shape: [nY]
            doc: |-
              List of Y positions on the sample. If scanned through multiple values,
              then an 'axis' attribute will be required to link the field to the appropriate data array dimension.
            via: [T1, T6, T9]
            provisional: [Q1]
          sample_x:
            node: dataset
            occurs: {min: 1, max: 1}
            type: NX_FLOAT
            shape: [nX]
            doc: |-
              List of X positions on the sample. If scanned through multiple values,
              then an 'axis' attribute will be required to link the field to the appropriate data array dimension.
            via: [T1, T6, T9]
            provisional: [Q1]
        via: [T1, T2, T5, T7]
        provisional: [Q1, Q2, Q11]
      control:
        node: group
        class: NXmonitor
        occurs: {min: 0, max: 1}
        children:
          data:
            node: dataset
            type: NX_FLOAT
            doc: |-
              Values to use to normalise for time-variations in photon flux. Typically, the synchrotron storage ring
              electron beam current is used as a proxy for the X-ray beam intensity. Array must have same shape as the
              NXdata groups.
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T6]
        provisional: [Q1]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
