                provisional: [Q1]
              description:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
              formula_description:
                node: dataset
                occurs: {min: 0}
                recommended: true
                via: [T0, T1, T6, T7]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          figure_of_meritMETRIC:
            node: dataset
            name: {template: 'figure_of_merit{METRIC}'}
            occurs: {min: 0}
