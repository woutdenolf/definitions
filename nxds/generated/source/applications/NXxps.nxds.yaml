                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          error_function:
            node: group
            class: NXfit_function
            occurs: {min: 0}
            recommended: true
            children:
              function_type:
                node: dataset
                occurs: {min: 0}
