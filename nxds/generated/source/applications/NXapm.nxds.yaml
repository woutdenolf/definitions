            provisional: [Q1, Q2]
          x_direction:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            via: [T1, T6, T7]
            provisional: [Q1]
          y:
            node: dataset
            type: NX_NUMBER
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          y_direction:
            node: dataset
            occurs: {min: 0}
            recommended: true
            type: NX_CHAR
            via: [T1, T6, T7]
            provisional: [Q1]
          z:
