                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      serial_number:
                        node: dataset
                        occurs: {min: 0}
                        recommended: true
                        type: NX_CHAR
                        via: [T1, T6, T7]
                        provisional: [Q1]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          eventID:
            node: group
            name: {template: 'event{ID}'}
            class: NXapm_event_data
            occurs: {min: 0, max: unbounded}
            children:
              start_time:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_DATE_TIME
                via: [T1, T6, T7]
                provisional: [Q1]
              end_time:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_DATE_TIME
                via: [T1, T6, T7]
                provisional: [Q1]
              instrument:
                node: group
                class: NXapm_instrument
                occurs: {min: 0}
                recommended: true
                children:
                  reflectron:
                    node: group
                    class: NXcomponent
                    occurs: {min: 0}
                    recommended: true
                    children:
                      voltage:
                        node: dataset
                        type: NX_FLOAT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  local_electrode:
                    node: group
                    class: NXelectromagnetic_lens
                    occurs: {min: 0}
                    recommended: true
                    children:
                      voltage:
                        node: dataset
                        type: NX_FLOAT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  pulser:
                    node: group
                    class: NXcomponent
                    occurs: {min: 0}
                    recommended: true
                    children:
                      pulse_mode:
                        node: dataset
                        type: NX_CHAR
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      pulse_frequency:
                        node: dataset
                        type: NX_FLOAT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      pulse_fraction:
                        node: dataset
                        type: NX_FLOAT
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      pulse_voltage:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_FLOAT
                        shape: [n]
                        via: [T1, T6, T7, T9]
                        provisional: [Q1]
                      pulse_number:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_UINT
                        shape: [n]
                        via: [T1, T6, T7, T9]
                        provisional: [Q1]
                      standing_voltage:
                        node: dataset
                        occurs: {min: 0}
                        type: NX_FLOAT
                        shape: [n]
                        via: [T1, T6, T7, T9]
                        provisional: [Q1]
                      sourceID:
                        node: group
                        name: {template: 'source{ID}'}
                        class: NXsource
                        occurs: {min: 0, max: 2}
                        children:
                          wavelength:
                            node: dataset
                            occurs: {min: 0}
                            recommended: true
                            type: NX_FLOAT
                            units: {category: NX_WAVELENGTH}
                            via: [T1, T6, T7]
                            provisional: [Q1]
                          power:
                            node: dataset
                            type: NX_FLOAT
                            units: {category: NX_POWER}
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          pulse_energy:
                            node: dataset
                            type: NX_FLOAT
                            shape: [n]
                            via: [T1, T5, T7, T9]
                            provisional: [Q1, Q2]
                        via: [T1, T3, T6]
                        provisional: [Q1, Q3]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  stage:
                    node: group
                    class: NXmanipulator
                    children:
                      temperature_sensor:
                        node: group
                        class: NXsensor
                        children:
                          measurement:
                            node: dataset
                            type: NX_CHAR
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          value:
                            node: dataset
                            type: NX_FLOAT
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  analysis_chamber:
                    node: group
                    class: NXcomponent
                    children:
                      pressure_sensor:
                        node: group
                        class: NXsensor
                        children:
                          measurement:
                            node: dataset
                            type: NX_CHAR
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                          value:
                            node: dataset
                            type: NX_FLOAT
                            via: [T1, T5, T7]
                            provisional: [Q1, Q2]
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  control:
                    node: group
                    class: NXparameters
                    occurs: {min: 0}
                    recommended: true
                    children:
                      evaporation_control:
                        node: dataset
                        type: NX_CHAR
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      target_detection_rate:
                        node: dataset
                        type: NX_NUMBER
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
            via: [T1, T3, T6]
            provisional: [Q1, Q3]
        via: [T1, T6, T7]
        provisional: [Q1]
      simulation:
        node: group
        class: NXapm_simulation
        occurs: {min: 0}
        via: [T1, T6, T7]
        provisional: [Q1]
      atom_probeID:
        node: group
        name: {template: 'atom_probe{ID}'}
        class: NXroi_process
        occurs: {min: 0, max: unbounded}
        doc: |-
          A region-of-interest analyzed either during or after the session for which
          specific processed data of the measured or simulated data are available.

          If a single instance is required the group should be named atom_probe.
          If multiple groups are required these should be named atom_probe1, atom_probe2,
          and so on and so forth.
        children:
          initial_specimen:
            node: group
            class: NXimage
            occurs: {min: 0}
            recommended: true
            doc: SEM or TEM image of the initial specimen taken before the measurement.
            children:
              image_2d:
                node: group
                class: NXdata
                attributes:
                  signal:
                    type: NX_CHAR
                    via: [T1, T5]
                    provisional: [Q2]
                  axes:
                    type: NX_CHAR
                    via: [T1, T5]
                    provisional: [Q2]
                  AXISNAME_indices:
                    name: {template: '{AXISNAME}_indices'}
                    type: NX_UINT
                    via: [T1, T3, T5]
                    provisional: [Q2, Q3]
                children:
                  real:
                    node: dataset
                    type: NX_NUMBER
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  axis_j:
                    node: dataset
                    type: NX_NUMBER
                    shape: [n_j]
                    attributes:
                      long_name:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  axis_i:
                    node: dataset
                    type: NX_NUMBER
                    shape: [n_i]
                    attributes:
                      long_name:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          final_specimen:
            node: group
            class: NXimage
            occurs: {min: 0}
            recommended: true
            doc: |-
              SEM or TEM image of the final specimen taken after completion of the
              measurement.
            children:
              image_2d:
                node: group
                class: NXdata
                attributes:
                  signal:
                    type: NX_CHAR
                    via: [T1, T5]
                    provisional: [Q2]
                  axes:
                    type: NX_CHAR
                    via: [T1, T5]
                    provisional: [Q2]
                  AXISNAME_indices:
                    name: {template: '{AXISNAME}_indices'}
                    type: NX_UINT
                    via: [T1, T3, T5]
                    provisional: [Q2, Q3]
                children:
                  real:
                    node: dataset
                    type: NX_NUMBER
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  axis_j:
                    node: dataset
                    type: NX_NUMBER
                    shape: [n_j]
                    attributes:
                      long_name:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                  axis_i:
                    node: dataset
                    type: NX_NUMBER
                    shape: [n_i]
                    attributes:
                      long_name:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7, T9]
                    provisional: [Q1, Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T6, T7]
            provisional: [Q1]
          raw_data:
            node: group
            class: NXprocess
            occurs: {min: 0}
            doc: |-
              Document the control software that was used on the instrument with which raw data
              were collected.

              For almost all atom probe instruments, the recorded raw data and metadata follow
              proprietary semantics. Therefore, this group can currently often not be filled with
              more than the control software and some pointing to digital artifacts (e.g. proprietary files)
              that have been collected during the measurement in an effort to document as best as
              possible all steps of an analysis workflow.

              The physical quantities measured in an atom probe experiment are time-of-flight and
              tuples of arrival_time_pairs as a function of the event chain on the pulser.
              From these tuples, hits are computed in a process called hit_finding.
            children:
              sequence_index:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_POSINT
                via: [T1, T6, T7]
                provisional: [Q1]
              programID:
                node: group
                name: {template: 'program{ID}'}
                class: NXprogram
                occurs: {min: 0, max: unbounded}
                doc: |-
                  The control software that was used for running the measurement.

                  At least the main software should be reported. If this is the only program
                  to report name the group "program" and use its below fields program and
                  version to detail the version used. E.g. program AP Suite, version 6.3

                  It is recommended to report multiple programs though, i.e. also the libraries
                  and dependencies of the software. In the case of AP Suite/IVAS this can be used
                  to document the AP Suite GUI, LAS, CamecaRoot, and CernRoot versions.
                  In this case always name the program groups program1, program2, ...
                  with program one being AP Suite/IVAS.

                  In the case of an open-source instrument, like P. Felfer's Oxcart or G. Schmitz's
                  M-TAP instruments, also use program1, program2, ... with program1 representing
                  the control software e.g. `M. Monajem and P. Felfer PYCCAPT <https://pyccapt.readthedocs.io/en/latest/>`_.
                  Further instances (program2, ...) can be used to list the dependencies, the
                  python virtual environment.
                children:
                  program:
                    node: dataset
                    type: NX_CHAR
                    attributes:
                      version:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T3, T6]
                provisional: [Q1, Q3]
              source:
                node: group
                class: NXnote
                occurs: {min: 0}
                recommended: true
                doc: |-
                  Possibility to point to files that contain raw data.

                  Exemplar files that could be pointed to here when working with
                  AMETEK/Cameca instruments are the proprietary STR, RRAW, or HITS
                  files that AP Suite/IVAS generates.
                children:
                  type:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  file_name:
                    node: dataset
                    type: NX_CHAR
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  checksum:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  algorithm:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              number_of_dld_wires:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_UINT
                units: {category: NX_UNITLESS}
                enum: ['1', '2', '3']
                doc: The number of delay-line-detector (DLD) wires present.
                via: [T1, T6, T7]
                provisional: [Q1]
              dld_wire_names:
                node: dataset
                occurs: {min: 0}
                type: NX_CHAR
                shape: [n_dld, 2]
                doc: |-
                  Alias tuple, typical for the begin and the end of each DLD wire
                  of the detector. Order follows arrival_time_pairs.

                  The order of the first dimension should match that of the
                  second dimension of the arrival_time_pairs field.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              arrival_time_pairs:
                node: dataset
                occurs: {min: 0}
                type: NX_NUMBER
                shape: [p, n_dld, 2]
                units: {category: NX_TIME}
                doc: |-
                  Raw readings from the analog-to-digital-converter
                  timing circuits of the detector wires.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          hit_finding:
            node: group
            class: NXprocess
            occurs: {min: 0}
            recommended: true
            doc: |-
              The configuration of a hit finding algorithm and its output.

              Hit finding is the process of deciding which detector signals are significant
              and assigning specific ions colliding with the detector
              to each observed event.
            children:
              sequence_index:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_POSINT
                via: [T1, T6, T7]
                provisional: [Q1]
              programID:
                node: group
                name: {template: 'program{ID}'}
                class: NXprogram
                occurs: {min: 0, max: unbounded}
                children:
                  program:
                    node: dataset
                    type: NX_CHAR
                    attributes:
                      version:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T3, T6]
                provisional: [Q1, Q3]
              config:
                node: group
                class: NXnote
                occurs: {min: 0}
                recommended: true
                children:
                  type:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  file_name:
                    node: dataset
                    type: NX_CHAR
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  checksum:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  algorithm:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              hit_positions:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_NUMBER
                shape: [p_out, 2]
                units: {category: NX_LENGTH}
                doc: |-
                  Evaluated ion impact coordinates on the detector.
                  Use the depends_on field to specify which reference
                  frame the positions are defined in.
                attributes:
                  depends_on:
                    type: NX_CHAR
                    doc: |-
                      Contains the path to an instance of NX_coordinate_system
                      in which the positions are defined.
                    via: [T1, T5]
                    provisional: [Q2]
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              total_event_golden:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                units: {category: NX_UNITLESS}
                doc: |-
                  Number of events of type "golden" when APSuite/IVAS was used as the
                  software with which the measurement was performed.

                  The value can be extracted from the CRunHeader.fTotalEventGolden
                  field of a CamecaRoot RHIT/HITS file.
                via: [T1, T6, T7]
                provisional: [Q1]
              total_event_incomplete:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                units: {category: NX_UNITLESS}
                doc: |-
                  Number of events of type "incomplete" when APSuite/IVAS was used as the
                  software with which the measurement was performed.

                  The value can be extracted from the CRunHeader.fTotalEventIncomplete
                  field of a CamecaRoot RHIT/HITS file.
                via: [T1, T6, T7]
                provisional: [Q1]
              total_event_multiple:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                units: {category: NX_UNITLESS}
                doc: |-
                  Number of events of type "multiple" when APSuite/IVAS was used as the
                  software with which the measurement was performed.

                  The value can be extracted from the CRunHeader.fTotalEventMultiple
                  field of a CamecaRoot RHIT/HITS file.
                via: [T1, T6, T7]
                provisional: [Q1]
              total_event_partials:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                units: {category: NX_UNITLESS}
                doc: |-
                  Number of events of type "partials" when APSuite/IVAS was used as the
                  software with which the measurement was performed.

                  The value can be extracted from the CRunHeader.fTotalEventPartials
                  field of a CamecaRoot RHIT/HITS file.
                via: [T1, T6, T7]
                provisional: [Q1]
              total_event_record:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                units: {category: NX_UNITLESS}
                doc: |-
                  Number of events when APSuite/IVAS was used as the
                  software with which the measurement was performed.

                  The value can be extracted from the CRunHeader.fTotalEventRecords
                  field of a CamecaRoot RHIT/HITS file.
                via: [T1, T6, T7]
                provisional: [Q1]
              hit_quality_type:
                node: dataset
                occurs: {min: 0}
                type: NX_CHAR
                shape: [n_ht]
                doc: |-
                  Hit quality is an integer that specifies which category/type a hit was assigned to.
                  This field lists the human-readable, possibly though proprietary types distinguished.
                  The indices of this array are used in hit_quality to encode hit_quality for each
                  pulse in a more efficient way than by repeating the string that is used for each
                  type as it is provided in this field.

                  As an example, assume two types, "golden" and "partial", are distinguished.
                  If hit_quality_type stores the array "golden", "partial", the index 0
                  in hit_quality identifies all those pulses of category "golden",
                  while the index 1 in hit_quality identifies all of category "partial".
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              hit_quality:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [p_out]
                units: {category: NX_UNITLESS}
                doc: |-
                  Hit quality identifier for each pulse.
                  Identifier has to be within hit_quality_type.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
              hit_multiplicity:
                node: dataset
                occurs: {min: 0}
                type: NX_UINT
                shape: [p_out]
                units: {category: NX_UNITLESS}
                doc: |-
                  The number of ions determined to have been collected on the same pulse.
                  These ions may hit different pixels, or even the same detector pixel.
                  The hit_multiplicity is not related to the makeup of the ions and should not be
                  confused with the number of atoms or elements that constitute a molecular ion.
                via: [T1, T6, T7, T9]
                provisional: [Q1]
            via: [T1, T6, T7]
            provisional: [Q1]
          hit_spatial_filtering:
            node: group
            class: NXprocess
            occurs: {min: 0}
            recommended: true
            children:
              sequence_index:
                node: dataset
                occurs: {min: 0}
                recommended: true
                type: NX_POSINT
                via: [T1, T6, T7]
                provisional: [Q1]
              programID:
                node: group
                name: {template: 'program{ID}'}
                class: NXprogram
                occurs: {min: 1, max: unbounded}
                children:
                  program:
                    node: dataset
                    type: NX_CHAR
                    attributes:
                      version:
                        type: NX_CHAR
                        via: [T1, T5]
                        provisional: [Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T3, T6]
                provisional: [Q1, Q3]
              source:
                node: group
                class: NXnote
                occurs: {min: 0}
                children:
                  type:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  file_name:
                    node: dataset
                    type: NX_CHAR
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                  checksum:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                  algorithm:
                    node: dataset
                    occurs: {min: 0}
                    recommended: true
                    type: NX_CHAR
                    via: [T1, T6, T7]
                    provisional: [Q1]
                via: [T1, T6, T7]
                provisional: [Q1]
              evaporation_id_offset:
                node: dataset
                type: NX_INT
                units: {category: NX_UNITLESS}
                doc: |-
                  Integer which defines the first evaporation_id.
                  Typically, this is either zero or one.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              evaporation_id:
                node: dataset
                type: NX_INT
                shape: [n]
                units: {category: NX_UNITLESS}
                doc: |-
                  There are two possibilities to report evaporation_id values:

                  If evaporation_id_offset is provided, the evaporation_id values are defined
                  by the sequence :math:`[evaporation\_id\_offset, evaporation\_id\_offset + n]`
                  with :math:`n` the number of ions in the reconstructed volume.

                  Alternatively, evaporation_id_offset is not provided but instead a
                  a sequence of :math:`n` values is defined, these integer values
                  do not need to be sorted.
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              hit_filter:
                node: group
                class: NXcs_filter_boolean_mask
                occurs: {min: 0}
                recommended: true
                children:
                  number_of_objects:
                    node: dataset
