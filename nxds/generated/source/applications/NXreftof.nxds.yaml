nxds: '0.1'
class: NXreftof
category: application
describes: NXroot
doc: 'This is an application definition for raw data from a TOF reflectometer. '
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  xSize: {doc: xSize description}
  ySize: {doc: ySize description}
  nTOF: {doc: nTOF description}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      end_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      definition:
        node: dataset
        enum: [NXreftof]
        doc: 'Official NeXus NXDL schema to which this file conforms '
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      instrument:
        node: group
        class: NXinstrument
        children:
          name:
            node: dataset
            type: NX_CHAR
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          chopper:
            node: group
            class: NXdisk_chopper
            children:
              distance:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: Distance between chopper and sample
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          detector:
            node: group
            class: NXdetector
            children:
              data:
                node: dataset
                type: NX_INT
                shape: [xSize, ySize, nTOF]
                attributes:
                  signal:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['1']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              time_of_flight:
                node: dataset
                type: NX_FLOAT
                shape: [nTOF]
                units: {category: NX_TIME_OF_FLIGHT}
                doc: |-
                  Array of time values for each bin in a time-of-flight
                  measurement
                attributes:
                  axis:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['3']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              distance:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              polar_angle:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ANGLE}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              x_pixel_size:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              y_pixel_size:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      sample:
        node: group
        class: NXsample
        children:
          name:
            node: dataset
            doc: Descriptive name of sample
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          rotation_angle:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_ANGLE}
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      control:
        node: group
        class: NXmonitor
        children:
          mode:
            node: dataset
            enum: [monitor, timer]
            doc: |-
              Count to a preset value based on either clock time (timer)
              or received monitor counts (monitor).
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          preset:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_ANY}
            doc: preset value for time or monitor
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          integral:
            node: dataset
            type: NX_INT
            doc: Total integral monitor counts
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          time_of_flight:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_TIME_OF_FLIGHT}
            doc: Time channels
            attributes:
              axis:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          data:
            node: dataset
            type: NX_INT
            doc: Monitor counts in each time channel
            attributes:
              signal:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      data:
        node: group
        class: NXdata
        children:
          data:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/data
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
          time_of_flight:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/time_of_flight
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
