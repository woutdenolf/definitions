nxds: '0.1'
class: NXsastof
category: application
describes: NXroot
doc: |-
  raw, 2-D SAS data with an area detector with a time-of-flight source

  It covers all raw data from any SAS techniques
  that use an area detector
  at a time-of-flight source.
defaults: {min: 1, binding: true, type: NX_CHAR}
symbols:
  nXPixel: {doc: nXPixel description}
  nYPixel: {doc: nYPixel description}
  nTOF: {doc: nTOF description}
children:
  ENTRY:
    node: group
    name: {any: true}
    class: NXentry
    children:
      title:
        node: dataset
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      start_time:
        node: dataset
        type: NX_DATE_TIME
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      definition:
        node: dataset
        enum: [NXsastof]
        doc: 'Official NeXus NXDL schema to which this file conforms '
        via: [T0, T1, T5, T7]
        provisional: [Q1, Q2]
      instrument:
        node: group
        class: NXinstrument
        children:
          source:
            node: group
            class: NXsource
            children:
              type:
                node: dataset
                doc: type of radiation source
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              name:
                node: dataset
                doc: Name of the radiation source
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
              probe:
                node: dataset
                enum: [neutron, x-ray]
                via: [T0, T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          collimator:
            node: group
            class: NXcollimator
            children:
              geometry:
                node: group
                class: NXgeometry
                children:
                  shape:
                    node: group
                    class: NXshape
                    children:
                      shape:
                        node: dataset
                        type: NX_CHAR
                        enum: [nxcylinder, nxbox]
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                      size:
                        node: dataset
                        type: NX_FLOAT
                        units: {category: NX_LENGTH}
                        doc: The collimation length
                        via: [T1, T5, T7]
                        provisional: [Q1, Q2]
                    via: [T1, T5, T7]
                    provisional: [Q1, Q2]
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          detector:
            node: group
            class: NXdetector
            children:
              data:
                node: dataset
                type: NX_NUMBER
                shape: [nXPixel, nYPixel, nTOF]
                doc: |-
                  This is area detector data, of number of x-pixel versus
                  number of y-pixels. Since the beam center is to be
                  determined as a step of data reduction, it is not necessary
                  to document or assume the position of the beam center in
                  acquired data.
                attributes:
                  signal:
                    occurs: {min: 0}
                    type: NX_POSINT
                    enum: ['1']
                    via: [T19]
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              time_of_flight:
                node: dataset
                type: NX_FLOAT
                shape: [nTOF]
                units: {category: NX_TIME_OF_FLIGHT}
                via: [T1, T5, T7, T9]
                provisional: [Q1, Q2]
              distance:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: The distance between detector and sample
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              x_pixel_size:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: Physical size of a pixel in x-direction
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              y_pixel_size:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: Size of a pixel in y direction
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              polar_angle:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ANGLE}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              azimuthal_angle:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ANGLE}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              rotation_angle:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ANGLE}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              aequatorial_angle:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_ANGLE}
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              beam_center_x:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: |-
                  This is the x position where the direct beam would hit the detector. This is a
                  length, not a pixel position, and can be outside of the actual detector.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
              beam_center_y:
                node: dataset
                type: NX_FLOAT
                units: {category: NX_LENGTH}
                doc: |-
                  This is the y position where the direct beam would hit the detector. This is a
                  length, not a pixel position, and can be outside of the actual detector.
                via: [T1, T5, T7]
                provisional: [Q1, Q2]
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          name:
            node: dataset
            type: NX_CHAR
            doc: Name of the instrument actually used to perform the experiment
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      sample:
        node: group
        class: NXsample
        children:
          name:
            node: dataset
            doc: Descriptive name of sample
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          aequatorial_angle:
            node: dataset
            type: NX_FLOAT
            units: {category: NX_ANGLE}
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      control:
        node: group
        class: NXmonitor
        children:
          mode:
            node: dataset
            enum: [monitor, timer]
            doc: 'Count to a preset value based on either clock time (timer) or received monitor
              counts (monitor). '
            via: [T0, T1, T5, T7]
            provisional: [Q1, Q2]
          preset:
            node: dataset
            type: NX_FLOAT
            doc: preset value for time or monitor
            via: [T1, T5, T7]
            provisional: [Q1, Q2]
          data:
            node: dataset
            type: NX_INT
            shape: [nTOF]
            attributes:
              signal:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
              primary:
                occurs: {min: 0}
                type: NX_POSINT
                enum: ['1']
                via: [T19]
            via: [T1, T5, T7, T9]
            provisional: [Q1, Q2]
          time_of_flight:
            node: dataset
            type: NX_FLOAT
            shape: [nTOF]
            units: {category: NX_TIME_OF_FLIGHT}
            via: [T1, T5, T7, T9]
            provisional: [Q1, Q2]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
      data:
        node: group
        class: NXdata
        children:
          data:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/data
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
          time_of_flight:
            node: link
            target: ENTRY/INSTRUMENT/DETECTOR/time_of_flight
            via: [T1, T5, T10]
            provisional: [Q2, Q8]
        via: [T1, T5, T7]
        provisional: [Q1, Q2]
    via: [T1, T2, T5, T7]
    provisional: [Q1, Q2, Q11]
via: [T8]
