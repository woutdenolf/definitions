nxds: "0.1"
class: NXcounter
category: base
extends: NXobject
defaults: {min: 0, binding: false}
children:
  mode: {node: dataset, type: NX_CHAR, enum: [timer, monitor]}
  CHANNEL_counts: {node: dataset, type: NX_INT, name: {template: "{CHANNEL}_counts"}, units: {category: NX_COUNT}}
  SENSOR: {node: group, class: NXsensor, name: {any: true}}
