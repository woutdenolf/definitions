nxds: "0.1"
class: NXdata
category: base
extends: NXobject
defaults: {min: 0, binding: false}
attributes:
  signal: {type: NX_CHAR}
  axes: {type: NX_CHAR}
children:
  DATA: {node: dataset, type: NX_NUMBER, name: {ref: "@signal"}}
  AXISNAME: {node: dataset, type: NX_CHAR_OR_NUMBER, name: {ref: "@axes"}}
