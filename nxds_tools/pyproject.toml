[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nxds-tools"
version = "0.1.0"
description = "Prototype tools for NXDS, the NeXus Definition Schema: NXDL compiler, resolver, validator and documentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
    "lxml",
    "pyyaml",
    "pydantic>=2",
    "xmlschema",
    "h5py",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]
doc = ["sphinx"]

[project.scripts]
nxds-tools = "nxds_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nxds_tools = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = ["E501", "SIM102"]

[tool.ruff.lint.isort]
force-single-line = true
