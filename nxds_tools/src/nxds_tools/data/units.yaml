# The unit symbols of the index (spec §14, `unit_symbols`): unit strings follow
# the UDUNITS-2 grammar with these symbols; `prefixed` symbols take an SI prefix.
# Angles are given their own base dimension "angle" (rad is dimensionless in
# SI), so that NX_ANGLE and NX_UNITLESS can be told apart.
prefixes: {Y: 24, Z: 21, E: 18, P: 15, T: 12, G: 9, M: 6, k: 3, h: 2, da: 1, d: -1, c: -2, m: -3, u: -6, µ: -6, μ: -6, n: -9, p: -12, f: -15, a: -18, z: -21, y: -24}
prefixed:
  m: {length: 1}
  meter: {length: 1}
  metre: {length: 1}
  g: {mass: 1}
  gram: {mass: 1}
  s: {time: 1}
  second: {time: 1}
  A: {current: 1}
  ampere: {current: 1}
  K: {temperature: 1}
  kelvin: {temperature: 1}
  mol: {amount: 1}
  cd: {luminosity: 1}
  rad: {angle: 1}
  radian: {angle: 1}
  sr: {angle: 2}
  steradian: {angle: 2}
  Hz: {time: -1}
  N: {mass: 1, length: 1, time: -2}
  Pa: {mass: 1, length: -1, time: -2}
  J: {mass: 1, length: 2, time: -2}
  eV: {mass: 1, length: 2, time: -2}
  W: {mass: 1, length: 2, time: -3}
  C: {current: 1, time: 1}
  V: {mass: 1, length: 2, time: -3, current: -1}
  ohm: {mass: 1, length: 2, time: -3, current: -2}
  Ohm: {mass: 1, length: 2, time: -3, current: -2}
  F: {mass: -1, length: -2, time: 4, current: 2}
  T: {mass: 1, time: -2, current: -1}
  Wb: {mass: 1, length: 2, time: -2, current: -1}
  H: {mass: 1, length: 2, time: -2, current: -2}
  S: {mass: -1, length: -2, time: 3, current: 2}
  Gy: {length: 2, time: -2}
  Sv: {length: 2, time: -2}
  Bq: {time: -1}
  L: {length: 3}
  l: {length: 3}
  bar: {mass: 1, length: -1, time: -2}
  barn: {length: 2}
  barns: {length: 2}
  b: {length: 2}
  B: {}
  Da: {mass: 1}
  u: {mass: 1}
  lm: {luminosity: 1, angle: 2}
  lx: {luminosity: 1, angle: 2, length: -2}
plain:
  angstrom: {length: 1}
  Angstrom: {length: 1}
  Å: {length: 1}
  A0: {length: 1}
  micron: {length: 1}
  inch: {length: 1}
  in: {length: 1}
  ft: {length: 1}
  deg: {angle: 1}
  degree: {angle: 1}
  degrees: {angle: 1}
  arcmin: {angle: 1}
  arcsec: {angle: 1}
  min: {time: 1}
  minute: {time: 1}
  h: {time: 1}
  hour: {time: 1}
  d: {time: 1}
  day: {time: 1}
  degC: {temperature: 1}
  celsius: {temperature: 1}
  degF: {temperature: 1}
  atm: {mass: 1, length: -1, time: -2}
  Torr: {mass: 1, length: -1, time: -2}
  torr: {mass: 1, length: -1, time: -2}
  mbar: {mass: 1, length: -1, time: -2}
  psi: {mass: 1, length: -1, time: -2}
  counts: {}
  count: {}
