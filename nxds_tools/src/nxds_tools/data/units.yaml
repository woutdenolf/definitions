  e: {current: 1, time: 1}
  amu: {mass: 1}
  rpm: {angle: 1, time: -1}
  pixel: {}
  pixels: {}
# Units categories that accept an empty unit string (spec §14); written to the
# index as `units.<category>.empty`.
empty_categories: [NX_COUNT, NX_UNITLESS, NX_DIMENSIONLESS, NX_ANY]
